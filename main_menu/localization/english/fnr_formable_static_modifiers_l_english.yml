l_english:

  ################################
  # Static Modifier Localization #
  ################################

    # Netherlands
      STATIC_MODIFIER_NAME_fnr_DUTCH_dutch_colonial_slavery: "The Atlantic Trade"
      STATIC_MODIFIER_DESC_fnr_DUTCH_dutch_colonial_slavery: "The Company has committed itself to the traffic in men. Its forts on the Guinea coast feed the crossing, its ships carry the cargo to the sugar islands, and its factors hold contracts to supply the plantations of rival crowns. The returns are considerable, and the burghers who hold the shares are well satisfied. Abroad, the reputation of the Republic suffers for it."

    # Prittania
      STATIC_MODIFIER_NAME_fnr_PRTTA_protect_the_realm: "Wall of Wooden Walls"
      STATIC_MODIFIER_DESC_fnr_PRTTA_protect_the_realm: "The Prittanian realm is bounded not by fortresses but by water, and the fleet is the only rampart that matters. No hostile keel may pass the narrow seas unchallenged; the ships of Prittania stand between the Brythonic peoples and every enemy that would land upon their shores."

    # Eranshar
      STATIC_MODIFIER_NAME_fnr_ershr_rise_of_zoroastrian: "The Return of Zoroastrianism"
      STATIC_MODIFIER_DESC_fnr_ershr_rise_of_zoroastrian: "After centuries in retreat, the faith of Zarathustra has been restored to the heart of the Iranian state. The sacred fires burn once more under royal patronage, and the magi again hold a place of honour at court. With the crown and the priesthood united behind the eternal flame, the faithful march with renewed conviction."

      STATIC_MODIFIER_NAME_fnr_ERSHR_magi_express_disapproval: "Magi Counsel Express Disapproval"
      STATIC_MODIFIER_DESC_fnr_ERSHR_magi_express_disapproval: "The priesthood is angered that the crown has chosen restraint over zeal toward the unbelievers. After so long waiting for the fires to return, the magi see every concession to Islam as a betrayal of the restoration, and their displeasure with the throne will linger until the realm proves its devotion once more."

      STATIC_MODIFIER_NAME_fnr_ERSHR_tolerated_majority: "Tolerated Majority"
      STATIC_MODIFIER_DESC_fnr_ERSHR_tolerated_majority: "Rather than force the old faith on an unwilling people, the crown has chosen to let the Muslim majority keep their worship in peace. The reaction cools and the realm steadies, but the sacred fire rules over subjects who do not share it, and conversion will come slowly, if it comes at all."

      STATIC_MODIFIER_NAME_fnr_ERSHR_tolerated_majority_faction_demand: "Court Demanded Tolerance"
      STATIC_MODIFIER_DESC_fnr_ERSHR_tolerated_majority_faction_demand: "Rather than force the old faith on an unwilling people, the crown has chosen to let the Muslim majority keep their worship in peace. The reaction cools and the realm steadies, but the sacred fire rules over subjects who do not share it, and conversion will come slowly, if it comes at all."

      STATIC_MODIFIER_NAME_fnr_ERSHR_empowered_mobads: "Empowered Mobads Estate"
      STATIC_MODIFIER_DESC_fnr_ERSHR_empowered_mobads: "The mobads, high priests of the sacred fire, have been raised into an estate of their own, joining priestly authority to the standing of the old nobility. They serve the crown faithfully and lend it the full weight of the restored faith, but a priesthood granted real power over the realm becomes a force the throne must answer to as much as command."

      STATIC_MODIFIER_NAME_fnr_ERSHR_mobad_advisors: "Mobad Advisors"
      STATIC_MODIFIER_DESC_fnr_ERSHR_mobad_advisors: "The mobads have been welcomed back to court as counselors rather than masters. They lend the crown their learning in the old faith and help guide the restoration, yet they hold no estate of their own and no claim on the realm. The throne keeps its authority while still drawing on the wisdom of the priesthood, a balance that suits a ruler who wants the fire honoured but not obeyed."

      STATIC_MODIFIER_NAME_fnr_ERSHR_rejected_mobads: "Rejected Mobad Support"
      STATIC_MODIFIER_DESC_fnr_ERSHR_rejected_mobads: "The crown turned the mobads away, judging the old priests more burden than blessing. The throne keeps its full authority and owes nothing to the priesthood, but the magi remember the slight, and those who hoped the restoration would lift them back to greatness feel the door shut in their faces."

      STATIC_MODIFIER_NAME_fnr_ERSHR_sacred_fires_burn: "The Sacred Fires Burn"
      STATIC_MODIFIER_DESC_fnr_ERSHR_sacred_fires_burn: "The three great fires of old Iran blaze once more under a single crown, and the long night since the conquest is ended. With the priests' fire, the kings' fire, and the farmers' fire all rekindled, the faithful rally to a restoration made whole, the armies march with the confidence of a people reborn, and the old religion reaches outward across land and sea as it once did. The fire will not be smothered again."

    # Great Moravia
      STATIC_MODIFIER_NAME_fnr_gmorv_gained_power: "Moravian Clergy Gains Power"
      STATIC_MODIFIER_NAME_fnr_gmorv_clergy_upset_by_loss_of_power: "Clergy Upset over loss of Power"
      STATIC_MODIFIER_NAME_fnr_moravian_patrarchate_modifier: "Church Slavoric Efficiency"

    # Rhineland
