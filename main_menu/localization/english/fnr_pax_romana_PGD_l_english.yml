l_english:

  ###########################################################
  # Pax Romana - Pontus (PONTU), Gothia (GOTIA), Dacia (DACIA) #
  ###########################################################

    # PONTUS - ADVANCES

      PONTU_mithridatic_legacy: "Mithridatic Legacy"
      PONTU_mithridatic_legacy_desc: "Mithridates the Great defied Rome for forty years and slaughtered its citizens across Asia in a single day. His heirs remember how to fight.\n\nUnlocks the #Y Chalkaspides#!."
      PONTU_black_sea_fleet: "The Black Sea Fleet"
      PONTU_black_sea_fleet_desc: "The Pontic fleet once ruled the Euxine from Sinope to the Bosporus. Its galleys sail again.\n\nAllows us to #Y Proclaim the Black Sea Dominion#!."
      PONTU_pontic_mines: "Pontic Mines"
      PONTU_pontic_mines_desc: "The Chalybes of Pontus were the first ironworkers of legend. Their mountains still yield iron, silver and copper."
      PONTU_mithridatium: "Mithridatium"
      PONTU_mithridatium_desc: "The Poison King built up his immunity with a universal antidote of dozens of ingredients. Our physicians have rediscovered the recipe.\n\nProtects the king in #Y The Poison King#!."

    # PONTUS - EVENTS

      fnr_PONTU.1.title: "Mithridates' Heir"
      fnr_PONTU.1.desc: "The kingdom of Pontus is reborn. At Amaseia, among the rock-cut tombs of the old kings, our ruler takes the diadem of Mithridates. But Mithridates was two things at once: a Greek king who patronised Hellenic culture, and a descendant of the Persian Achaemenids. Which face will the new Pontus show the world?"
      fnr_PONTU.1.a: "A Hellenic Basileus."
      fnr_PONTU.1.b: "The heir of the Achaemenids."
      fnr_PONTU.2.title: "The Pontic Greeks"
      fnr_PONTU.2.desc: "The Greeks of the Pontic coast have kept their language, their faith and their schools for two thousand years, through Persians, Romans and Turks alike. In the hills behind them live Laz, Turkmen and Armenian clans with little love for city folk. How should the kingdom treat its peoples?"
      fnr_PONTU.2.a: "Protect the Greek schools and churches."
      fnr_PONTU.2.b: "Welcome the hill peoples into the army."
      fnr_PONTU.3.title: "Black Sea Dominion"
      fnr_PONTU.3.desc: "Our galleys patrol from the Crimea to the mouths of the Danube. Every ship that crosses the Black Sea does so under our eyes. The merchants of Sinope ask how we mean to use this power."
      fnr_PONTU.3.a: "Toll every ship that crosses our sea."
      fnr_PONTU.3.b: "Open the sea to every merchant."
      fnr_PONTU_black_sea_dominion_tt: "Unlocks the #Y Black Sea Dominion#! casus belli against anyone holding Black Sea coastline."
      fnr_PONTU.4.title: "The Poison King"
      fnr_PONTU.4.desc: "A cupbearer has been caught with a vial of hemlock hidden in his sleeve. Under questioning he names no one, but the court is full of rivals, and the old kings of Pontus died of poison more often than of age."
      fnr_PONTU.4.a: "The king has drunk Mithridatium since childhood."
      fnr_PONTU.4.b: "Purge the court."
      fnr_PONTU.4.c: "Trust to luck."
      fnr_PONTU_poison_survived_tt: "#G 50%#! chance that the plot fails and nothing comes of it."

    # GOTHIA - ADVANCES

      GOTIA_bastion_of_mangup: "The Bastion of Mangup"
      GOTIA_bastion_of_mangup_desc: "The last Goths hold a table-mountain above the Crimean coast, walled on every side by cliffs. Few can take it, and few want to trade there.\n\nUnlocks the #Y Gothic Spearmen#!."
      GOTIA_crimean_vineyards: "Crimean Vineyards"
      GOTIA_crimean_vineyards_desc: "The sunny valleys below Mangup produce the finest wine of the Black Sea."
      GOTIA_heirs_of_wulfila: "Heirs of Wulfila"
      GOTIA_heirs_of_wulfila_desc: "Bishop Wulfila invented an alphabet to write the Bible in Gothic. Our scribes copy his work and teach his letters once more."
      GOTIA_gothic_renaissance: "Gothic Renaissance"
      GOTIA_gothic_renaissance_desc: "The Gothic tongue, once heard only in a few Crimean villages, is spoken at court, sung in the churches and written in books. The last Goths have outlived every empire that tried to swallow them."

    # GOTHIA - EVENTS

      fnr_GOTIA.1.title: "Crimean Refuge"
      fnr_GOTIA.1.desc: "We are the last of the Goths, the people who once broke Rome. Our kingdom is a handful of valleys and a mountain fortress, and beyond the hills the steppe riders watch us. To survive we must either make our walls unbreakable or make the steppe our friend."
      fnr_GOTIA.1.a: "Fortify the hills."
      fnr_GOTIA.1.b: "Pay tribute to the steppe."
      fnr_GOTIA.2.title: "The Bible of Wulfila"
      fnr_GOTIA.2.desc: "In a monastery library our scholars have found a complete copy of Wulfila's Gothic Bible, written in silver ink on purple vellum. It carries the creed of the old Gothic church, which the Greeks called heresy. Some of our nobles say that faith was the true faith of our people."
      fnr_GOTIA.2.a: "Restore the Arian church of the Goths."
      fnr_GOTIA.2.b: "Gothic scripture, Orthodox faith."
      fnr_GOTIA.2.c: "Let the old tongue fade."
      fnr_GOTIA_arian_church_tt: "We adopt the [ShowReligionName('fnr_gothic_arian_religion')] faith. #G 40%#! of Gothic pops and #G 10%#! of all others follow."
      fnr_GOTIA.3.title: "Genoese Neighbors"
      fnr_GOTIA.3.desc: "The merchants of Kaffa grow rich on the trade of the steppe, the slaves of the Caucasus and the grain of the Crimea, while our valleys see little of it. Their consul proposes friendship; our nobles say Kaffa was Gothic land before any Italian set foot there."
      fnr_GOTIA.3.a: "Sign a trade compact."
      fnr_GOTIA.3.b: "Kaffa is Gothic land."
      fnr_GOTIA.3.c: "Hire their crossbowmen."
      fnr_GOTIA.4.title: "Gothic Renaissance"
      fnr_GOTIA.4.desc: "Scholars come from Constantinople and Italy to hear a living Gothic tongue, the speech of Alaric and Theodoric. Our poets write in it, our priests preach in it, and our kings take pride in it. The Goths have endured."
      fnr_GOTIA.4.a: "The Goths endure."

    # DACIA - ADVANCES

      DACIA_draco_standard: "The Draco Standard"
      DACIA_draco_standard_desc: "The wolf-headed dragon banner of the Dacians howled in the wind as they charged. It flies over our armies again.\n\nUnlocks the #Y Falxmen#! and the #Y Tarabostes#! privilege."
      DACIA_carpathian_gold: "Carpathian Gold"
      DACIA_carpathian_gold_desc: "The gold of the Apuseni mountains paid for Trajan's Forum. It will pay for our kingdom instead."
      DACIA_mountain_of_zalmoxis: "The Mountain of Zalmoxis"
      DACIA_mountain_of_zalmoxis_desc: "The priests of Zalmoxis keep their sanctuary on the holy mountain once more, and promise the faithful eternal life."
      DACIA_trajans_legacy: "Trajan's Legacy"
      DACIA_trajans_legacy_desc: "Rome conquered Dacia, and Dacia made Rome's language its own. We are the eastern heirs of the Latin world."
      DACIA_carpathian_fortresses: "Carpathian Fortresses"
      DACIA_carpathian_fortresses_desc: "The mountain citadels of the Orastie hills held off Rome for two wars. Rebuilt and garrisoned, they will hold again."

    # DACIA - EVENTS

      fnr_DACIA.1.title: "Heirs of Burebista"
      fnr_DACIA.1.desc: "Burebista united the Dacian tribes into a kingdom that frightened Caesar himself. Decebalus fought Trajan to the last. Now, after fifteen centuries, the Carpathian lands answer to one crown again."
      fnr_DACIA.1.a: "Dacia lives!"
      fnr_DACIA.2.title: "The Soul of Dacia"
      fnr_DACIA.2.desc: "What does it mean to be Dacian? Some look to the mountains, to the sanctuaries of Zalmoxis and the warriors who believed death was only a journey to their god. Others look to Trajan's legions, whose language our people still speak, and see a Latin island in a Slavic sea."
      fnr_DACIA.2.a: "Return to the gods of the mountains."
      fnr_DACIA.2.b: "We are the Romans of the East."
      fnr_DACIA_path_zalmoxian_tt: "We embrace the [ShowReligionName('fnr_zalmoxian_religion')] faith. #G 25%#! of Romanian pops and #G 10%#! of all others convert. A Christian or Muslim realm loses stability and angers its clergy; a pagan one gains legitimacy instead.\nUnlocks #Y The Mountain of Zalmoxis#!."
      fnr_DACIA_path_dacoroman_tt: "We keep our faith and embrace our Latin roots.\nUnlocks #Y Trajan's Legacy#!."
      fnr_DACIA.3.title: "The Gold of the Carpathians"
      fnr_DACIA.3.desc: "Miners in the Apuseni mountains have opened a new vein of gold, the richest found since Roman times. The crown could take the mines for itself, or let the mining towns work them freely and pay their dues."
      fnr_DACIA.3.a: "A royal monopoly."
      fnr_DACIA.3.b: "Free miners' towns."
      fnr_DACIA.4.title: "The Mountain of Zalmoxis"
      fnr_DACIA.4.desc: "Every few years, the Dacians of old chose a messenger to send to Zalmoxis: a young man thrown onto spears, carrying the people's prayers to their god. The priests ask whether the king will honour the old ways, or something gentler."
      fnr_DACIA.4.a: "The king ascends Kogaionon to pray."
      fnr_DACIA.4.b: "Send a messenger to Zalmoxis."
      fnr_DACIA.5.title: "The Column of Trajan"
      fnr_DACIA.5.desc: "A traveller returns from Rome with drawings of Trajan's Column, its reliefs spiralling with the conquest of Dacia. Our court is divided: do we honour the Romans who made us Latin, or the Dacians who died fighting them?"
      fnr_DACIA.5.a: "We are the heirs of Rome."
      fnr_DACIA.5.b: "We are the heirs of Decebalus."

    # PRIVILEGES

      fnr_PONTU_merchants_of_sinope: "Merchants of Sinope"
      fnr_PONTU_merchants_of_sinope_desc: "The merchant houses of Sinope, the greatest port of the Pontic coast, run the kingdom's sea trade."
      fnr_GOTIA_archons_of_theodoro: "Archons of Theodoro"
      fnr_GOTIA_archons_of_theodoro_desc: "The Gothic lords of the hill-forts hold their castles for the prince and keep them garrisoned."
      fnr_DACIA_tarabostes: "Tarabostes"
      fnr_DACIA_tarabostes_desc: "The cap-wearing nobility of Dacia lead the warbands and sit at the king's council."

    # UNITS

      fnr_PONTU_chalkaspides_1: "Chalkaspides"
      fnr_PONTU_chalkaspides_1_desc: "The bronze-shield phalanx of the Pontic kings - steady, well armoured and hard to break."
      fnr_PONTU_chalkaspides_2: "Chalkaspides"
      fnr_PONTU_chalkaspides_2_desc: "$fnr_PONTU_chalkaspides_1_desc$"
      fnr_PONTU_chalkaspides_3: "Chalkaspides"
      fnr_PONTU_chalkaspides_3_desc: "$fnr_PONTU_chalkaspides_1_desc$"
      fnr_PONTU_chalkaspides_4: "Chalkaspides"
      fnr_PONTU_chalkaspides_4_desc: "$fnr_PONTU_chalkaspides_1_desc$"
      fnr_PONTU_chalkaspides_5: "Chalkaspides"
      fnr_PONTU_chalkaspides_5_desc: "$fnr_PONTU_chalkaspides_1_desc$"
      fnr_PONTU_chalkaspides_6: "Chalkaspides"
      fnr_PONTU_chalkaspides_6_desc: "$fnr_PONTU_chalkaspides_1_desc$"
      fnr_GOTIA_gothic_spearmen_1: "Gothic Spearmen"
      fnr_GOTIA_gothic_spearmen_1_desc: "The hill-fort garrisons of Gothia - hard to dislodge, especially in the mountains."
      fnr_GOTIA_gothic_spearmen_2: "Gothic Spearmen"
      fnr_GOTIA_gothic_spearmen_2_desc: "$fnr_GOTIA_gothic_spearmen_1_desc$"
      fnr_GOTIA_gothic_spearmen_3: "Gothic Spearmen"
      fnr_GOTIA_gothic_spearmen_3_desc: "$fnr_GOTIA_gothic_spearmen_1_desc$"
      fnr_GOTIA_gothic_spearmen_4: "Gothic Spearmen"
      fnr_GOTIA_gothic_spearmen_4_desc: "$fnr_GOTIA_gothic_spearmen_1_desc$"
      fnr_GOTIA_gothic_spearmen_5: "Gothic Spearmen"
      fnr_GOTIA_gothic_spearmen_5_desc: "$fnr_GOTIA_gothic_spearmen_1_desc$"
      fnr_GOTIA_gothic_spearmen_6: "Gothic Spearmen"
      fnr_GOTIA_gothic_spearmen_6_desc: "$fnr_GOTIA_gothic_spearmen_1_desc$"
      fnr_DACIA_falxmen_1: "Falxmen"
      fnr_DACIA_falxmen_1_desc: "Dacian warriors wielding the falx, a two-handed curved blade that could split a Roman helmet. They hit hard and take heavy losses."
      fnr_DACIA_falxmen_2: "Falxmen"
      fnr_DACIA_falxmen_2_desc: "$fnr_DACIA_falxmen_1_desc$"
      fnr_DACIA_falxmen_3: "Falxmen"
      fnr_DACIA_falxmen_3_desc: "$fnr_DACIA_falxmen_1_desc$"
      fnr_DACIA_falxmen_4: "Falxmen"
      fnr_DACIA_falxmen_4_desc: "$fnr_DACIA_falxmen_1_desc$"
      fnr_DACIA_falxmen_5: "Falxmen"
      fnr_DACIA_falxmen_5_desc: "$fnr_DACIA_falxmen_1_desc$"
      fnr_DACIA_falxmen_6: "Falxmen"
      fnr_DACIA_falxmen_6_desc: "$fnr_DACIA_falxmen_1_desc$"

    # DECISIONS

      fnr_PONTU_black_sea_dominion.title: "Proclaim the Black Sea Dominion"
      fnr_PONTU_black_sea_dominion.desc: "With ten ports on the Black Sea and a fleet to guard them, Pontus can claim the whole sea as its own, as Mithridates once did."
      fnr_PONTU_black_sea_dominion.a: "The Euxine is ours."
      fnr_GOTIA_fortify_mangup.title: "Fortify Mangup"
      fnr_GOTIA_fortify_mangup.desc: "Raise new walls across the gullies of the table-mountain, cut cisterns into the rock, and make the Gothic capital impregnable."
      fnr_GOTIA_fortify_mangup.a: "Build the walls."
      fnr_DACIA_rebuild_sarmizegetusa.title: "Rebuild Sarmizegetusa"
      fnr_DACIA_rebuild_sarmizegetusa.desc: "The royal city of the Dacian kings lies in ruins in the hills above Hateg. Rebuild its walls and its sanctuaries as the seat of the new Dacia."
      fnr_DACIA_rebuild_sarmizegetusa.a: "Raise Sarmizegetusa from its ruins."
      fnr_DACIA_sarmizegetusa_tt: "While we own Hateg, we keep the #Y Seat of the Dacian Kings#! bonus."

    # CASUS BELLI

      fnr_PONTU_cb_black_sea_dominion: "Black Sea Dominion"
      fnr_PONTU_cb_black_sea_dominion_desc: "Every port on the Black Sea belongs to Pontus."
      fnr_PONTU_black_sea_wargoal: "Seize the Black Sea Coast"

    # OPINIONS

      fnr_GOTIA_genoese_compact: "Trade compact with Gothia"

    # RELIGIONS

      fnr_gothic_arian_religion: "Gothic Arian"
      fnr_gothic_arian_religion_ADJ: "Arian"
      fnr_gothic_arian_religion_desc: "The church of Wulfila and the old Goths, which holds that the Son was created by the Father. Condemned at Nicaea, revived in the Crimea."
      fnr_gothic_arian_wulfilas_bible: "Wulfila's Bible"
      fnr_gothic_arian_wulfilas_bible_desc: "Scripture in the Gothic tongue, read aloud in every church."
      fnr_gothic_arian_homoian_creed: "The Homoian Creed"
      fnr_gothic_arian_homoian_creed_desc: "A moderate creed that says only that the Son is like the Father, and leaves the rest to God."
      fnr_gothic_arian_warrior_bishops: "Warrior Bishops"
      fnr_gothic_arian_warrior_bishops_desc: "Our bishops ride to war beside the king, as Gothic priests always have."
      fnr_zalmoxian_religion: "Zalmoxian"
      fnr_zalmoxian_religion_ADJ: "Zalmoxian"
      fnr_zalmoxian_religion_desc: "The faith of the old Dacians and Getae, who believed that death was a journey to Zalmoxis and feared nothing in battle."
      fnr_zalmoxian_worship_zalmoxis: "Worship of Zalmoxis"
      fnr_zalmoxian_worship_zalmoxis_desc: "The god who promised immortality to the brave. His followers go to war laughing."
      fnr_zalmoxian_worship_gebeleizis: "Worship of Gebeleizis"
      fnr_zalmoxian_worship_gebeleizis_desc: "The thunder god of the Getae, to whom warriors shot arrows at the storm-clouds."
      fnr_zalmoxian_worship_bendis: "Worship of Bendis"
      fnr_zalmoxian_worship_bendis_desc: "The huntress of the moon and the forests, giver of plenty."
      fnr_zalmoxian_worship_derzelas: "Worship of Derzelas"
      fnr_zalmoxian_worship_derzelas_desc: "The horseman god of health and the underworld, guardian of the fields and the herds."

    # STATIC MODIFIERS

      STATIC_MODIFIER_NAME_fnr_PONTU_hellenic_basileus: "Hellenic Basileus"
      STATIC_MODIFIER_DESC_fnr_PONTU_hellenic_basileus: "Our king rules as a Greek monarch, patron of Hellenic learning."
      STATIC_MODIFIER_NAME_fnr_PONTU_achaemenid_heir: "Heir of the Achaemenids"
      STATIC_MODIFIER_DESC_fnr_PONTU_achaemenid_heir: "Our king claims the blood of the Persian Great Kings."
      STATIC_MODIFIER_NAME_fnr_PONTU_greek_schools: "Pontic Greek Schools"
      STATIC_MODIFIER_DESC_fnr_PONTU_greek_schools: "The schools and churches of the Pontic Greeks enjoy royal protection."
      STATIC_MODIFIER_NAME_fnr_PONTU_hill_levies: "Hill Levies"
      STATIC_MODIFIER_DESC_fnr_PONTU_hill_levies: "The hill clans fight in our army."
      STATIC_MODIFIER_NAME_fnr_PONTU_sea_tolls: "Black Sea Tolls"
      STATIC_MODIFIER_DESC_fnr_PONTU_sea_tolls: "Every ship on our sea pays its due."
      STATIC_MODIFIER_NAME_fnr_PONTU_open_sea: "An Open Sea"
      STATIC_MODIFIER_DESC_fnr_PONTU_open_sea: "Merchants of every nation sail our sea freely and fill our ports."
      STATIC_MODIFIER_NAME_fnr_PONTU_poisoned_king: "The King Was Poisoned"
      STATIC_MODIFIER_DESC_fnr_PONTU_poisoned_king: "The king survived, but barely, and the court is in uproar."
      STATIC_MODIFIER_NAME_fnr_GOTIA_hill_forts: "Gothic Hill-Forts"
      STATIC_MODIFIER_DESC_fnr_GOTIA_hill_forts: "Every valley of Gothia is guarded by a fortress."
      STATIC_MODIFIER_NAME_fnr_GOTIA_steppe_peace: "Peace with the Steppe"
      STATIC_MODIFIER_DESC_fnr_GOTIA_steppe_peace: "Our tribute keeps the steppe riders away."
      STATIC_MODIFIER_NAME_fnr_GOTIA_gothic_scripture: "Gothic Scripture"
      STATIC_MODIFIER_DESC_fnr_GOTIA_gothic_scripture: "Wulfila's Bible is read in Gothic, under the Orthodox creed."
      STATIC_MODIFIER_NAME_fnr_GOTIA_hellenized: "Hellenized Goths"
      STATIC_MODIFIER_DESC_fnr_GOTIA_hellenized: "Our people speak Greek, and the Greek world accepts us as its own."
      STATIC_MODIFIER_NAME_fnr_GOTIA_genoese_trade: "Genoese Trade Compact"
      STATIC_MODIFIER_DESC_fnr_GOTIA_genoese_trade: "The wine and grain of Gothia flow through Kaffa."
      STATIC_MODIFIER_NAME_fnr_GOTIA_genoese_crossbowmen: "Genoese Crossbowmen"
      STATIC_MODIFIER_DESC_fnr_GOTIA_genoese_crossbowmen: "Italian crossbowmen man our walls."
      STATIC_MODIFIER_NAME_fnr_GOTIA_gothic_renaissance: "Gothic Renaissance"
      STATIC_MODIFIER_DESC_fnr_GOTIA_gothic_renaissance: "The language and culture of the Goths flourish once more."
      STATIC_MODIFIER_NAME_fnr_GOTIA_mangup_fortified: "Fortress of Mangup"
      STATIC_MODIFIER_DESC_fnr_GOTIA_mangup_fortified: "The table-mountain of Mangup is walled and provisioned against any siege."
      STATIC_MODIFIER_NAME_fnr_DACIA_burebistas_heir: "Burebista's Heir"
      STATIC_MODIFIER_DESC_fnr_DACIA_burebistas_heir: "Dacia is united under one crown, as in Burebista's day."
      STATIC_MODIFIER_NAME_fnr_DACIA_zalmoxian_revival: "Zalmoxian Revival"
      STATIC_MODIFIER_DESC_fnr_DACIA_zalmoxian_revival: "The gods of the mountains are worshipped again."
      STATIC_MODIFIER_NAME_fnr_DACIA_dacoroman_heritage: "Daco-Roman Heritage"
      STATIC_MODIFIER_DESC_fnr_DACIA_dacoroman_heritage: "We embrace the Latin roots of our people."
      STATIC_MODIFIER_NAME_fnr_DACIA_royal_mines: "Royal Gold Mines"
      STATIC_MODIFIER_DESC_fnr_DACIA_royal_mines: "The crown works the Carpathian gold mines directly."
      STATIC_MODIFIER_NAME_fnr_DACIA_free_miners: "Free Miners' Towns"
      STATIC_MODIFIER_DESC_fnr_DACIA_free_miners: "The mining towns work the gold and silver freely and pay their dues."
      STATIC_MODIFIER_NAME_fnr_DACIA_kogaionon: "Pilgrimage to Kogaionon"
      STATIC_MODIFIER_DESC_fnr_DACIA_kogaionon: "The king has prayed on the holy mountain."
      STATIC_MODIFIER_NAME_fnr_DACIA_messenger_to_zalmoxis: "Messenger to Zalmoxis"
      STATIC_MODIFIER_DESC_fnr_DACIA_messenger_to_zalmoxis: "Our warriors believe the god has heard their prayers."
      STATIC_MODIFIER_NAME_fnr_DACIA_heirs_of_rome: "Heirs of Rome"
      STATIC_MODIFIER_DESC_fnr_DACIA_heirs_of_rome: "We honour the legions who made us Latin."
      STATIC_MODIFIER_NAME_fnr_DACIA_heirs_of_decebalus: "Heirs of Decebalus"
      STATIC_MODIFIER_DESC_fnr_DACIA_heirs_of_decebalus: "We honour the king who fought Rome to the end."
      STATIC_MODIFIER_NAME_fnr_DACIA_royal_seat: "Seat of the Dacian Kings"
      STATIC_MODIFIER_DESC_fnr_DACIA_royal_seat: "Sarmizegetusa stands rebuilt as the heart of Dacia."
      STATIC_MODIFIER_NAME_fnr_DACIA_sarmizegetusa: "Sarmizegetusa Regia"
      STATIC_MODIFIER_DESC_fnr_DACIA_sarmizegetusa: "The royal city of the Dacian kings, rebuilt with walls and sanctuaries."

    # WAR GOALS

      war_goal_fnr_PONTU_black_sea_wargoal: "Black Sea Dominion"
      war_goal_fnr_PONTU_black_sea_wargoal_desc: "Bring the coasts of the Black Sea under Pontic rule."
