      fnr_ROM_cb_restore_dioceses: "Restore the Roman Dioceses"
      fnr_ROM_cb_restore_dioceses_desc: "These lands were Roman, and their dioceses will be restored."
      fnr_ROM_cb_restore_dioceses_valid_tt: "The target holds land in one of the eleven #Y Roman diocese#! regions"
      war_goal_fnr_ROM_restore_dioceses_wargoal: "Restore the Roman Dioceses"
      war_goal_fnr_ROM_restore_dioceses_wargoal_desc: "Return the lands of the old dioceses to Rome."
      fnr_ROM_restore_dioceses_wargoal_locations_tt: "Lies in one of the eleven #Y Roman diocese#! regions"

  ###########################################################
  # Hints                                                   #
  ###########################################################

      hint_fnr_ROM_legions: "Legion Loyalty"
      hint_fnr_ROM_legions_hint_text: "$hint_fnr_ROM_legions_text_1$\n\n$fnr_ROM_loyalty_current$\n\n$fnr_ROM_loyalty_tiers$\n\n$fnr_ROM_loyalty_moves$\n\n$hint_fnr_ROM_legions_text_2$"
      hint_fnr_ROM_legions_text_1: "The legions made emperors and unmade them. #Y Legion Loyalty#! measures how much they trust ours, from 0 to 100. It always appears among our country modifiers as the #Y Loyal#!, #Y Steady#!, #Y Restless#! or #Y Mutinous#! Legions, and hovering it shows the current value."
      hint_fnr_ROM_legions_text_2: "@hint! #T Usurpers#!\nBelow 40, a general in a far diocese may be proclaimed emperor. Crush him, buy back his legions, or with a Tetrarchy, name him Caesar.\n\n@hint! #T The Crisis of the Third Century#!\nBelow 20, in an Empire of 4 or more dioceses, the Crisis can begin. Ending it unlocks the #Y Dominate#!."
      hint_fnr_ROM_legions_diplomatic: "$hint_advisor_salute_diplomatic$"
      hint_fnr_ROM_legions_administrative: "$hint_advisor_salute_administrative$"
      hint_fnr_ROM_legions_military: "$hint_advisor_salute_military$"
      hint_fnr_ROM_dioceses: "The Imperial Dioceses"
      hint_fnr_ROM_dioceses_hint_text: "$hint_fnr_ROM_dioceses_text_1$\n\n$fnr_ROM_dioceses_current$\n\n$fnr_ROM_dioceses_tiers$\n\n$hint_fnr_ROM_dioceses_text_2$"
      hint_fnr_ROM_dioceses_text_1: "The Empire is restored region by region. Hold #Y 60%#! of a Roman region and a decision restores its #Y Diocese#!, with its own permanent bonus. The number restored always appears among our country modifiers."
      hint_fnr_ROM_dioceses_text_2: "@hint! #T The eleven dioceses#!\nItalia, Galliae, Hispaniae, Britanniae, Raetia et Noricum, Illyricum, Dacia, Asiana, Oriens, Aegyptus and Africa.\n\n@hint! #T Overstretch#!\nWith 6 or more dioceses, the legions grow restless every year unless the Empire adopts the #Y Tetrarchy#!."
      hint_fnr_ROM_dioceses_diplomatic: "$hint_advisor_salute_diplomatic$"
      hint_fnr_ROM_dioceses_administrative: "$hint_advisor_salute_administrative$"
      hint_fnr_ROM_dioceses_military: "$hint_advisor_salute_military$"

  ###########################################################
  # Events                                                  #
  ###########################################################

      fnr_ROM.1.title: "Ave Imperator"
      fnr_ROM.1.desc.augustus: "The Republic is gone, and its last dictator is Imperator Caesar Augustus, son of the divine. The legions that won him the civil wars line the road to the Capitol and cheer his name. They made him Emperor, and they will not let him forget it.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM.1.desc.principate: "The Princeps has quietly become something more. The Senate still meets, the consuls are still elected, and every Roman knows who rules. The Principate is now the Roman Empire, in name as well as fact.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM.1.desc.renovatio: "The Western Empire, restored by a crown placed on a Frankish head in Saint Peter's, is now simply Rome. The renovatio is no longer a dream of scholars. It is an army, a treasury and a map of the old dioceses waiting to be filled in.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM.1.desc.new_rome: "For a thousand years the Romans of the East called themselves Romans while the West called them Greeks. Now the Emperor holds Rome itself, and nobody can argue. The Empire that never fell has come home.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM.1.desc.restorer: "We have taken the name of Rome. The name is heavy. Eleven dioceses once answered to the Emperor, and the legions of the old Empire made and unmade emperors as they pleased. We will have to earn both the provinces and the soldiers.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM.1.a: "To the frontiers!"
      fnr_ROM.1.b: "To the Forum!"

      fnr_ROM.2.title: "The Legions Proclaim an Emperor"
      fnr_ROM.2.desc: "Messengers from a far diocese bring the news every emperor dreads. The legions there, unpaid and ignored, have raised their general on their shields and hailed him Augustus. His coins are already being struck.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM.2.a: "There is only one Augustus. March!"
      fnr_ROM.2.b: "Buy back his legions."
      fnr_ROM.2.c: "Name him Caesar, and give him the frontier."

      fnr_ROM.3.title: "The Praetorians Stir"
      fnr_ROM.3.desc: "The Praetorian Guard has noticed that the legions are restless, and that an emperor without the legions needs the Guard more than ever. Their prefect has come to the palace to discuss their pay. He did not come alone.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM.3.a: "Pay them."
      fnr_ROM.3.b: "Purge the Guard."
      fnr_ROM.3.c: "Let them name their price."

      fnr_ROM.4.title: "The Usurper Falls"
      fnr_ROM.4.desc: "The usurper is dead, killed by his own men when they saw which way the war was going. His statues are already coming down, and his legions wait to hear what the Emperor will do with them.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM.4.a: "Damnatio memoriae. Erase his name."
      fnr_ROM.4.b: "Pardon his legions. They are Roman soldiers."

      fnr_ROM.5.title: "Foederati at the Limes"
      fnr_ROM.5.desc: "A whole people has come to the frontier with their wagons, their cattle and their king, asking for land inside the Empire. In return they will fight for Rome under their own chiefs. The legions on the frontier do not like it."
      fnr_ROM.5.a: "Settle them as foederati."
      fnr_ROM.5.b: "Close the frontier."

      fnr_ROM.6.title: "The Census of the Empire"
      fnr_ROM.6.desc: "The census is due. Every province will send its rolls to Rome, listing every field, every household and every man. The question is what we want the rolls for."
      fnr_ROM.6.a: "Assess the taxes."
      fnr_ROM.6.b: "Count the men of fighting age."

      fnr_ROM.7.title: "The Crisis of the Third Century"
      fnr_ROM.7.desc: "The legions have lost all faith in the Emperor, and the Empire is coming apart. Generals are hailed as emperors in every province, the coinage is debased to pay them, and beyond the frontiers the barbarians have noticed. This is how empires fall.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM.7.a: "The Empire will endure."

      fnr_ROM.8.title: "The Debasement of the Coinage"
      fnr_ROM.8.desc: "There is not enough silver to pay the legions. The mint masters suggest that there need not be: a little more bronze in each denarius, and the treasury will have coin to spare. The merchants will notice. The soldiers will only notice if they are not paid."
      fnr_ROM.8.a: "Debase the denarius."
      fnr_ROM.8.b: "Keep the coinage sound."

      fnr_ROM.9.title: "The Gallic Empire"
      fnr_ROM.9.desc: "The governor of the western provinces has declared that Rome cannot defend them, and that he can. The legions of the Rhine have proclaimed him emperor, and Gaul, Spain and Britain may follow him."
      fnr_ROM.9.a: "March west."
      fnr_ROM.9.b: "Buy the governor's loyalty."

      fnr_ROM.10.title: "The Palmyrene Empire"
      fnr_ROM.10.desc: "In the East, a queen who rules from a desert trading city has taken the Emperor's eastern legions into her own service, and her armies are marching on Egypt. She calls herself the ally of Rome. Her coins carry her own face."
      fnr_ROM.10.a: "March east."
      fnr_ROM.10.b: "Recognize her as our ally, for now."

      fnr_ROM.11.title: "A Soldier Emperor"
      fnr_ROM.11.desc: "A general of humble Illyrian birth has won a great victory on the Danube, and his men are calling him the only true Roman left. He has not yet claimed anything. He may not need to."
      fnr_ROM.11.a: "Reward him."
      fnr_ROM.11.b: "Have him strangled."

      fnr_ROM.12.title: "The Barbarians Cross the Frontier"
      fnr_ROM.12.desc: "With the legions busy fighting each other, war bands have crossed the frontier and are burning their way through the provinces. Their chiefs would leave for a price."
      fnr_ROM.12.a: "Pay them to go home."
      fnr_ROM.12.b: "Fight them on the frontier."

      fnr_ROM.13.title: "Restitutor Orbis"
      fnr_ROM.13.desc: "The usurpers are dead, the provinces are recovered and the legions cheer one emperor again. The Senate has voted him a new title, Restorer of the World. The Empire that comes out of the Crisis will be harder, more centralized and more absolute than the one that went into it."
      fnr_ROM.13.a: "The world is restored."

      fnr_ROM.14.title: "Imperium Sine Fine"
      fnr_ROM.14.desc: "The last of the eleven dioceses has been restored. From Britain to Egypt, from Spain to the Euphrates, the provinces of the old Empire answer to Rome. Virgil wrote that Jupiter promised the Romans an empire without end. It has taken longer than he expected."
      fnr_ROM.14.a: "Rome is eternal."

      fnr_ROM.15.title: "The Senate of Rome"
      fnr_ROM.15.desc: "The Senate of Rome still meets in the Curia, as it has for two thousand years. Its members are the richest men in the Empire, and they would like to govern it again. The generals say that senators should not command legions."
      fnr_ROM.15.a: "Restore the dignity of the Senate."
      fnr_ROM.15.b: "The Senate advises. The Emperor decides."

  # The Great Republic (Roman Republic path to Rome)
      fnr_ROM.1.desc.great_republic: "The Republic has done what no Roman thought possible. It has won an empire without crowning an emperor. Rome is ruled by a smaller Senate, of the generals who won its wars and the scholars who will govern its provinces. The name of Rome passes to the Republic. What the Republic calls itself is ours to decide.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM.1.c: "The Great Roman Republic."
      fnr_ROM.1.d: "The Most Serene Republic of Rome."
      fnr_ROM.1.e: "The Imperial Roman Republic."
      fnr_ROM.1.f: "The Republic of the Romans."
      fnr_ROM.1.g: "The Grand Roman Republic."
      fnr_ROM.1.h: "Keep the name the people already use."
      fnr_ROM_GRAND_ROMAN_REPUBLIC_NAME: "Grand Roman Republic"
      fnr_ROM_GRAND_ROMAN_REPUBLIC_NAME_ADJ: "Roman"
      fnr_ROM_GREAT_ROMAN_REPUBLIC_NAME: "Great Roman Republic"
      fnr_ROM_GREAT_ROMAN_REPUBLIC_NAME_ADJ: "Roman"
      fnr_ROM_SERENE_REPUBLIC_NAME: "Most Serene Republic of Rome"
      fnr_ROM_SERENE_REPUBLIC_NAME_ADJ: "Roman"
      fnr_ROM_IMPERIAL_REPUBLIC_NAME: "Imperial Roman Republic"
      fnr_ROM_IMPERIAL_REPUBLIC_NAME_ADJ: "Roman"
      fnr_ROM_REPUBLIC_OF_THE_ROMANS_NAME: "Republic of the Romans"
      fnr_ROM_REPUBLIC_OF_THE_ROMANS_NAME_ADJ: "Roman"
      fnr_ROM_senate_of_generals: "The Senate of Generals and Scholars"
      fnr_ROM_senate_of_generals_desc: "The old Senate of six hundred is gone. In its place sits a smaller Senate of the Republic's victorious generals and its most learned men, who command the legions and govern the dioceses. While #Y Senate Authority#! is #Y 60#! or more, #Y Legion Loyalty#! rises by #G 2#! each year. While #Y Legion Loyalty#! is below #R 25#!, #Y Senate Authority#! falls by #R 2#! each year."
      STATIC_MODIFIER_NAME_fnr_ROM_origin_great_republic: "Magna Res Publica"
      STATIC_MODIFIER_DESC_fnr_ROM_origin_great_republic: "Rome won its empire as a Republic, and remains one."
      STATIC_MODIFIER_NAME_fnr_ROM_athenaeum: "The Athenaeum"
      STATIC_MODIFIER_DESC_fnr_ROM_athenaeum: "The Republic's school of law, rhetoric and letters trains the men who govern the dioceses."
      fnr_ROM_athenaeum_decision.title: "Found the Athenaeum"
      fnr_ROM_athenaeum_decision.desc: "The scholars of the Senate propose a great school in Rome, where the sons of every diocese will learn law, rhetoric and letters, and go home as Romans to govern their provinces."
      fnr_ROM_athenaeum_decision.a: "Build it on the Capitol."

  # The Foederati and client kingdoms
      fnr_ROM_foederati_io: "The Foederati"
      fnr_ROM_foederati_io_desc: "Amici et Socii Populi Romani - the client kings and frontier allies of the Roman Empire, each ruling their own people but bound to fight for Rome.\n\n#T How it works#!\n- #Y Who can join#! - any subject of Rome, any former member of the Socii, and any country with its capital in a Roman diocese region or the Caucasus. Our subjects join automatically.\n- #Y Defense#! - members are called into each other's defensive wars.\n- #Y Members#! gain defense and land morale, and think better of Rome.\n- #Y Rome#! gains manpower and defense, plus manpower and prestige for every member, up to 10.\n- #Y Actions#! (the Actions tab of this panel) - #Y Renew the Foedera#!, #Y Levy the Foederati#!, and for a single member #Y Grant Roman Titles#!, #Y Settle on the Limes#!, #Y Hostages at Rome#!, #Y Romanize#! or #Y Incorporate into the Empire#!.\n- #Y Client kingdoms#! - decisions let Rome carve historical client kingdoms such as Armenia or Numidia out of its own lands. They become vassals and join."
      fnr_ROM_foederati_io_list_who_tt: "$WHO$ is a member of [GetUniqueInternationalOrganization('fnr_ROM_foederati_io').GetName] with $LIST$"
      io_opinion_fnr_ROM_foederati_io: "Fellow Foederatus"
      fnr_ROM_sworn_foederatus: "Sworn Foederatus of Rome"
      fnr_ROM_renewed_foedus: "Foedus Renewed"
      fnr_ROM_roman_title: "Granted Roman Titles"
      fnr_ROM_limes_honour: "Entrusted with the Limes"
      fnr_ROM_hostages_at_rome: "Heir Raised in Rome"
      fnr_ROM_made_by_rome: "Crowned by Rome"
      fnr_ROM_foederati_reason_subject: "Subject of Rome"
      fnr_ROM_foederati_created_tt: "The #Y Foederati#! is founded, with us at its head."
      fnr_ROM_socii_converted_tt: "The Republic's #Y Socii#! become the #Y Foederati#!. Every member of the Socii joins it."
      fnr_ROM_found_foederati.title: "Found the Foederati"
      fnr_ROM_found_foederati.desc: "Rome has always ruled through friends as well as provinces. Client kings, allied cities and barbarian peoples settled on the frontier can be bound to the Empire by treaty, each fighting for Rome under its own rulers."
      fnr_ROM_found_foederati.a: "Bind them to Rome."
      fnr_ROM_foederati_renew_foedera: "Renew the Foedera"
      fnr_ROM_foederati_renew_foedera_desc: "Swear the treaties with our allies again. Every member gains #Y Foedus Renewed#! for 5 years. Peace only, every 5 years, 100 gold."
      fnr_ROM_foederati_levy: "Levy the Foederati"
      fnr_ROM_foederati_levy_desc: "Call up the allied contingents. Every member gains #Y Foederati Levied#! and we gain #Y Foederati Levies#! for 2 years. War only, every 10 years."
      fnr_ROM_foederati_grant_title: "Grant Roman Titles"
      fnr_ROM_foederati_grant_title_desc: "Make one member's ruler a Patricius and Magister Militum of the Empire. It gains #Y Patricius#! for good and thinks much better of Rome. 100 gold, once per member."
      fnr_ROM_foederati_settle_limes: "Settle on the Limes"
      fnr_ROM_foederati_settle_limes_desc: "Entrust a stretch of the frontier to one member. It gains #Y Guardians of the Limes#! and we gain #Y The Limes Held#! for 20 years, and #Y Legion Loyalty#! rises by #G 5#!. 50 gold, every 10 years."
      fnr_ROM_foederati_hostages: "Hostages at Rome"
      fnr_ROM_foederati_hostages_desc: "Invite one member's heir to be raised at the imperial court, as Roman as any senator's son. The member thinks much better of Rome. 50 gold, every 20 years per member."
      fnr_ROM_foederati_romanize: "Romanize"
      fnr_ROM_foederati_romanize_desc: "Send Latin teachers, lawyers and colonists to one member. 50 gold, every 5 years per member."
      fnr_ROM_foederati_incorporate: "Incorporate into the Empire"
      fnr_ROM_foederati_incorporate_desc: "Peacefully absorb a member with fewer than 30 locations that thinks very highly of Rome (150 or more). Every 20 years."
      fnr_ROM_renew_foedera_tt: "Every member of the #Y Foederati#! gains #Y Foedus Renewed#! for 5 years. Can be done again in 5 years."
      fnr_ROM_levy_foederati_tt: "Every other member of the #Y Foederati#! gains #Y Foederati Levied#! for 2 years. Can be done again in 10 years."
      fnr_ROM_romanize_tt: "#Y 3%#! of its people who are not Roman take up #Y Roman#! culture."
      STATIC_MODIFIER_NAME_fnr_ROM_foedus_renewed: "Foedus Renewed"
      STATIC_MODIFIER_DESC_fnr_ROM_foedus_renewed: "Our treaty with Rome has been sworn again."
      STATIC_MODIFIER_NAME_fnr_ROM_foederati_levied: "Foederati Levied"
      STATIC_MODIFIER_DESC_fnr_ROM_foederati_levied: "Our warriors march with the Roman legions."
      STATIC_MODIFIER_NAME_fnr_ROM_foederati_levies: "Foederati Levies"
      STATIC_MODIFIER_DESC_fnr_ROM_foederati_levies: "Allied contingents fill out our armies."
      STATIC_MODIFIER_NAME_fnr_ROM_patricius: "Patricius"
      STATIC_MODIFIER_DESC_fnr_ROM_patricius: "Our ruler holds the Roman titles of Patricius and Magister Militum."
      STATIC_MODIFIER_NAME_fnr_ROM_limes_guardians: "Guardians of the Limes"
      STATIC_MODIFIER_DESC_fnr_ROM_limes_guardians: "We hold a stretch of the Roman frontier."
      STATIC_MODIFIER_NAME_fnr_ROM_limes_held: "The Limes Held"
      STATIC_MODIFIER_DESC_fnr_ROM_limes_held: "Our allies guard the frontier beside the legions."
      fnr_ROM_client_enough_land_tt: "We hold at least #Y 3#! locations, other than our capital, in its lands"
      fnr_ROM_client_not_capital_tt: "Our capital is not in its lands"
      fnr_ROM_CLIENT_armenia: "Regnum Armeniae"
      fnr_ROM_CLIENT_armenia_ADJ: "Armenian"
      fnr_ROM_client_armenia.title: "Establish the Client Kingdom of Regnum Armeniae"
      fnr_ROM_client_armenia.desc: "Armenia stood between Rome and Persia for centuries, its kings crowned by whichever empire was stronger. Let them be crowned by Rome.\n\nOur lands there will be given to a new king, who will rule them as our vassal and join the #Y Foederati#!."
      fnr_ROM_client_armenia.a: "Crown a friend of Rome."
      fnr_ROM_client_armenia_tt: "Our lands there, apart from the capital, become the #Y Regnum Armeniae#!, a kingdom that is our #Y vassal#! and joins the #Y Foederati#!."
      fnr_ROM_CLIENT_hiberia: "Regnum Hiberiae"
      fnr_ROM_CLIENT_hiberia_ADJ: "Hiberian"
      fnr_ROM_client_hiberia.title: "Establish the Client Kingdom of Regnum Hiberiae"
      fnr_ROM_client_hiberia.desc: "The kings of Caucasian Hiberia held the passes of the Caucasus for Rome against the steppe.\n\nOur lands there will be given to a new king, who will rule them as our vassal and join the #Y Foederati#!."
      fnr_ROM_client_hiberia.a: "Crown a friend of Rome."
      fnr_ROM_client_hiberia_tt: "Our lands there, apart from the capital, become the #Y Regnum Hiberiae#!, a kingdom that is our #Y vassal#! and joins the #Y Foederati#!."
      fnr_ROM_CLIENT_bosporus: "Regnum Bosporanum"
      fnr_ROM_CLIENT_bosporus_ADJ: "Bosporan"
      fnr_ROM_client_bosporus.title: "Establish the Client Kingdom of Regnum Bosporanum"
      fnr_ROM_client_bosporus.desc: "The Bosporan kings ruled the cities of the Crimea as friends of Rome, and sent their grain across the Black Sea.\n\nOur lands there will be given to a new king, who will rule them as our vassal and join the #Y Foederati#!."
      fnr_ROM_client_bosporus.a: "Crown a friend of Rome."
      fnr_ROM_client_bosporus_tt: "Our lands there, apart from the capital, become the #Y Regnum Bosporanum#!, a kingdom that is our #Y vassal#! and joins the #Y Foederati#!."
      fnr_ROM_CLIENT_cappadocia: "Regnum Cappadociae"
      fnr_ROM_CLIENT_cappadocia_ADJ: "Cappadocian"
      fnr_ROM_client_cappadocia.title: "Establish the Client Kingdom of Regnum Cappadociae"
      fnr_ROM_client_cappadocia.desc: "Cappadocia was a client kingdom before it was a province. Its horse-breeding nobles and mountain fortresses can serve Rome again.\n\nOur lands there will be given to a new king, who will rule them as our vassal and join the #Y Foederati#!."
      fnr_ROM_client_cappadocia.a: "Crown a friend of Rome."
      fnr_ROM_client_cappadocia_tt: "Our lands there, apart from the capital, become the #Y Regnum Cappadociae#!, a kingdom that is our #Y vassal#! and joins the #Y Foederati#!."
      fnr_ROM_CLIENT_thracia: "Regnum Thraciae"
      fnr_ROM_CLIENT_thracia_ADJ: "Thracian"
      fnr_ROM_client_thracia.title: "Establish the Client Kingdom of Regnum Thraciae"
      fnr_ROM_client_thracia.desc: "The Odrysian kings of Thrace ruled their tribes as Rome's allies for a century before Thrace became a province.\n\nOur lands there will be given to a new king, who will rule them as our vassal and join the #Y Foederati#!."
      fnr_ROM_client_thracia.a: "Crown a friend of Rome."
      fnr_ROM_client_thracia_tt: "Our lands there, apart from the capital, become the #Y Regnum Thraciae#!, a kingdom that is our #Y vassal#! and joins the #Y Foederati#!."
      fnr_ROM_CLIENT_iudaea: "Regnum Iudaeae"
      fnr_ROM_CLIENT_iudaea_ADJ: "Judaean"
      fnr_ROM_client_iudaea.title: "Establish the Client Kingdom of Regnum Iudaeae"
      fnr_ROM_client_iudaea.desc: "Herod ruled Judaea as Rome's friend and ally, and built the Temple and Caesarea in the Emperor's honour.\n\nOur lands there will be given to a new king, who will rule them as our vassal and join the #Y Foederati#!."
      fnr_ROM_client_iudaea.a: "Crown a friend of Rome."
      fnr_ROM_client_iudaea_tt: "Our lands there, apart from the capital, become the #Y Regnum Iudaeae#!, a kingdom that is our #Y vassal#! and joins the #Y Foederati#!."
      fnr_ROM_CLIENT_numidia: "Regnum Numidiae"
      fnr_ROM_CLIENT_numidia_ADJ: "Numidian"
      fnr_ROM_client_numidia.title: "Establish the Client Kingdom of Regnum Numidiae"
      fnr_ROM_client_numidia.desc: "The Numidian kings rode beside Scipio at Zama. Their cavalry can ride for Rome once more.\n\nOur lands there will be given to a new king, who will rule them as our vassal and join the #Y Foederati#!."
      fnr_ROM_client_numidia.a: "Crown a friend of Rome."
      fnr_ROM_client_numidia_tt: "Our lands there, apart from the capital, become the #Y Regnum Numidiae#!, a kingdom that is our #Y vassal#! and joins the #Y Foederati#!."
      fnr_ROM_CLIENT_mauretania: "Regnum Mauretaniae"
      fnr_ROM_CLIENT_mauretania_ADJ: "Mauretanian"
      fnr_ROM_client_mauretania.title: "Establish the Client Kingdom of Regnum Mauretaniae"
      fnr_ROM_client_mauretania.desc: "Juba II, raised in Augustus' own household, ruled Mauretania from Caesarea as the most learned king of his age.\n\nOur lands there will be given to a new king, who will rule them as our vassal and join the #Y Foederati#!."
      fnr_ROM_client_mauretania.a: "Crown a friend of Rome."
      fnr_ROM_client_mauretania_tt: "Our lands there, apart from the capital, become the #Y Regnum Mauretaniae#!, a kingdom that is our #Y vassal#! and joins the #Y Foederati#!."
      fnr_ROM_CLIENT_brigantia: "Regnum Brigantum"
      fnr_ROM_CLIENT_brigantia_ADJ: "Brigantian"
      fnr_ROM_client_brigantia.title: "Establish the Client Kingdom of Regnum Brigantum"
      fnr_ROM_client_brigantia.desc: "Queen Cartimandua ruled the Brigantes of northern Britain as Rome's ally, and handed Caratacus over in chains.\n\nOur lands there will be given to a new king, who will rule them as our vassal and join the #Y Foederati#!."
      fnr_ROM_client_brigantia.a: "Crown a friend of Rome."
      fnr_ROM_client_brigantia_tt: "Our lands there, apart from the capital, become the #Y Regnum Brigantum#!, a kingdom that is our #Y vassal#! and joins the #Y Foederati#!."
      diplomatic_status_fnr_ROM_foederati_io_name: "Foederati"
      diplomatic_status_fnr_ROM_foederati_io_tooltip: "Both are members of the #Y Foederati#!"
