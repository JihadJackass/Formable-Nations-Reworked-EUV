l_english:

  ###########################################################
  # Roman Empire - core                                     #
  ###########################################################

      fnr_ROM_formation_tt: "The #Y Roman Empire#! begins its own story. Where this Rome came from decides its #Y origin#! and its starting #Y Legion Loyalty#!. The eleven #Y Imperial Dioceses#! wait to be restored."
      fnr_ROM_loyalty_current: "#Y Legion Loyalty#! is currently #Y [GetPlayer.MakeScope.GetVariable('fnr_ROM_legion_loyalty').GetValue|0]#! / 100"
      fnr_ROM_dioceses_current: "#Y Restored Dioceses#! - #Y [GetPlayer.MakeScope.GetVariable('fnr_ROM_dioceses').GetValue|0]#! of 11"
      fnr_ROM_loyalty_tiers: "#T Tiers#!\n- #Y Loyal Legions#! at 75 and above\n- #Y Steady Legions#! from 50 to 74\n- #Y Restless Legions#! from 25 to 49, and below #R 40#! a usurper may rise\n- #Y Mutinous Legions#! below 25, when usurpers rise often and below #R 20#! the #Y Crisis of the Third Century#! can begin"
      fnr_ROM_loyalty_moves: "#T What moves it#!\n- Each year it drifts #Y 1#! point towards 50.\n- #G Raised by#! Donatives, Triumphs, Castra Legionis, the Imperial Mint, the Praetorian Guard, the Tetrarchy, the Dominate, high army tradition and legitimacy, and the #Y Acclaimed by the Legions#! policy.\n- #R Lowered by#! long wars, low legitimacy, an empty treasury, the Ordo Senatorius, the Principate, the Senate and Dynastic policies, and #R overstretch#! once 6 or more dioceses are restored without a Tetrarchy."
      fnr_ROM_dioceses_tiers: "#T Tiers#!\n- #Y Fragmenta Imperii#! with 1 or 2\n- #Y Imperium Resurgens#! with 3 to 5\n- #Y Orbis Romanus#! with 6 to 8\n- #Y Imperium Paene Restitutum#! with 9 or 10\n- #Y Imperium Sine Fine#! with all 11"
      fnr_ROM_empire_systems_tt: "#T The Roman Empire#!\n- #Y Imperial Dioceses#! - restore each of the eleven Roman regions by holding 60% of it, through the decisions.\n- #Y Legion Loyalty#! - keep the legions loyal, or they will raise their own emperors.\nBoth always show among our country modifiers, and the #Y Hints#! panel explains them."
      fnr_ROM_loyalty_plus_5_tt: "#Y Legion Loyalty#! #G +5#!"
      fnr_ROM_loyalty_plus_10_tt: "#Y Legion Loyalty#! #G +10#!"
      fnr_ROM_loyalty_plus_15_tt: "#Y Legion Loyalty#! #G +15#!"
      fnr_ROM_loyalty_plus_20_tt: "#Y Legion Loyalty#! #G +20#!"
      fnr_ROM_loyalty_minus_5_tt: "#Y Legion Loyalty#! #R -5#!"
      fnr_ROM_loyalty_minus_10_tt: "#Y Legion Loyalty#! #R -10#!"
      fnr_ROM_loyalty_minus_15_tt: "#Y Legion Loyalty#! #R -15#!"
      fnr_ROM_loyalty_minus_20_tt: "#Y Legion Loyalty#! #R -20#!"
      fnr_ROM_diocese_counter_tt: "#Y Restored Dioceses#! #G +1#!"

  ###########################################################
  # Legion Loyalty and Diocese tiers                        #
  ###########################################################

      STATIC_MODIFIER_NAME_fnr_ROM_legions_loyal: "Loyal Legions"
      STATIC_MODIFIER_DESC_fnr_ROM_legions_loyal: "The legions would follow their Emperor to the end of the world.\n\n$fnr_ROM_loyalty_current$\n\n$fnr_ROM_loyalty_tiers$\n\n$fnr_ROM_loyalty_moves$"
      STATIC_MODIFIER_NAME_fnr_ROM_legions_steady: "Steady Legions"
      STATIC_MODIFIER_DESC_fnr_ROM_legions_steady: "The legions are paid and quiet, and the frontier holds.\n\n$fnr_ROM_loyalty_current$\n\n$fnr_ROM_loyalty_tiers$\n\n$fnr_ROM_loyalty_moves$"
      STATIC_MODIFIER_NAME_fnr_ROM_legions_restless: "Restless Legions"
      STATIC_MODIFIER_DESC_fnr_ROM_legions_restless: "In the camps on the frontier, the soldiers talk of who would make a better emperor.\n\n$fnr_ROM_loyalty_current$\n\n$fnr_ROM_loyalty_tiers$\n\n$fnr_ROM_loyalty_moves$"
      STATIC_MODIFIER_NAME_fnr_ROM_legions_mutinous: "Mutinous Legions"
      STATIC_MODIFIER_DESC_fnr_ROM_legions_mutinous: "The legions are close to open revolt. Any general with a donative to offer could be hailed as Augustus.\n\n$fnr_ROM_loyalty_current$\n\n$fnr_ROM_loyalty_tiers$\n\n$fnr_ROM_loyalty_moves$"
      STATIC_MODIFIER_NAME_fnr_ROM_dioceses_tier_1: "Fragmenta Imperii"
      STATIC_MODIFIER_DESC_fnr_ROM_dioceses_tier_1: "Only fragments of the old Empire answer to Rome.\n\n$fnr_ROM_dioceses_current$\n\n$fnr_ROM_dioceses_tiers$"
      STATIC_MODIFIER_NAME_fnr_ROM_dioceses_tier_2: "Imperium Resurgens"
      STATIC_MODIFIER_DESC_fnr_ROM_dioceses_tier_2: "The Empire is rising again, diocese by diocese.\n\n$fnr_ROM_dioceses_current$\n\n$fnr_ROM_dioceses_tiers$"
      STATIC_MODIFIER_NAME_fnr_ROM_dioceses_tier_3: "Orbis Romanus"
      STATIC_MODIFIER_DESC_fnr_ROM_dioceses_tier_3: "Much of the Roman world is Roman once more.\n\n$fnr_ROM_dioceses_current$\n\n$fnr_ROM_dioceses_tiers$"
      STATIC_MODIFIER_NAME_fnr_ROM_dioceses_tier_4: "Imperium Paene Restitutum"
      STATIC_MODIFIER_DESC_fnr_ROM_dioceses_tier_4: "The Empire is all but restored.\n\n$fnr_ROM_dioceses_current$\n\n$fnr_ROM_dioceses_tiers$"
      STATIC_MODIFIER_NAME_fnr_ROM_dioceses_tier_5: "Imperium Sine Fine"
      STATIC_MODIFIER_DESC_fnr_ROM_dioceses_tier_5: "An empire without end, as Jupiter promised. Every diocese is Roman again.\n\n$fnr_ROM_dioceses_current$\n\n$fnr_ROM_dioceses_tiers$"

  ###########################################################
  # The Imperial Dioceses                                   #
  ###########################################################

      STATIC_MODIFIER_NAME_fnr_ROM_diocese_italia: "Diocese of Italia"
      STATIC_MODIFIER_DESC_fnr_ROM_diocese_italia: "The heartland of the Empire. The Eternal City answers to the Emperor again, and so do the cities of the peninsula."
      fnr_ROM_restore_diocese_italia.title: "Restore the Diocese of Italia"
      fnr_ROM_restore_diocese_italia.desc: "The heartland of the Empire. The Eternal City answers to the Emperor again, and so do the cities of the peninsula. With most of the region in our hands, a vicarius can be appointed to govern it in the Emperor's name.\n\n$fnr_ROM_dioceses_current$"
      fnr_ROM_restore_diocese_italia.a: "Appoint a vicarius."
      STATIC_MODIFIER_NAME_fnr_ROM_diocese_galliae: "Diocese of Galliae"
      STATIC_MODIFIER_DESC_fnr_ROM_diocese_galliae: "The rich provinces beyond the Alps, from the Rhone to the Channel, pay Roman taxes and fill Roman legions once more."
      fnr_ROM_restore_diocese_galliae.title: "Restore the Diocese of Galliae"
      fnr_ROM_restore_diocese_galliae.desc: "The rich provinces beyond the Alps, from the Rhone to the Channel, pay Roman taxes and fill Roman legions once more. With most of the region in our hands, a vicarius can be appointed to govern it in the Emperor's name.\n\n$fnr_ROM_dioceses_current$"
      fnr_ROM_restore_diocese_galliae.a: "Appoint a vicarius."
      STATIC_MODIFIER_NAME_fnr_ROM_diocese_hispaniae: "Diocese of Hispaniae"
      STATIC_MODIFIER_DESC_fnr_ROM_diocese_hispaniae: "The peninsula that gave Rome Trajan and Hadrian, its silver mines and its olive groves, is Roman again."
      fnr_ROM_restore_diocese_hispaniae.title: "Restore the Diocese of Hispaniae"
      fnr_ROM_restore_diocese_hispaniae.desc: "The peninsula that gave Rome Trajan and Hadrian, its silver mines and its olive groves, is Roman again. With most of the region in our hands, a vicarius can be appointed to govern it in the Emperor's name.\n\n$fnr_ROM_dioceses_current$"
      fnr_ROM_restore_diocese_hispaniae.a: "Appoint a vicarius."
      STATIC_MODIFIER_NAME_fnr_ROM_diocese_britanniae: "Diocese of Britanniae"
      STATIC_MODIFIER_DESC_fnr_ROM_diocese_britanniae: "The island at the edge of the world. Hadrian's Wall is manned again, and the fleet of Britannia patrols the narrow sea."
      fnr_ROM_restore_diocese_britanniae.title: "Restore the Diocese of Britanniae"
      fnr_ROM_restore_diocese_britanniae.desc: "The island at the edge of the world. Hadrian's Wall is manned again, and the fleet of Britannia patrols the narrow sea. With most of the region in our hands, a vicarius can be appointed to govern it in the Emperor's name.\n\n$fnr_ROM_dioceses_current$"
      fnr_ROM_restore_diocese_britanniae.a: "Appoint a vicarius."
      STATIC_MODIFIER_NAME_fnr_ROM_diocese_raetia: "Diocese of Raetia et Noricum"
      STATIC_MODIFIER_DESC_fnr_ROM_diocese_raetia: "The Alpine provinces and the upper Danube. The limes between Rhine and Danube is restored, and the passes into Italy are ours."
      fnr_ROM_restore_diocese_raetia.title: "Restore the Diocese of Raetia et Noricum"
      fnr_ROM_restore_diocese_raetia.desc: "The Alpine provinces and the upper Danube. The limes between Rhine and Danube is restored, and the passes into Italy are ours. With most of the region in our hands, a vicarius can be appointed to govern it in the Emperor's name.\n\n$fnr_ROM_dioceses_current$"
      fnr_ROM_restore_diocese_raetia.a: "Appoint a vicarius."
      STATIC_MODIFIER_NAME_fnr_ROM_diocese_illyricum: "Diocese of Illyricum"
      STATIC_MODIFIER_DESC_fnr_ROM_diocese_illyricum: "Thrace, Macedonia, Greece and the Illyrian highlands, the recruiting ground of the soldier emperors. Their sons fill our legions."
      fnr_ROM_restore_diocese_illyricum.title: "Restore the Diocese of Illyricum"
      fnr_ROM_restore_diocese_illyricum.desc: "Thrace, Macedonia, Greece and the Illyrian highlands, the recruiting ground of the soldier emperors. Their sons fill our legions. With most of the region in our hands, a vicarius can be appointed to govern it in the Emperor's name.\n\n$fnr_ROM_dioceses_current$"
      fnr_ROM_restore_diocese_illyricum.a: "Appoint a vicarius."
      STATIC_MODIFIER_NAME_fnr_ROM_diocese_dacia: "Diocese of Dacia"
      STATIC_MODIFIER_DESC_fnr_ROM_diocese_dacia: "Trajan's conquest beyond the Danube, its gold and its mountain fortresses, is Roman again."
      fnr_ROM_restore_diocese_dacia.title: "Restore the Diocese of Dacia"
      fnr_ROM_restore_diocese_dacia.desc: "Trajan's conquest beyond the Danube, its gold and its mountain fortresses, is Roman again. With most of the region in our hands, a vicarius can be appointed to govern it in the Emperor's name.\n\n$fnr_ROM_dioceses_current$"
      fnr_ROM_restore_diocese_dacia.a: "Appoint a vicarius."
      STATIC_MODIFIER_NAME_fnr_ROM_diocese_asiana: "Diocese of Asiana"
      STATIC_MODIFIER_DESC_fnr_ROM_diocese_asiana: "The old cities of Asia Minor, Ephesus and Pergamon, Nicaea and Ancyra, are governed from Rome again."
      fnr_ROM_restore_diocese_asiana.title: "Restore the Diocese of Asiana"
      fnr_ROM_restore_diocese_asiana.desc: "The old cities of Asia Minor, Ephesus and Pergamon, Nicaea and Ancyra, are governed from Rome again. With most of the region in our hands, a vicarius can be appointed to govern it in the Emperor's name.\n\n$fnr_ROM_dioceses_current$"
      fnr_ROM_restore_diocese_asiana.a: "Appoint a vicarius."
      STATIC_MODIFIER_NAME_fnr_ROM_diocese_oriens: "Diocese of Oriens"
      STATIC_MODIFIER_DESC_fnr_ROM_diocese_oriens: "Syria, Palestine and Mesopotamia, Antioch and Damascus and the caravan roads of the East, are Roman again."
      fnr_ROM_restore_diocese_oriens.title: "Restore the Diocese of Oriens"
      fnr_ROM_restore_diocese_oriens.desc: "Syria, Palestine and Mesopotamia, Antioch and Damascus and the caravan roads of the East, are Roman again. With most of the region in our hands, a vicarius can be appointed to govern it in the Emperor's name.\n\n$fnr_ROM_dioceses_current$"
      fnr_ROM_restore_diocese_oriens.a: "Appoint a vicarius."
      STATIC_MODIFIER_NAME_fnr_ROM_diocese_aegyptus: "Diocese of Aegyptus"
      STATIC_MODIFIER_DESC_fnr_ROM_diocese_aegyptus: "The granary of the Empire. The grain fleets sail from Alexandria for Rome once more."
      fnr_ROM_restore_diocese_aegyptus.title: "Restore the Diocese of Aegyptus"
      fnr_ROM_restore_diocese_aegyptus.desc: "The granary of the Empire. The grain fleets sail from Alexandria for Rome once more. With most of the region in our hands, a vicarius can be appointed to govern it in the Emperor's name.\n\n$fnr_ROM_dioceses_current$"
      fnr_ROM_restore_diocese_aegyptus.a: "Appoint a vicarius."
      STATIC_MODIFIER_NAME_fnr_ROM_diocese_africa: "Diocese of Africa"
      STATIC_MODIFIER_DESC_fnr_ROM_diocese_africa: "Carthage, Numidia and Mauretania, the wheat fields and olive groves of Roman Africa, are restored to the Empire."
      fnr_ROM_restore_diocese_africa.title: "Restore the Diocese of Africa"
      fnr_ROM_restore_diocese_africa.desc: "Carthage, Numidia and Mauretania, the wheat fields and olive groves of Roman Africa, are restored to the Empire. With most of the region in our hands, a vicarius can be appointed to govern it in the Emperor's name.\n\n$fnr_ROM_dioceses_current$"
      fnr_ROM_restore_diocese_africa.a: "Appoint a vicarius."

  ###########################################################
  # Decisions                                               #
  ###########################################################

      fnr_ROM_pay_donative.title: "Pay a Donative"
      fnr_ROM_pay_donative.desc: "Every new emperor learns it quickly. The legions expect silver, and an emperor who pays them is an emperor they will keep.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM_pay_donative.a: "Open the treasury."
      fnr_ROM_hold_triumph.title: "Hold a Triumph"
      fnr_ROM_hold_triumph.desc: "The Emperor rides up the Via Sacra in a four-horse chariot, the spoils of his wars carried before him and his legions marching behind, singing.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM_hold_triumph.a: "Io triumphe!"
      fnr_ROM_two_capitals_decision.title: "The Two Capitals"
      fnr_ROM_two_capitals_decision.desc: "Old Rome on the Tiber and New Rome on the Bosporus are ruled by one Emperor again. Let each have its own senate, its own prefect and its own court, and let both serve one Empire."
      fnr_ROM_two_capitals_decision.a: "One Empire, two capitals."
      fnr_ROM_imperium_occidentis_decision.title: "Imperium Occidentis Restitutum"
      fnr_ROM_imperium_occidentis_decision.desc: "Italy, Gaul and Spain, the heart of the Western Empire, are Roman again. The renovatio that began with a crown in Saint Peter's is complete."
      fnr_ROM_imperium_occidentis_decision.a: "The West is restored."
      fnr_ROM_ara_pacis_decision.title: "The Ara Pacis"
      fnr_ROM_ara_pacis_decision.desc: "The civil wars are over. Let an altar to Peace be raised on the Campus Martius, carved with the Emperor, his family and the Senate walking in procession, so that every Roman remembers who brought it."
      fnr_ROM_ara_pacis_decision.a: "Raise the altar."
      fnr_ROM_res_gestae_decision.title: "Res Gestae"
      fnr_ROM_res_gestae_decision.desc: "The deeds of the Princeps, carved in bronze before his mausoleum and copied in every province. He restored the Republic, he will say, and in a sense he did."
      fnr_ROM_res_gestae_decision.a: "Carve them in bronze."
      fnr_ROM_emperor_of_the_romans_decision.title: "Emperor of the Romans"
      fnr_ROM_emperor_of_the_romans_decision.desc: "We took the name of Rome. Now the world must accept it. With the Empire's provinces returning one by one and our right to rule beyond question, the courts of Christendom and beyond can be made to address us as Emperor of the Romans."
      fnr_ROM_emperor_of_the_romans_decision.a: "Let the world call us Rome."

  ###########################################################
  # Origins                                                 #
  ###########################################################

      STATIC_MODIFIER_NAME_fnr_ROM_origin_new_rome: "Basileia ton Romaion"
      STATIC_MODIFIER_DESC_fnr_ROM_origin_new_rome: "The Roman Empire never fell. It only moved east, and now it has come home."
      STATIC_MODIFIER_NAME_fnr_ROM_origin_renovatio: "Renovatio Imperii"
      STATIC_MODIFIER_DESC_fnr_ROM_origin_renovatio: "The Western Empire was restored by a crown in Saint Peter's. Now it is Rome in more than name."
      STATIC_MODIFIER_NAME_fnr_ROM_origin_augustus: "Divi Filius"
      STATIC_MODIFIER_DESC_fnr_ROM_origin_augustus: "The Republic crowned its general Imperator Caesar Augustus. The legions remember who made him."
      STATIC_MODIFIER_NAME_fnr_ROM_origin_principate: "Princeps Civitatis"
      STATIC_MODIFIER_DESC_fnr_ROM_origin_principate: "The Republic became the Principate, and the Principate became the Empire. The Senate still meets, and still matters, a little."
      STATIC_MODIFIER_NAME_fnr_ROM_origin_restorer: "Translatio Imperii"
      STATIC_MODIFIER_DESC_fnr_ROM_origin_restorer: "The Empire passed to new hands. They took the name of Rome, and mean to earn it."
      STATIC_MODIFIER_NAME_fnr_ROM_two_capitals: "The Two Capitals"
      STATIC_MODIFIER_DESC_fnr_ROM_two_capitals: "Old Rome and New Rome serve one Emperor."
      STATIC_MODIFIER_NAME_fnr_ROM_imperium_occidentis: "Imperium Occidentis Restitutum"
      STATIC_MODIFIER_DESC_fnr_ROM_imperium_occidentis: "The Western Empire is restored."
      STATIC_MODIFIER_NAME_fnr_ROM_ara_pacis: "The Ara Pacis"
      STATIC_MODIFIER_DESC_fnr_ROM_ara_pacis: "The altar of Augustan Peace stands on the Campus Martius."
      STATIC_MODIFIER_NAME_fnr_ROM_res_gestae: "Res Gestae"
      STATIC_MODIFIER_DESC_fnr_ROM_res_gestae: "The deeds of the Princeps are carved in bronze in every province."
      STATIC_MODIFIER_NAME_fnr_ROM_recognized_emperor: "Emperor of the Romans"
      STATIC_MODIFIER_DESC_fnr_ROM_recognized_emperor: "The world addresses us as Rome."
      STATIC_MODIFIER_NAME_fnr_ROM_donative: "Donative Paid"
      STATIC_MODIFIER_DESC_fnr_ROM_donative: "The legions have been paid, and they cheer the Emperor's name."
      STATIC_MODIFIER_NAME_fnr_ROM_triumph: "Imperial Triumph"
      STATIC_MODIFIER_DESC_fnr_ROM_triumph: "The city still talks of the Emperor's triumph."
      STATIC_MODIFIER_NAME_fnr_ROM_foederati_settled: "Foederati Settled"
      STATIC_MODIFIER_DESC_fnr_ROM_foederati_settled: "Barbarian peoples settled inside the frontier fight for Rome under their own kings."
      STATIC_MODIFIER_NAME_fnr_ROM_limes_closed: "The Limes Closed"
      STATIC_MODIFIER_DESC_fnr_ROM_limes_closed: "The frontier is closed. No barbarian crosses without the Emperor's leave."
      STATIC_MODIFIER_NAME_fnr_ROM_census_tax: "Imperial Census - Taxes"
      STATIC_MODIFIER_DESC_fnr_ROM_census_tax: "Every field and every head in the Empire is counted and taxed."
      STATIC_MODIFIER_NAME_fnr_ROM_census_levy: "Imperial Census - Levies"
      STATIC_MODIFIER_DESC_fnr_ROM_census_levy: "Every man of fighting age in the Empire is on the rolls."
      STATIC_MODIFIER_NAME_fnr_ROM_debased_coinage: "Debased Coinage"
      STATIC_MODIFIER_DESC_fnr_ROM_debased_coinage: "The denarius is more bronze than silver, and the markets know it."
      STATIC_MODIFIER_NAME_fnr_ROM_limes_breached: "The Limes Breached"
      STATIC_MODIFIER_DESC_fnr_ROM_limes_breached: "Barbarian war bands roam the frontier provinces."
      STATIC_MODIFIER_NAME_fnr_ROM_restitutor_orbis: "Restitutor Orbis"
      STATIC_MODIFIER_DESC_fnr_ROM_restitutor_orbis: "The Emperor who restored the world. The Crisis is over, and the Empire is whole and stronger for it."
      STATIC_MODIFIER_NAME_fnr_ROM_imperium_sine_fine_restored: "Imperium Sine Fine"
      STATIC_MODIFIER_DESC_fnr_ROM_imperium_sine_fine_restored: "Every diocese of the old Empire is Roman again."
      STATIC_MODIFIER_NAME_fnr_ROM_senate_dignity: "Senatorial Dignity"
      STATIC_MODIFIER_DESC_fnr_ROM_senate_dignity: "The Senate of Rome governs provinces and judges cases again."
      STATIC_MODIFIER_NAME_fnr_ROM_senate_silenced: "The Senate Silenced"
      STATIC_MODIFIER_DESC_fnr_ROM_senate_silenced: "The Senate advises. The Emperor decides."

  ###########################################################
  # Advances                                                #
  ###########################################################

      fnr_ROM_imperial_dioceses: "The Imperial Dioceses"
      fnr_ROM_imperial_dioceses_desc: "The provinces are grouped into dioceses, each governed by a vicarius who answers to the Emperor. Restoring each diocese is the great work of the Empire."
      fnr_ROM_comitatenses: "The Comitatenses"
      fnr_ROM_comitatenses_desc: "Mobile field armies stand behind the frontier, ready to march wherever the enemy breaks through.\n\nUnlocks the #Y Palatini#! and the #Y Clibanarii#!."
      fnr_ROM_limes: "The Limes"
      fnr_ROM_limes_desc: "Walls, ditches, watchtowers and legionary fortresses mark where Rome ends.\n\nUnlocks the #Y Castra Legionis#!."
      fnr_ROM_lex_de_imperio: "Lex de Imperio"
      fnr_ROM_lex_de_imperio_desc: "The law that grants an emperor his powers. Who confers it, the Senate, the army or his own blood, is the oldest question of the Empire.\n\nUnlocks the #Y Lex de Imperio#! law."
      fnr_ROM_tetrarchia: "The Tetrarchy"
      fnr_ROM_tetrarchia_desc: "The Empire is too large for one man. Two Augusti and two Caesares can share its frontiers.\n\nUnlocks the #Y Tetrarchy#! government reform."
      fnr_ROM_annona: "The Annona"
      fnr_ROM_annona_desc: "The grain of Egypt and Africa feeds the cities of the Empire, and the cities love the Emperor for it."
      fnr_ROM_orbis_romanus: "Orbis Romanus"
      fnr_ROM_orbis_romanus_desc: "The Roman world, ruled from Rome. Needs #Y 9#! restored dioceses."

  ###########################################################
  # Reforms, law and privileges                             #
  ###########################################################

      fnr_ROM_principate: "The Principate"
      fnr_ROM_principate_desc: "The Emperor rules as first citizen, keeping the forms of the Republic and the dignity of the Senate. #R Legion Loyalty -1#! a year. Cannot be held with the Dominate."
      fnr_ROM_dominate: "The Dominate"
      fnr_ROM_dominate_desc: "The Emperor is lord and master, robed in purple and approached on bended knee. #G Legion Loyalty +1#! a year. Needs the end of the #Y Crisis of the Third Century#! or legitimacy of 90. Cannot be held with the Principate."
      fnr_ROM_tetrarchy: "The Tetrarchy"
      fnr_ROM_tetrarchy_desc: "Two senior emperors and two junior ones share the frontiers. #G Legion Loyalty +2#! a year, #G no overstretch#! from many dioceses, and usurpers rise far less often. Needs #Y 5#! restored dioceses."
      fnr_ROM_lex_de_imperio_law: "Lex de Imperio"
      fnr_ROM_lex_de_imperio_law_desc: "Who makes an Emperor? Each answer changes what the legions think of him.\n\n$fnr_ROM_loyalty_current$"
      fnr_ROM_lex_senatus_policy: "Confirmed by the Senate"
      fnr_ROM_lex_senatus_policy_desc: "The Senate confers the imperium, as it did for Vespasian. #R Legion Loyalty -1 a year.#!"
      fnr_ROM_lex_exercitus_policy: "Acclaimed by the Legions"
      fnr_ROM_lex_exercitus_policy_desc: "The emperor is whoever the army raises on its shields. #G Legion Loyalty +3 a year.#!"
      fnr_ROM_lex_dynastica_policy: "Born in the Purple"
      fnr_ROM_lex_dynastica_policy_desc: "The purple passes from father to son, blessed by the priests. #R Legion Loyalty -2 a year.#!"
      fnr_ROM_ordo_senatorius: "Ordo Senatorius"
      fnr_ROM_ordo_senatorius_desc: "The senatorial order governs the provinces and commands their garrisons. While granted, #Y Legion Loyalty#! falls by #R 1#! each year."
      fnr_ROM_praetorian_guard: "The Praetorian Guard"
      fnr_ROM_praetorian_guard_desc: "The Emperor's own soldiers, the only troops in Rome. While granted, #Y Legion Loyalty#! rises by #G 2#! each year, but when the legions are restless the Guard may stir."
      fnr_ROM_pontifex_maximus: "Pontifex Maximus"
      fnr_ROM_pontifex_maximus_desc: "The Emperor is the chief priest of Rome, and the priesthood answers to him."
      fnr_ROM_annona_civica: "The Annona Civica"
      fnr_ROM_annona_civica_desc: "Free grain for the people of the cities, shipped from the granaries of the Empire."

  ###########################################################
  # Units and buildings                                     #
  ###########################################################

      fnr_ROM_palatini_1: "Palatini"
