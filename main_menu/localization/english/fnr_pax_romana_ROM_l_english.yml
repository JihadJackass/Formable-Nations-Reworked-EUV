      fnr_ROM_castra_legionis_desc: "A permanent legionary fortress on the frontier. Cannot be built in the capital's region. Legion Loyalty rises by #G 1#! a year with one, #G 2#! with three and #G 3#! with six."
      fnr_ROM_castra_legionis_maintenance: "Castra Upkeep"
      fnr_ROM_imperial_mint: "Imperial Mint"
      fnr_ROM_imperial_mint_desc: "Where the Emperor's face is struck on gold and silver. Capital only. While it stands, #Y Legion Loyalty#! rises by #G 1#! each year, because the legions are paid on time."
      fnr_ROM_imperial_mint_maintenance: "Mint Upkeep"
      fnr_ROM_palatium: "The Palatium"
      fnr_ROM_palatium_desc: "The palace of the Emperors, from which the whole Empire is governed. Capital only."
      fnr_ROM_palatium_maintenance: "Palatium Upkeep"

