      fnr_ROM_usurper_rebels: "A Usurper's Legions"
      fnr_ROM_usurper_rebels_country: "$fnr_ROM_usurper_rebels$"
      fnr_ROM_usurper_rebels_country_adjective: "Usurper"
      fnr_ROM_gallic_empire: "The Gallic Empire"
      fnr_ROM_gallic_empire_country: "$fnr_ROM_gallic_empire$"
      fnr_ROM_gallic_empire_country_adjective: "Gallic"
      fnr_ROM_palmyrene_empire: "The Palmyrene Empire"
      fnr_ROM_palmyrene_empire_country: "$fnr_ROM_palmyrene_empire$"
      fnr_ROM_palmyrene_empire_country_adjective: "Palmyrene"
      fnr_ROM_usurper_tt: "A general in a far diocese is proclaimed #R Augustus#! by his legions. Up to four of its provinces rise for him. Beat him and the legions may come back to us."
      fnr_ROM_secession_tt: "A whole part of the Empire breaks away under its own emperor. Up to four of its provinces rise."
      fnr_ROM_usurpers_gone_tt: "No #Y usurper#!, #Y Gallic Empire#! or #Y Palmyrene Empire#! is still gathering in our lands"
      fnr_ROM_crisis_tt: "#T The Crisis of the Third Century#!\nUsurpers, secessions, barbarian raids and a worthless coinage will test the Empire. It ends after at least #Y 5#! years once #Y Legion Loyalty#! is back to #Y 50#! and every usurper is beaten, or after #Y 20#! years whatever happens. Donatives, Triumphs and the Castra Legionis will help."
      fnr_ROM_restitutor_tt: "#Y Legion Loyalty#! is set to #Y 60#!.\nThe #Y Dominate#! government reform is now available."
      fnr_ROM_crisis_of_the_third_century: "The Crisis of the Third Century"
      fnr_ROM_crisis_of_the_third_century_desc: "Emperors rise and fall in a season, each hailed by his own legions and murdered by the next. The coinage is worthless, the frontiers are broken and whole provinces have chosen their own emperors. The Empire must be restored, or it will not survive."
      fnr_ROM_panel_loyalty_title: "Legion Loyalty"
      fnr_ROM_panel_loyalty_desc: "Raise it back to 50"
      fnr_ROM_panel_dioceses_title: "Restored Dioceses"
      fnr_ROM_panel_dioceses_desc: "The Empire we must hold together"
      fnr_ROM_panel_crisis_title: "The Crisis"
      fnr_ROM_panel_crisis_desc: "Lasts at least 60 months"
      fnr_ROM_panel_months_value: "[GetPlayer.MakeScope.GetVariable('fnr_ROM_crisis_months').GetValue|0] months"

