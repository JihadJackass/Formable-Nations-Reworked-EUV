l_english:

  ###########################################################
  # Pax Romana - Roman Republic (RMNRP)                     #
  ###########################################################

    # FORMATION

      fnr_RMNRP_formation_tt: "The Republic is restored. We become a #Y Republic#! if we are not one already, adopt the #Y Consular Election#! and the #Y Republican Restoration#! reform, and the #Y Senate Authority#! track begins at #Y 60#!."

    # SENATE AUTHORITY

      fnr_RMNRP_senate_current: "#Y Senate Authority#! is currently #Y [GetPlayer.MakeScope.GetVariable('fnr_RMNRP_senate_authority').GetValue|0]#! / 100"
      fnr_RMNRP_senate_tiers: "#T Tiers#!\n- #Y Sovereign Senate#! at 75 and above\n- #Y Balanced Senate#! from 40 to 74\n- #Y Weakened Senate#! below 40\n- #Y Senate in Disarray#! below 25, and below #R 20#! a general may cross the Rubicon"
      fnr_RMNRP_senate_moves: "#T What moves it#!\n- Each year it drifts #Y 1#! point towards 50.\n- #G Raised by#! Consult the Senate, siding with the Optimates, the Senatorial Prerogative privilege, the Curia.\n- #R Lowered by#! a Dictator (and #R -3#! a year while he rules), Triumphs, Bread and Circuses, Granting Citizenship, the Tribunicia Potestas privilege."
      fnr_RMNRP_senate_plus_3_tt: "#Y Senate Authority#! #G +3#!"
      fnr_RMNRP_senate_plus_5_tt: "#Y Senate Authority#! #G +5#!"
      fnr_RMNRP_senate_plus_10_tt: "#Y Senate Authority#! #G +10#!"
      fnr_RMNRP_senate_plus_15_tt: "#Y Senate Authority#! #G +15#!"
      fnr_RMNRP_senate_plus_20_tt: "#Y Senate Authority#! #G +20#!"
      fnr_RMNRP_senate_minus_2_tt: "#Y Senate Authority#! #R -2#!"
      fnr_RMNRP_senate_minus_5_tt: "#Y Senate Authority#! #R -5#!"
      fnr_RMNRP_senate_minus_10_tt: "#Y Senate Authority#! #R -10#!"

    # ADVANCES

      RMNRP_mos_maiorum: "Mos Maiorum"
      RMNRP_mos_maiorum_desc: "The custom of the ancestors - the unwritten code of duty, piety and restraint by which the old Republic governed itself. Every Roman magistrate is measured against it."
      RMNRP_cursus_honorum: "Cursus Honorum"
      RMNRP_cursus_honorum_desc: "The ladder of offices, from quaestor to aedile to praetor to consul. No man may climb it too young, nor skip a rung.\n\nUnlocks the #Y Cursus Honorum#! government reform."
      RMNRP_twelve_tables: "The Twelve Tables"
      RMNRP_twelve_tables_desc: "The law of Rome, written on bronze and set up in the Forum where every citizen can read it. Patrician and plebeian stand under the same law.\n\nUnlocks the #Y Twelve Tables#! law."
      RMNRP_marian_reforms: "The Marian Reforms"
      RMNRP_marian_reforms_desc: "The legions are opened to the landless poor, paid, equipped and drilled by the state. A professional army is born, loyal to its generals as much as to the Senate.\n\nUnlocks the #Y Republican Legionaries#!."
      RMNRP_res_publica_aeterna: "Res Publica Aeterna"
      RMNRP_res_publica_aeterna_desc: "The eternal Republic. Italy is united under the Senate and People of Rome, the Senate is strong and the people free.\n\nRequires a #Y Republic#!, #Y Senate Authority#! of at least #Y 60#!, #Y 75#! republican tradition and #Y 80%#! of Italy."

    # GOVERNMENT REFORMS

      fnr_RMNRP_republican_restoration: "Republican Restoration"
      fnr_RMNRP_republican_restoration_desc: "The Senate and People of Rome govern once more. Two consuls are elected each term from among the patricians and the equites, and no consul may succeed himself. Keeps the #Y Consular Election#!."
      fnr_RMNRP_cursus_honorum: "Cursus Honorum"
      fnr_RMNRP_cursus_honorum_desc: "Every office of state is a rung on the ladder to the consulship. Ambitious men serve long and well before they may command."

    # HEIR SELECTION

      fnr_RMNRP_consular_election: "Consular Election"
      fnr_RMNRP_consular_election_desc: "Every four years the centuriate assembly elects the consuls from among the patricians and the equites. The sitting consul cannot stand again. Military and administrative skill count for the most."

    # LAWS

      fnr_RMNRP_twelve_tables_law: "The Twelve Tables"
      fnr_RMNRP_twelve_tables_law_desc: "Is the law of Rome the custom of the patrician families, or written law that binds every citizen alike?"
      fnr_RMNRP_mos_maiorum_policy: "Mos Maiorum"
      fnr_RMNRP_mos_maiorum_policy_desc: "Law is what the ancestors did, and the patricians remember what the ancestors did."
      fnr_RMNRP_twelve_tables_policy: "The Twelve Tables"
      fnr_RMNRP_twelve_tables_policy_desc: "The law is written down for every citizen to read. Even the consuls are bound by it."

    # ESTATE PRIVILEGES

      fnr_RMNRP_senatorial_prerogative: "Senatorial Prerogative"
      fnr_RMNRP_senatorial_prerogative_desc: "The patrician Senate controls the treasury, foreign policy and the assignment of provinces. While granted, #Y Senate Authority#! rises by #G 2#! each year."
      fnr_RMNRP_tribunicia_potestas: "Tribunicia Potestas"
      fnr_RMNRP_tribunicia_potestas_desc: "The tribunes of the plebs are sacrosanct, and their veto can halt any act of the Senate. While granted, #Y Senate Authority#! falls by #R 1#! each year."
      fnr_RMNRP_equestrian_order: "The Equestrian Order"
      fnr_RMNRP_equestrian_order_desc: "The knights of Rome, the wealthy men below the Senate, farm the taxes, run the trading houses and ride in the cavalry.\n\nUnlocks the #Y Equites#!."

    # UNITS

      fnr_RMNRP_legionaries_1: "Republican Legionaries"
      fnr_RMNRP_legionaries_1_desc: "Citizen soldiers of Rome, drilled in the manipular and cohort tactics of their ancestors and paid by the Republic."
      fnr_RMNRP_legionaries_2: "Republican Legionaries"
      fnr_RMNRP_legionaries_2_desc: "$fnr_RMNRP_legionaries_1_desc$"
      fnr_RMNRP_legionaries_3: "Republican Legionaries"
      fnr_RMNRP_legionaries_3_desc: "$fnr_RMNRP_legionaries_1_desc$"
      fnr_RMNRP_legionaries_4: "Republican Legionaries"
      fnr_RMNRP_legionaries_4_desc: "$fnr_RMNRP_legionaries_1_desc$"
      fnr_RMNRP_legionaries_5: "Republican Legionaries"
      fnr_RMNRP_legionaries_5_desc: "$fnr_RMNRP_legionaries_1_desc$"
      fnr_RMNRP_legionaries_6: "Republican Legionaries"
      fnr_RMNRP_legionaries_6_desc: "$fnr_RMNRP_legionaries_1_desc$"
      fnr_RMNRP_equites_1: "Equites"
      fnr_RMNRP_equites_1_desc: "The cavalry of the equestrian order, rich men who can afford a horse and armour and serve the Republic in the saddle."
      fnr_RMNRP_equites_2: "Equites"
      fnr_RMNRP_equites_2_desc: "$fnr_RMNRP_equites_1_desc$"
      fnr_RMNRP_equites_3: "Equites"
      fnr_RMNRP_equites_3_desc: "$fnr_RMNRP_equites_1_desc$"
      fnr_RMNRP_equites_4: "Equites"
      fnr_RMNRP_equites_4_desc: "$fnr_RMNRP_equites_1_desc$"
      fnr_RMNRP_equites_5: "Equites"
      fnr_RMNRP_equites_5_desc: "$fnr_RMNRP_equites_1_desc$"

    # BUILDINGS

      fnr_RMNRP_curia: "The Curia"
      fnr_RMNRP_curia_desc: "The Senate house of Rome, where the conscript fathers meet to debate and decree. Can only be built in the capital. While it stands, #Y Senate Authority#! rises by #G 1#! each year."
      fnr_RMNRP_curia_maintenance: "Curia Upkeep"
      fnr_RMNRP_basilica: "Basilica"
      fnr_RMNRP_basilica_desc: "A great hall of law and commerce, where the praetors hear cases under the Twelve Tables and merchants strike their bargains."
      fnr_RMNRP_basilica_maintenance: "Basilica Upkeep"

    # DECISIONS

      fnr_RMNRP_appoint_dictator.title: "Appoint a Dictator"
      fnr_RMNRP_appoint_dictator.desc: "In the hour of greatest danger, the Republic may give one man absolute command for a fixed term. Cincinnatus laid the power down after sixteen days. Not every dictator has been so modest.\n\n$fnr_RMNRP_senate_current$"
      fnr_RMNRP_appoint_dictator.a: "Give him the fasces."
      fnr_RMNRP_appoint_dictator_tt: "#Y Senate Authority#! #R -15#!, and #R -3#! every year while the dictatorship lasts.\nThe dictatorship lasts #Y 10#! years or until the war ends. Then the dictator must choose to lay down the fasces and restore the Republic, or keep them and start a #R civil war#! that leads to #Y Empire#!."
      fnr_RMNRP_grant_citizenship.title: "Grant Roman Citizenship"
      fnr_RMNRP_grant_citizenship.desc: "The towns of Italy have fought in our legions for generations. Extending the citizenship to more of them would bind them to Rome forever, though the old families will grumble.\n\n$fnr_RMNRP_senate_current$"
      fnr_RMNRP_grant_citizenship.a: "Civis Romanus sum."
      fnr_RMNRP_hold_triumph.title: "Hold a Triumph"
      fnr_RMNRP_hold_triumph.desc: "A victorious general rides through the city in a four-horse chariot, his face painted red like Jupiter's, while a slave whispers behind him: remember you are mortal.\n\n$fnr_RMNRP_senate_current$"
      fnr_RMNRP_hold_triumph.a: "Io triumphe!"
      fnr_RMNRP_bread_and_circuses.title: "Bread and Circuses"
      fnr_RMNRP_bread_and_circuses.desc: "Free grain from the public stores, chariot races in the Circus and games in the arena. The plebs will love us for it, for a while.\n\n$fnr_RMNRP_senate_current$"
      fnr_RMNRP_bread_and_circuses.a: "Panem et circenses."
      fnr_RMNRP_consult_the_senate.title: "Consult the Senate"
      fnr_RMNRP_consult_the_senate.desc: "The consul lays the business of state before the conscript fathers and asks their counsel. It costs nothing but time and pride.\n\n$fnr_RMNRP_senate_current$"
      fnr_RMNRP_consult_the_senate.a: "Senatus consultum."
      fnr_RMNRP_found_socii.title: "Found the Socii"
      fnr_RMNRP_found_socii.desc: "Rome ruled Italy through a web of alliances: every city kept its own government, but sent its soldiers to fight beside the legions. Let us bind the Italian states to us once more."
      fnr_RMNRP_found_socii.a: "Found the Socii."
      fnr_RMNRP_renew_foedera_tt: "Every member of the #Y Socii#!, including us, gains #Y Foedera Renewed#! for 5 years, and every other member thinks better of us. Can be done again in 5 years."
      fnr_RMNRP_levy_socii_tt: "Every member of the #Y Socii#!, including us, gains #Y Socii Levied#! for 2 years. Can be done again in 10 years."

    # INTERNATIONAL ORGANIZATION - The Socii

      fnr_RMNRP_socii_io: "The Socii"
      fnr_RMNRP_socii_io_name: "The Socii"
      fnr_RMNRP_socii_io_created_tt: "Founds the #Y Socii#! with us as its permanent leader. Our subjects join automatically."
      fnr_RMNRP_socii_io_desc: "The Italian allies of the Roman Republic, each governing itself but bound to fight beside Rome.\n\n#T How it works#!\n- #Y Who can join#! - any subject of Rome, any Italian state with its capital in Italy, and #Y Byzantium#! once Concordia reaches 30. Our subjects join automatically.\n- #Y Defense#! - members are called into each other's defensive wars.\n- #Y Members#! gain defense and heavy infantry power, and think better of Rome.\n- #Y The Roman Republic#! gains republican tradition and manpower, plus manpower and prestige for every member, up to 8.\n- #Y League actions#! (the Actions tab of this panel) - #Y Renew the Foedera#! in peace every 5 years, #Y Levy the Socii#! in war every 10 years, and for a single member #Y Promote Latin#!, #Y Grant the Ius Latii#! or #Y Incorporate into Rome#!.\n- With two or more members, the allies may one day demand the #Y citizenship#!."
      fnr_RMNRP_socii_io_list_who_tt: "$WHO$ is a member of [GetUniqueInternationalOrganization('fnr_RMNRP_socii_io').GetName] with $LIST$"
      diplomatic_status_fnr_RMNRP_socii_io_name: "The Socii"
      diplomatic_status_fnr_RMNRP_socii_io_tooltip: "#T The Socii#!\nThis [country|e] is an ally of Rome in the Socii."
      io_opinion_fnr_RMNRP_socii_io: "Fellow Ally of Rome"

    # OPINIONS

      fnr_RMNRP_sworn_socius: "Sworn Ally of Rome"
      fnr_RMNRP_renewed_foedus: "Renewed our Treaty"
      fnr_RMNRP_granted_citizenship: "Granted us Roman Citizenship"
      fnr_RMNRP_denied_citizenship: "Denied us Roman Citizenship"
      fnr_RMNRP_refused_reunion: "Refused the Reunion of the Romans"
      fnr_RMNRP_purple_marriage: "Purple Marriage"

    # REBELS

      fnr_RMNRP_republican_loyalists: "Republican Loyalists"
      fnr_RMNRP_republican_loyalists_country: "$fnr_RMNRP_republican_loyalists$"
      fnr_RMNRP_republican_loyalists_country_adjective: "$fnr_RMNRP_republican_loyalists$"
      fnr_RMNRP_rubicon_rebels: "Legions of the Rubicon"
      fnr_RMNRP_rubicon_rebels_country: "$fnr_RMNRP_rubicon_rebels$"
      fnr_RMNRP_rubicon_rebels_country_adjective: "$fnr_RMNRP_rubicon_rebels$"

    # EVENTS

      fnr_RMNRP.1.title: "Senatus Populusque Romanus"
      fnr_RMNRP.1.desc: "For the first time in a thousand years, the Senate meets on the Capitol as the government of a free Rome. The fasces are carried before the consuls again, and the letters SPQR are carved over the city gates. But the old question returns with the old institutions: does the Republic belong to the Senate, or to the People?\n\n#T Senate Authority#!\nThe power of the Senate is tracked from 0 to 100 and starts at #Y 60#!. It always appears among our country modifiers as the #Y Sovereign#!, #Y Balanced#!, #Y Weakened#! or #Y In Disarray#! Senate, whose tooltip shows the current value and what changes it. Senate-related decisions also show it. A high Senate brings stability; a weak one invites dictators and civil war. See the #Y Hints#! panel for more."
      fnr_RMNRP.1.a: "The Senate is sovereign."
      fnr_RMNRP.1.b: "The Senate and the People, together."
      fnr_RMNRP.2.title: "The Senate Convenes"
      fnr_RMNRP.2.desc: "A year on, the Senate has split into two camps. The Optimates, the 'best men', defend the authority of the Senate and the great families. The Populares appeal over the Senate's head to the assemblies and the plebs. Every consul must choose a side, or try to stand above them both."
      fnr_RMNRP.2.a: "With the Optimates."
      fnr_RMNRP.2.b: "With the Populares."
      fnr_RMNRP.2.c: "Above the factions."
      fnr_RMNRP.3.title: "The Consuls Take Office"
      fnr_RMNRP.3.desc: "On the Kalends the new consuls climb the Capitol to sacrifice to Jupiter and take up the fasces. Their year of office lies ahead, and Rome watches to see what kind of men it has chosen."
      fnr_RMNRP.3.a: "Swear by the laws of the Republic."
      fnr_RMNRP.3.b: "Court the plebs."
      fnr_RMNRP.3.c: "A consul for war."
      fnr_RMNRP.4.title: "The Land Law"
      fnr_RMNRP.4.desc: "A young tribune of noble birth stands on the Rostra and accuses the great families of swallowing the public land, while the men who fight in our legions return home to find they have nothing. He proposes a law to share the land among the poor. The Senate is furious."
      fnr_RMNRP.4.a: "Pass the land law."
      fnr_RMNRP.4.b: "The Senate blocks it."
      fnr_RMNRP.5.title: "The Ambitious General"
      fnr_RMNRP.5.desc: "One of our generals has won victory after victory, and his soldiers would follow him anywhere. Too far, say some in the Senate. They demand that he be recalled to Rome before he forgets whom he serves."
      fnr_RMNRP.5.a: "Recall him to Rome."
      fnr_RMNRP.5.b: "Let him keep his legions."
      fnr_RMNRP.5.c: "Vote him a triumph."
      fnr_RMNRP_rubicon_risk_tt: "#R 30%#! chance that within 3 to 10 years he marches on Rome, #Y Crossing the Rubicon#!."
      fnr_RMNRP.6.title: "Lay Down the Fasces"
      fnr_RMNRP.6.desc: "The crisis that made our ruler dictator is over. By law and by custom, the dictator must now resign his powers and return to private life, as Cincinnatus returned to his plough. But the legions are loyal, and the Senate is weak."
      fnr_RMNRP.6.a: "Return to the plough."
      fnr_RMNRP.6.b: "Keep the fasces."
      fnr_RMNRP_refuse_resign_tt: "The #Y Republican Loyalists#!, led by a senator, rise in two provinces and start a civil war at once. This begins the #Y Roman Civil Wars#!. Win them and we may take the title of #Y Imperator#!."
      fnr_RMNRP.7.title: "Imperator"
      fnr_RMNRP.7.desc: "The civil war is won. The Senate still meets, but only to approve what has already been decided, and the legions hail their commander as Imperator. One more step, and the Republic will become an Empire. The only question is how openly to take it."
      fnr_RMNRP.7.a: "Imperator Caesar Augustus - proclaim the Empire."
      fnr_RMNRP.7.c: "Princeps - first among citizens."
      fnr_RMNRP.7.b: "Restore the Republic after all."
      fnr_RMNRP_augustus_tt: "We proclaim the #Y Roman Empire#! at once, without needing #Y Constantinople#!. The haste costs us dearly in stability."
      fnr_RMNRP_principate_tt: "We become the #Y Roman Principate#!, keeping the forms of the Republic while ruling alone. We can form the #Y Roman Empire#! once we hold #Y Rome#! and #Y 80%#! of #Y Italy#!, without needing #Y Constantinople#!, and gain #Y Pax Augusta#! when we do."
      fnr_RMNRP_pax_augusta_tt: "The Principate becomes the Empire. We gain #Y Pax Augusta#! for #Y 25#! years."
      fnr_RMNRP_PRINCIPATE_NAME: "Roman Principate"
      fnr_RMNRP_PRINCIPATE_NAME_ADJ: "Roman"
      fnr_RMNRP_restore_republic_tt: "The Republic survives. #Y Senate Authority#! is set to #Y 40#!."
      fnr_RMNRP.8.title: "Crossing the Rubicon"
      fnr_RMNRP.8.desc: "A general has led his legions across the little river that marks the edge of his province, and no general may cross it under arms. 'The die is cast.' The Republic is at war with itself."
      fnr_RMNRP.8.a: "Defend the Republic!"
      fnr_RMNRP_rubicon_tt: "The #Y Legions of the Rubicon#! rise in two provinces. If the ambitious general still lives, he leads them."
      fnr_RMNRP.9.title: "The Social War"
      fnr_RMNRP.9.desc: "The Italian allies have bled in our wars for generations without any share in the Republic they defend. Their envoys stand before the Senate and demand the citizenship. Refuse them, and Italy may never forgive us."
      fnr_RMNRP.9.a: "Grant them the citizenship."
      fnr_RMNRP.9.b: "Rome is for Romans."
      fnr_RMNRP.10.title: "Res Publica Aeterna"
      fnr_RMNRP.10.desc: "From the Alps to Sicily, Italy is united under the Senate and People of Rome. The Republic has outlasted kings, emperors and popes, and it will outlast them all."
      fnr_RMNRP.10.a: "Res Publica Aeterna!"

    # STATIC MODIFIERS

      STATIC_MODIFIER_NAME_fnr_RMNRP_senate_sovereign: "Sovereign Senate"
      STATIC_MODIFIER_DESC_fnr_RMNRP_senate_sovereign: "The conscript fathers govern with a firm hand.\n\n$fnr_RMNRP_senate_current$\n\n$fnr_RMNRP_senate_tiers$\n\n$fnr_RMNRP_senate_moves$"
      STATIC_MODIFIER_NAME_fnr_RMNRP_senate_balanced: "Balanced Senate"
      STATIC_MODIFIER_DESC_fnr_RMNRP_senate_balanced: "Senate and magistrates hold each other in check, as the ancestors intended.\n\n$fnr_RMNRP_senate_current$\n\n$fnr_RMNRP_senate_tiers$\n\n$fnr_RMNRP_senate_moves$"
      STATIC_MODIFIER_NAME_fnr_RMNRP_senate_weakened: "Weakened Senate"
      STATIC_MODIFIER_DESC_fnr_RMNRP_senate_weakened: "Ambitious men ignore the Senate's decrees.\n\n$fnr_RMNRP_senate_current$\n\n$fnr_RMNRP_senate_tiers$\n\n$fnr_RMNRP_senate_moves$"
      STATIC_MODIFIER_NAME_fnr_RMNRP_senate_disarray: "Senate in Disarray"
      STATIC_MODIFIER_DESC_fnr_RMNRP_senate_disarray: "The Republic is falling apart, and a general may soon cross the Rubicon.\n\n$fnr_RMNRP_senate_current$\n\n$fnr_RMNRP_senate_tiers$\n\n$fnr_RMNRP_senate_moves$"
      STATIC_MODIFIER_NAME_fnr_RMNRP_dictatorship: "Dictatorship"
      STATIC_MODIFIER_DESC_fnr_RMNRP_dictatorship: "One man holds absolute power for the duration of the crisis."
      STATIC_MODIFIER_NAME_fnr_RMNRP_civitas_romana: "Civitas Romana"
      STATIC_MODIFIER_DESC_fnr_RMNRP_civitas_romana: "The Roman citizenship has been extended to more of Italy."
      STATIC_MODIFIER_NAME_fnr_RMNRP_triumph: "Triumph"
      STATIC_MODIFIER_DESC_fnr_RMNRP_triumph: "Rome has celebrated a triumph, and every soldier dreams of the next."
      STATIC_MODIFIER_NAME_fnr_RMNRP_foedera_renewed: "Foedera Renewed"
      STATIC_MODIFIER_DESC_fnr_RMNRP_foedera_renewed: "The treaties between Rome and its allies have been sworn again."
      STATIC_MODIFIER_NAME_fnr_RMNRP_socii_levied: "Socii Levied"
      STATIC_MODIFIER_DESC_fnr_RMNRP_socii_levied: "The allies of Rome have sent their contingents to the war."
      STATIC_MODIFIER_NAME_fnr_RMNRP_senate_and_people: "The Senate and the People"
      STATIC_MODIFIER_DESC_fnr_RMNRP_senate_and_people: "The restored Republic belongs to the Senate and the People alike."
      STATIC_MODIFIER_NAME_fnr_RMNRP_optimates: "Optimate Ascendancy"
      STATIC_MODIFIER_DESC_fnr_RMNRP_optimates: "The great families and the Senate set the course of the Republic."
      STATIC_MODIFIER_NAME_fnr_RMNRP_populares: "Popular Ascendancy"
      STATIC_MODIFIER_DESC_fnr_RMNRP_populares: "The assemblies and the plebs set the course of the Republic."
      STATIC_MODIFIER_NAME_fnr_RMNRP_war_consul: "Consul for War"
      STATIC_MODIFIER_DESC_fnr_RMNRP_war_consul: "This consul was elected to lead the legions."
      STATIC_MODIFIER_NAME_fnr_RMNRP_lex_agraria: "Lex Agraria"
      STATIC_MODIFIER_DESC_fnr_RMNRP_lex_agraria: "The public land has been shared out among the poor, and the legions have farmers to recruit again."
      STATIC_MODIFIER_NAME_fnr_RMNRP_landless_plebs: "Landless Plebs"
      STATIC_MODIFIER_DESC_fnr_RMNRP_landless_plebs: "The great estates grow, and the small farmers who filled the legions drift into the city."
      STATIC_MODIFIER_NAME_fnr_RMNRP_general_recalled: "General Recalled"
      STATIC_MODIFIER_DESC_fnr_RMNRP_general_recalled: "A victorious general has been recalled to Rome, and his soldiers resent it."
      STATIC_MODIFIER_NAME_fnr_RMNRP_loyal_legions: "Loyal Legions"
      STATIC_MODIFIER_DESC_fnr_RMNRP_loyal_legions: "The legions are devoted to their general. Let us hope he stays devoted to Rome."
      STATIC_MODIFIER_NAME_fnr_RMNRP_cincinnatus: "Example of Cincinnatus"
      STATIC_MODIFIER_DESC_fnr_RMNRP_cincinnatus: "Our dictator laid down his power when the crisis passed, and the Republic honors him for it."
      STATIC_MODIFIER_NAME_fnr_RMNRP_perpetual_dictator: "Perpetual Dictator"
      STATIC_MODIFIER_DESC_fnr_RMNRP_perpetual_dictator: "Our ruler has refused to lay down the fasces."
      STATIC_MODIFIER_NAME_fnr_RMNRP_imperator: "Imperator"
      STATIC_MODIFIER_DESC_fnr_RMNRP_imperator: "The legions have hailed their commander as Imperator, and the Republic is no more."
      STATIC_MODIFIER_NAME_fnr_RMNRP_res_publica_aeterna: "Res Publica Aeterna"
      STATIC_MODIFIER_DESC_fnr_RMNRP_res_publica_aeterna: "The eternal Republic rules a united Italy."

    # HINTS

      hint_fnr_RMNRP_senate: "Senate Authority"
      hint_fnr_RMNRP_senate_hint_text: "$hint_fnr_RMNRP_senate_text_1$\n\n$fnr_RMNRP_senate_current$\n\n$fnr_RMNRP_senate_tiers$\n\n$fnr_RMNRP_senate_moves$\n\n$hint_fnr_RMNRP_senate_text_2$"
      hint_fnr_RMNRP_senate_text_1: "The Roman Republic is governed by the Senate and People of Rome. #Y Senate Authority#! measures how much power the Senate holds, from 0 to 100. It always appears among our country modifiers as the #Y Sovereign#!, #Y Balanced#!, #Y Weakened#! or #Y In Disarray#! Senate, and hovering it shows the current value."
      hint_fnr_RMNRP_senate_text_2: "@hint! #T The road to Empire#!\nIn wartime we may #Y Appoint a Dictator#!. When the crisis passes he must lay down the fasces - doing so strengthens the Senate, refusing starts a civil war that can end with the Republic becoming an Empire.\n\n@hint! #T Res Publica Aeterna#!\nThe capstone advance needs Senate Authority of at least #Y 60#!."
      hint_fnr_RMNRP_senate_diplomatic: "$hint_advisor_salute_diplomatic$"
      hint_fnr_RMNRP_senate_administrative: "$hint_advisor_salute_administrative$"
      hint_fnr_RMNRP_senate_military: "$hint_advisor_salute_military$"

    # ROMAN SLAVERY

      fnr_RMNRP_servile_current: "#Y Servile Discontent#! is currently #Y [GetPlayer.MakeScope.GetVariable('fnr_RMNRP_servile_discontent').GetValue|0]#! / 100"
      fnr_RMNRP_servile_tiers: "#T Tiers#!\n- #Y Quiet Familia#! below 30\n- #Y Restless Familia#! from 30 to 59\n- #Y Seething Familia#! from 60 to 79, and the slaves begin to plot\n- #Y Familia on the Brink#! at 80 and above, when a new Spartacus may rise"
      fnr_RMNRP_servile_moves: "#T What moves it#!\n- #R Raised by#! the Latifundia (#R +4#! a year), Regulated Slavery (#R +1#!), every war year (#R +1#!), every Ludus (#R +1#!) and Gladiatorial Games\n- #G Lowered by#! Manumission (#G -3#! a year), Manumit the Deserving and Crack Down on the Familia"
      fnr_RMNRP_servile_minus_10_tt: "#Y Servile Discontent#! #G -10#!"
      fnr_RMNRP_servile_minus_15_tt: "#Y Servile Discontent#! #G -15#!"
      fnr_RMNRP_servile_minus_40_tt: "#Y Servile Discontent#! #G -40#!"
      fnr_RMNRP_servile_plus_5_tt: "#Y Servile Discontent#! #R +5#!"
      fnr_RMNRP_servile_set_10_tt: "#Y Servile Discontent#! falls to #G 10#!."
      fnr_RMNRP_servile_set_20_tt: "#Y Servile Discontent#! falls to #G 20#!."
      fnr_RMNRP_servile_war_tt: "The slaves of up to two provinces rise under the new Spartacus. The legions must put them down. In #Y 3#! to #Y 5#! years the war is decided."
      fnr_name_spartacus: "Spartacus"

      fnr_RMNRP_roman_slavery_law: "Roman Slavery"
      fnr_RMNRP_roman_slavery_law_desc: "The fields of Italy are worked by slaves taken in our wars. How the Republic treats them decides whether they stay in their chains.\n\n$fnr_RMNRP_servile_current$"
      fnr_RMNRP_latifundia_policy: "The Latifundia"
      fnr_RMNRP_latifundia_policy_desc: "Great estates worked by gangs of slaves feed Rome and enrich the Senate. #R Servile Discontent +4 a year.#!"
      fnr_RMNRP_regulated_slavery_policy: "Regulated Slavery"
      fnr_RMNRP_regulated_slavery_policy_desc: "Masters answer to the praetor for how they treat their slaves. #Y Servile Discontent +1 a year.#!"
      fnr_RMNRP_manumission_policy: "Manumission"
      fnr_RMNRP_manumission_policy_desc: "A slave who serves well may be freed, and the freedman's son may be a citizen. #G Servile Discontent -3 a year.#!"

      fnr_RMNRP_ludus: "Ludus"
      fnr_RMNRP_ludus_desc: "A gladiator school, where slaves are trained to kill and die for the crowd. The games calm the city, but every ludus adds #R 1#! Servile Discontent a year. Unlocks #Y Gladiatorial Games#!."
      fnr_RMNRP_ludus_maintenance: "Ludus Upkeep"

      fnr_RMNRP_manumit_the_deserving.title: "Manumit the Deserving"
      fnr_RMNRP_manumit_the_deserving.desc: "The state buys the freedom of slaves who have served long and well, and the familia sees that the door is not always shut.\n\n$fnr_RMNRP_servile_current$"
      fnr_RMNRP_manumit_the_deserving.a: "Let them go free."
      fnr_RMNRP_crack_down_on_the_familia.title: "Crack Down on the Familia"
      fnr_RMNRP_crack_down_on_the_familia.desc: "Search the slave quarters, break up the burial clubs and whip the loudest. Fear is a chain too.\n\n$fnr_RMNRP_servile_current$"
      fnr_RMNRP_crack_down_on_the_familia.a: "Remind them of their place."
      fnr_RMNRP_gladiatorial_games.title: "Gladiatorial Games"
      fnr_RMNRP_gladiatorial_games.desc: "The gladiators of our schools fight before the people. The crowd roars for the Republic, and the fighters remember every blow.\n\n$fnr_RMNRP_servile_current$"
      fnr_RMNRP_gladiatorial_games.a: "Let the games begin."

      fnr_RMNRP_servile_rebels: "Servile Army"
      fnr_RMNRP_servile_rebels_country: "$fnr_RMNRP_servile_rebels$"
      fnr_RMNRP_servile_rebels_country_adjective: "$fnr_RMNRP_servile_rebels$"

      fnr_RMNRP.11.title: "Murmurs in the Ludus"
      fnr_RMNRP.11.desc: "Overseers report whispers in the slave quarters and the gladiator schools. Tools go missing; men fall silent when a master passes. Somewhere, somebody is reading to them from the old histories."
      fnr_RMNRP.11.a: "Make an example of the ringleaders."
      fnr_RMNRP.11.b: "Ease the yoke a little."
      fnr_RMNRP.11.c: "Slaves always grumble."
      fnr_RMNRP.12.title: "The New Spartacus"
      fnr_RMNRP.12.desc: "A gladiator of the ludus, a slave who learned his letters copying his master's books, has read the story of Spartacus, who shook the old Republic with an army of slaves. Last night he and his fellows broke out of the school with kitchen knives and spits. He has taken the name Spartacus, and the slaves of the countryside are flocking to him."
      fnr_RMNRP.12.a: "Send the legions."
      fnr_RMNRP.12.b: "Buy their freedom before blood is spilled."
      fnr_RMNRP.13.title: "The End of the Servile War"
      fnr_RMNRP.13.desc: "The Servile War is over. Whatever became of the man who called himself Spartacus, the Senate must now decide what message Rome sends to every slave in Italy."
      fnr_RMNRP.13.a: "Crucify them along the Via Appia."
      fnr_RMNRP.13.b: "Learn the lesson of Spartacus."
      fnr_RMNRP.14.title: "Freedmen Prosper"
      fnr_RMNRP.14.desc: "The freedmen of our cities have done well for themselves. Some own workshops, some own ships, and a few now own slaves of their own. They ask what place the Republic has for them."
      fnr_RMNRP.14.a: "Enrol them as citizens."
      fnr_RMNRP.14.b: "Let them remain clients of their old masters."

      STATIC_MODIFIER_NAME_fnr_RMNRP_servile_calm: "Quiet Familia"
      STATIC_MODIFIER_DESC_fnr_RMNRP_servile_calm: "Our slaves are quiet, for now.\n\n$fnr_RMNRP_servile_current$\n\n$fnr_RMNRP_servile_tiers$\n\n$fnr_RMNRP_servile_moves$"
      STATIC_MODIFIER_NAME_fnr_RMNRP_servile_restless: "Restless Familia"
      STATIC_MODIFIER_DESC_fnr_RMNRP_servile_restless: "There is resentment in the slave quarters.\n\n$fnr_RMNRP_servile_current$\n\n$fnr_RMNRP_servile_tiers$\n\n$fnr_RMNRP_servile_moves$"
      STATIC_MODIFIER_NAME_fnr_RMNRP_servile_seething: "Seething Familia"
      STATIC_MODIFIER_DESC_fnr_RMNRP_servile_seething: "The slaves are plotting, and the masters know it.\n\n$fnr_RMNRP_servile_current$\n\n$fnr_RMNRP_servile_tiers$\n\n$fnr_RMNRP_servile_moves$"
      STATIC_MODIFIER_NAME_fnr_RMNRP_servile_brink: "Familia on the Brink"
      STATIC_MODIFIER_DESC_fnr_RMNRP_servile_brink: "One spark and the slaves of Italy will rise.\n\n$fnr_RMNRP_servile_current$\n\n$fnr_RMNRP_servile_tiers$\n\n$fnr_RMNRP_servile_moves$"
      STATIC_MODIFIER_NAME_fnr_RMNRP_familia_crackdown: "Crackdown on the Familia"
      STATIC_MODIFIER_DESC_fnr_RMNRP_familia_crackdown: "The slave quarters are searched and the ringleaders punished."
      STATIC_MODIFIER_NAME_fnr_RMNRP_gladiatorial_games: "Gladiatorial Games"
      STATIC_MODIFIER_DESC_fnr_RMNRP_gladiatorial_games: "The people still talk of the last games."
      STATIC_MODIFIER_NAME_fnr_RMNRP_via_appia: "Crosses on the Via Appia"
      STATIC_MODIFIER_DESC_fnr_RMNRP_via_appia: "The rebels hang along the road to Rome, and every slave has seen them."
      STATIC_MODIFIER_NAME_fnr_RMNRP_lessons_of_spartacus: "The Lesson of Spartacus"
      STATIC_MODIFIER_DESC_fnr_RMNRP_lessons_of_spartacus: "Rome has learned that chains alone do not keep the peace."
      STATIC_MODIFIER_NAME_fnr_RMNRP_freedmen_citizens: "Freedmen Citizens"
      STATIC_MODIFIER_DESC_fnr_RMNRP_freedmen_citizens: "Freedmen and their sons stand in the assemblies as citizens."
      STATIC_MODIFIER_NAME_fnr_RMNRP_freedmen_clients: "Freedmen Clients"
      STATIC_MODIFIER_DESC_fnr_RMNRP_freedmen_clients: "The freedmen still owe their old masters service and votes."

      hint_fnr_RMNRP_servile: "Roman Slavery"
      hint_fnr_RMNRP_servile_hint_text: "$hint_fnr_RMNRP_servile_text_1$\n\n$fnr_RMNRP_servile_current$\n\n$fnr_RMNRP_servile_tiers$\n\n$fnr_RMNRP_servile_moves$\n\n$hint_fnr_RMNRP_servile_text_2$"
      hint_fnr_RMNRP_servile_text_1: "Under the #Y Roman Slavery#! law, #Y Servile Discontent#! measures how close our slaves are to revolt, from 0 to 100. It always appears among our country modifiers as the #Y Quiet#!, #Y Restless#!, #Y Seething#! or #Y On the Brink#! Familia."
      hint_fnr_RMNRP_servile_text_2: "@hint! #T The Servile War#!\nAt 80 or more, a slave who knows the story of Spartacus may take his name and raise an army. Crush it and decide whether to make an example of the rebels or reform the law. Choosing #Y Manumission#! keeps the familia quiet at the cost of the nobles' favour."
      hint_fnr_RMNRP_servile_diplomatic: "$hint_advisor_salute_diplomatic$"
      hint_fnr_RMNRP_servile_administrative: "$hint_advisor_salute_administrative$"
      hint_fnr_RMNRP_servile_military: "$hint_advisor_salute_military$"

    # ROMANIZATION

      fnr_RMNRP_restore_romanitas.title: "Restore Romanitas"
      fnr_RMNRP_restore_romanitas.desc: "To be Roman was never a matter of birth alone. It was a language, a law and a way of life, and any people could learn it. The Senate resolves that the Republic will teach it again, beginning in Rome itself.\n\nWe may make #Y Roman#! our primary culture now (our old culture stays accepted, but stability suffers), or accept it alongside our own and #Y Become Roman#! later."
      fnr_RMNRP_restore_romanitas.a: "Romani sumus - we are Romans."
      fnr_RMNRP_restore_romanitas.b: "Rome will be one of our peoples."
      fnr_RMNRP_romanitas_unlock_tt: "A quarter of the people of #Y Rome#! take up Roman culture. Unlocks the #Y Romanization#! cabinet action. Each year it also turns #Y 8%#! of the non-Roman people of every province being Romanized into Romans."
      fnr_RMNRP_become_roman.title: "Become Roman"
      fnr_RMNRP_become_roman.desc: "We have lived beside the Romans long enough. Let our ruling class take up the Latin tongue and Roman ways, and let Roman be the culture of the Republic. Our old culture remains accepted."
      fnr_RMNRP_become_roman.a: "Romani sumus."

      fnr_RMNRP_romanization: "Romanization"
      fnr_RMNRP_romanization_desc: "Latin schools, Roman law and Roman colonists turn the people of a province into Romans. Faster than ordinary assimilation."
      fnr_RMNRP_romanization_select_province: "Select the [province|e] to Romanize:"
      fnr_RMNRP_romanization_action: "Romanize [SCOPE.sProvince('target_1').GetNameWithNoTooltip]"
      fnr_RMNRP_romanization_active: "Romanizing [SCOPE.sProvince('target_1').GetNameWithHighlightOnly]"
      fnr_RMNRP_romanization_action_progress: "[SCOPE.sProvince('target_1').GetCulturePercentage(SCOPE.sCulture('target'))|V2%]"
      fnr_RMNRP_romanization_action_progress_wordier: "Roman culture in [SCOPE.sProvince('target_1').GetNameWithNoTooltip] is at [SCOPE.sProvince('target_1').GetCulturePercentage(SCOPE.sCulture('target'))|V2%]"
      fnr_RMNRP_romanization_action_progress_long_wordier: "@culture! [SCOPE.sProvince('target_1').GetCulturePercentage(SCOPE.sCulture('target'))|V2%] \n\n@pop_assimilation_speed! [SCOPE.sProvince('target_1').GetProvinceLocationModifier('local_pop_assimilation_speed')|+=2]"
      fnr_RMNRP_romanization_action_progress_tooltip: "Romanizing @province! [SCOPE.sProvince('target_1').GetName]\n[SCOPE.sProvince('target_1').GetCulturalInfo]\n\n#T Completed When#!\n[SCOPE.sCabinet('cabinet').GetActionEndConditions]"

    # DISASTER - The Roman Civil Wars

      fnr_RMNRP_roman_civil_wars: "The Roman Civil Wars"
      fnr_RMNRP_roman_civil_wars_desc: "Roman legions march against Roman legions. The Senate is divided, the treasury is plundered by whichever side holds the city, and every general wonders whether he too might rule. The Republic will not come out of this unchanged. If the dictator wins, nothing will stand between him and the purple."
      fnr_RMNRP_dictator_for_life_tt: "In #Y 1#! year, the legions will offer us the title of #Y Imperator#!."

      fnr_RMNRP.15.title: "The Roman Civil Wars"
      fnr_RMNRP.15.desc: "As in the days of Marius and Sulla, of Caesar and Pompey, Roman blood is spilled by Roman swords. Both sides claim to defend the Republic. How we wage this war will be remembered long after it is won."
      fnr_RMNRP.15.a: "Post the proscription lists."
      fnr_RMNRP.15.b: "Clementia - pardon all who lay down their arms."
      fnr_RMNRP.16.title: "Proscription Lists"
      fnr_RMNRP.16.desc: "New names appear on the lists in the Forum each morning. Some are enemies of the state, some are merely rich. Informers grow wealthy on the rewards, and the estates of the condemned are for sale."
      fnr_RMNRP.16.a: "Seize their estates for the war chest."
      fnr_RMNRP.16.b: "Burn the lists."
      fnr_RMNRP.17.title: "The Legions Choose Sides"
      fnr_RMNRP.17.desc: "The legions have sworn oaths to the Republic, but it is their general who feeds them, pays them and promises them land. Their centurions ask, politely, what we intend to give them."
      fnr_RMNRP.17.a: "Pay the donative."
      fnr_RMNRP.17.b: "Remind them of their oath."
      fnr_RMNRP.18.title: "March on Rome"
      fnr_RMNRP.18.desc: "The enemy's columns are reported on the Via Flaminia, a few days from the city. The senators are packing their silver. Rome has no walls worthy of the name, only the ones we choose to man."
      fnr_RMNRP.18.a: "Garrison the city."
      fnr_RMNRP.18.b: "Let the Senate flee."
      fnr_RMNRP.19.title: "After the Rubicon"
      fnr_RMNRP.19.desc: "The civil war is over and the legions stand in the Campus Martius awaiting orders. The Senate asks that the Republic be restored as it was. The soldiers would prefer a master who pays them."
      fnr_RMNRP.19.a: "Restore the Republic."
      fnr_RMNRP.19.b: "Dictator for life."

      STATIC_MODIFIER_NAME_fnr_RMNRP_proscriptions: "Proscriptions"
      STATIC_MODIFIER_DESC_fnr_RMNRP_proscriptions: "The property of the proscribed fills the treasury, and nobody feels safe."
      STATIC_MODIFIER_NAME_fnr_RMNRP_clementia: "Clementia"
      STATIC_MODIFIER_DESC_fnr_RMNRP_clementia: "Our enemies know that surrender means pardon."
      STATIC_MODIFIER_NAME_fnr_RMNRP_donative_paid: "Donative Paid"
      STATIC_MODIFIER_DESC_fnr_RMNRP_donative_paid: "The legions have been paid, and they remember who paid them."
      STATIC_MODIFIER_NAME_fnr_RMNRP_rome_garrisoned: "Rome Garrisoned"
      STATIC_MODIFIER_DESC_fnr_RMNRP_rome_garrisoned: "Soldiers stand guard on the gates and bridges of the city."
      fnr_RMNRP_civil_war_rebels_gone_tt: "No #Y Republican Loyalists#! or #Y Legions of the Rubicon#! are still gathering in our lands"

    # DISASTER PANEL

      fnr_RMNRP_panel_senate_title: "Senate Authority"
      fnr_RMNRP_panel_senate_desc: "Below 20, a general may march"
      fnr_RMNRP_panel_of_100: "/ 100"
      fnr_RMNRP_panel_war_title: "The Civil War"
      fnr_RMNRP_panel_war_desc: "Win the war. Lasts 12+ months"
      fnr_RMNRP_panel_months: "months"
      fnr_RMNRP_panel_months_value: "[GetPlayer.MakeScope.GetVariable('fnr_RMNRP_civil_war_months').GetValue|0] months"
      fnr_RMNRP_romanization_finished_tt: "The province is entirely #Y Roman#! (95% where tribesmen still live)"
      STATIC_MODIFIER_NAME_fnr_RMNRP_principate: "The Principate"
      STATIC_MODIFIER_DESC_fnr_RMNRP_principate: "The Princeps rules as first among citizens, and the Republic is a mask the Empire wears."
      STATIC_MODIFIER_NAME_fnr_RMNRP_pax_augusta: "Pax Augusta"
      STATIC_MODIFIER_DESC_fnr_RMNRP_pax_augusta: "Peace and order under the first Emperor."

    # BYZANTIUM - ONE ROME

      fnr_RMNRP_concordia_current: "#Y Concordia#! with Byzantium is currently #Y [GetPlayer.MakeScope.GetVariable('fnr_RMNRP_concordia').GetValue|0]#! / 100"
      fnr_RMNRP_concordia_explained: "#T Concordia#! measures how close Rome and Byzantium have grown, from 0 to 100.\n- #G Raised by#! the #Y Embassy of Romanitas#! (#G +10#!, #G +15#! if Byzantium is in the Socii) and by Byzantium's membership of the #Y Socii#! (#G +5#! a year)\n- At #Y 30#! Byzantium may join the Socii, and an Empire on the imperial path may seek a purple-born bride\n- At #Y 50#! we may propose the #Y Reunion of the Romans#!\n- At #Y 100#!, with Byzantium in the Socii, Constantinople may offer #Y One Rome#! of its own accord"

      fnr_RMNRP_embassy_of_romanitas: "Embassy of Romanitas"
      dip_fnr_RMNRP_embassy_of_romanitas_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
      fnr_RMNRP_embassy_of_romanitas_act: "Send an embassy of Romanitas to [SCOPE.sCountry('recipient').GetName]."
      fnr_RMNRP_embassy_of_romanitas_desc: "Senators, scholars and churchmen sail to Constantinople to remind the Eastern Romans that West and East were once one Empire.\n\n$fnr_RMNRP_concordia_current$\n\n$fnr_RMNRP_concordia_explained$"
      fnr_RMNRP_embassy_of_romanitas_effect_text: "[SCOPE.sCountry('actor').GetName] sends an embassy of Romanitas to [SCOPE.sCountry('recipient').GetName]."
      fnr_RMNRP_embassy_of_romanitas_effect_text_past: "[SCOPE.sCountry('actor').GetName] sent an embassy of Romanitas to [SCOPE.sCountry('recipient').GetName]."
      PROPOSE_fnr_RMNRP_embassy_of_romanitas: "Send an embassy of Romanitas to $RECIPIENT$?\n$INFO$."
      fnr_RMNRP_concordia_embassy_tt: "#Y Concordia#! with Byzantium #G +10#! (#G +15#! if Byzantium is in the Socii)"

      fnr_RMNRP_propose_reunion: "Propose the Reunion of the Romans"
      dip_fnr_RMNRP_propose_reunion_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
      fnr_RMNRP_propose_reunion_act: "Propose that [SCOPE.sCountry('recipient').GetName] rejoin the Roman state."
      fnr_RMNRP_propose_reunion_desc: "Invite the Eastern Romans to rejoin the Roman state. A small Byzantium is annexed outright; a large one becomes our vassal. They are far more willing when the Turks out-muster them, when our legions out-muster the Turks, and while the Ottomans are rising. If they refuse, we gain the #Y Restore the East#! casus belli.\n\n$fnr_RMNRP_concordia_current$"
      fnr_RMNRP_propose_reunion_effect_text: "[SCOPE.sCountry('recipient').GetName] rejoins the Roman state under [SCOPE.sCountry('actor').GetName]."
      fnr_RMNRP_propose_reunion_effect_text_past: "[SCOPE.sCountry('recipient').GetName] rejoined the Roman state under [SCOPE.sCountry('actor').GetName]."
      fnr_RMNRP_propose_reunion_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] refuses to rejoin the Roman state."
      fnr_RMNRP_propose_reunion_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] refused to rejoin the Roman state."
      PROPOSE_fnr_RMNRP_propose_reunion: "Propose the Reunion of the Romans to $RECIPIENT$?\n$INFO$."
      INCOMING_OFFER_fnr_RMNRP_propose_reunion: "$ACTOR$ invite us to rejoin the Roman state. A small realm would be annexed, a large one would become their vassal. Do we accept?\n\n$INFO$"
      INCOMING_OFFER_TITLE_fnr_RMNRP_propose_reunion: "$fnr_RMNRP_propose_reunion$"
      fnr_RMNRP_concordia_50_tt: "#Y Concordia#! with Byzantium is at least #Y 50#!"
      fnr_RMNRP_concordia_30_tt: "#Y Concordia#! with Byzantium is at least #Y 30#!"
      fnr_RMNRP_reunion_stronger_army_tt: "Our army is larger than theirs"
      fnr_RMNRP_reunion_richer_tt: "Our monthly income is larger than theirs"
      fnr_RMNRP_reunion_reason_concordia: "Concordia with Rome"
      fnr_RMNRP_reunion_reason_turks: "The Turks out-muster Byzantium"
      fnr_RMNRP_reunion_reason_turk_war: "At war with the Ottomans"
      fnr_RMNRP_reunion_reason_rome_protects: "Rome out-musters the Ottomans"
      fnr_RMNRP_reunion_reason_rising: "The Ottomans are rising"
      fnr_RMNRP_reunion_reason_faith: "Different faith"
      fnr_RMNRP_reunion_effect_tt: "Byzantium is #Y annexed#! if it holds fewer than #Y 40#! locations, otherwise it becomes our #Y vassal#!."
      fnr_RMNRP_reunion_refused_tt: "Unlocks the #Y Restore the East#! casus belli. #Y Concordia#! #R -20#!."
      fnr_RMNRP_restore_east_tt: "We may now press the #Y Restore the East#! casus belli against anyone holding land in the Balkans or Anatolia."
      fnr_RMNRP_concordia_plus_10_tt: "#Y Concordia#! with Byzantium #G +10#!"

      fnr_RMNRP_cb_restore_the_east: "Restore the East"
      fnr_RMNRP_cb_restore_the_east_desc: "Thrace, Greece and Anatolia were Roman for a thousand years. Rome will have them back."
      war_goal_fnr_RMNRP_restore_the_east_wargoal: "Restore the East"
      war_goal_fnr_RMNRP_restore_the_east_wargoal_desc: "Return the Balkans and Anatolia to Rome."

      fnr_RMNRP_wed_the_porphyrogenita.title: "Wed the Porphyrogenita"
      fnr_RMNRP_wed_the_porphyrogenita.desc: "A princess born in the purple chamber of Constantinople, married to the Emperor of the West, would give our heirs a claim to the throne of the Eastern Romans.\n\n$fnr_RMNRP_concordia_current$"
      fnr_RMNRP_wed_the_porphyrogenita.a: "Send the matchmakers to Constantinople."
      fnr_RMNRP_marriage_offer_tt: "Byzantium will decide whether to accept the marriage. Can be tried again in #Y 10#! years."
      fnr_RMNRP_marriage_accept_tt: "Rome gains a claim to the Byzantine throne. One day, Byzantium may pass to Rome by inheritance."
      fnr_RMNRP_purple_claim_tt: "We hold a claim to the Byzantine throne. Each year there is a small chance it passes to us."
      fnr_RMNRP_purple_inheritance_tt: "Byzantium passes to us. It is #Y annexed#! if it holds fewer than #Y 40#! locations, otherwise it becomes our #Y vassal#!."
      fnr_RMNRP_one_rome_accept_tt: "We rejoin the Roman state. A small Byzantium is #Y annexed#!, a large one becomes Rome's #Y vassal#!."
      fnr_RMNRP_one_rome_refuse_tt: "Rome's #Y Concordia#! with us falls by #R 30#!."

      fnr_RMNRP_byz.1.title: "The Romans Reunited"
      fnr_RMNRP_byz.1.desc: "For the first time since the days of Theodosius, the Romans of East and West answer to one power. The bells of Rome and Constantinople ring together."
      fnr_RMNRP_byz.1.a: "Unum imperium, unus populus."
      fnr_RMNRP_byz.2.title: "Constantinople Refuses"
      fnr_RMNRP_byz.2.desc: "The Basileus has received our envoys with every courtesy, and sent them home with nothing. The Romans of the East, he says, need no lessons in being Roman from the Latins."
      fnr_RMNRP_byz.2.a: "Then the legions will decide."
      fnr_RMNRP_byz.2.b: "Patience. Rome was not built in a day."
      fnr_RMNRP_byz.3.title: "One Rome"
      fnr_RMNRP_byz.3.desc: "Our soldiers have fought beside the legions of the West for years, and our court speaks of little else but the old unity of the Empire. Some say the time has come to end the division of Theodosius and rejoin the Roman state of the West."
      fnr_RMNRP_byz.3.a: "One Rome, one people."
      fnr_RMNRP_byz.3.b: "Constantinople bows to no one."
      fnr_RMNRP_byz.4.title: "One Rome"
      fnr_RMNRP_byz.4.desc: "Constantinople has chosen to rejoin us of its own free will. The division of the Empire is over."
      fnr_RMNRP_byz.4.a: "Welcome home."
      fnr_RMNRP_byz.5.title: "The Porphyrogenita"
      fnr_RMNRP_byz.5.desc: "The new Emperor of the West asks for the hand of a princess born in the purple. The marriage would bring a rich dowry of goodwill and the promise of Western legions, but also a Western claim to our throne."
      fnr_RMNRP_byz.5.a: "A purple-born bride for the Emperor of the West."
      fnr_RMNRP_byz.5.b: "A porphyrogenita does not marry a usurper."
      fnr_RMNRP_byz.6.title: "A Purple Marriage"
      fnr_RMNRP_byz.6.desc: "Constantinople has accepted. A princess born in the purple chamber now sits beside our Emperor, and our heirs carry the blood of the Eastern emperors."
      fnr_RMNRP_byz.6.a: "The East is in our blood."
      fnr_RMNRP_byz.7.title: "The Purple Inheritance"
      fnr_RMNRP_byz.7.desc: "The Basileus has died without a direct heir, and by the marriage of the purple-born princess the throne of the Eastern Romans passes to our house."
      fnr_RMNRP_byz.7.a: "Two thrones, one Rome."

      hint_fnr_RMNRP_byzantium: "One Rome"
      hint_fnr_RMNRP_byzantium_hint_text: "Rome and Constantinople were once one Empire. There are four roads to make them one again.\n\n$fnr_RMNRP_concordia_current$\n\n$fnr_RMNRP_concordia_explained$\n\n@hint! #T Diplomacy#!\nUse the #Y Embassy of Romanitas#! diplomatic action to build Concordia, then #Y Propose the Reunion of the Romans#!. Byzantium is most willing when the Turks are stronger than it is and our legions are stronger than the Turks.\n\n@hint! #T The Socii#!\nAt 30 Concordia Byzantium may join the Socii. With Byzantium inside, Concordia grows every year, and at 100 Constantinople may offer #Y One Rome#! itself.\n\n@hint! #T The purple#!\nAn Empire on the imperial path may #Y Wed the Porphyrogenita#! for a claim to the Byzantine throne.\n\n@hint! #T The sword#!\nIf Byzantium refuses the Reunion, or once we take the imperial path, the #Y Restore the East#! casus belli opens the Balkans and Anatolia."
      hint_fnr_RMNRP_byzantium_diplomatic: "$hint_advisor_salute_diplomatic$"
      hint_fnr_RMNRP_byzantium_administrative: "$hint_advisor_salute_administrative$"
      hint_fnr_RMNRP_byzantium_military: "$hint_advisor_salute_military$"

    # SOCII ACTIONS

      fnr_RMNRP_socii_renew_foedera: "Renew the Foedera"
      fnr_RMNRP_socii_renew_foedera_desc: "Swear the treaties with our allies again, with sacrifice and gifts. Every member gains #Y Foedera Renewed#! for 5 years. Peace only, every 5 years, 100 gold."
      fnr_RMNRP_socii_levy: "Levy the Socii"
      fnr_RMNRP_socii_levy_desc: "Call up the allied contingents. Every member gains #Y Socii Levied#! for 2 years. War only, every 10 years."
      fnr_RMNRP_socii_promote_latin: "Promote Latin"
      fnr_RMNRP_socii_promote_latin_desc: "Send Latin teachers, lawyers and colonists to one of our allies. 50 gold, once every 5 years per member."
      fnr_RMNRP_promote_latin_tt: "#Y 3%#! of this member's non-Latin people take up #Y Latin#! culture."
      fnr_RMNRP_socii_grant_ius_latii: "Grant the Ius Latii"
      fnr_RMNRP_socii_grant_ius_latii_desc: "Give one ally the Latin Rights, a half-step to Roman citizenship. They gain the permanent #Y Ius Latii#! and think much better of Rome. 100 gold, once per member."
      fnr_RMNRP_socii_incorporate: "Incorporate into Rome"
      fnr_RMNRP_socii_incorporate_desc: "An ally that has come to love Rome may be made part of it. The member must hold fewer than #Y 30#! locations and have an opinion of at least #Y 150#! of us. It is annexed peacefully. Once every 20 years."
      fnr_RMNRP_socii_byz_low_concordia: "Concordia with Rome is below 30"
      STATIC_MODIFIER_NAME_fnr_RMNRP_ius_latii: "Ius Latii"
      STATIC_MODIFIER_DESC_fnr_RMNRP_ius_latii: "Rome has granted us the Latin Rights."

    # EARLY FORMATION

      fnr_RMNRP.20.title: "The Tribune of the Roman People"
      fnr_RMNRP.20.desc: "A notary's son with a gift for oratory has stood on the Capitol in the armour of the old Romans and proclaimed himself Tribune of the Roman People. He reads the ancient inscriptions aloud to the crowds, calls the barons tyrants, and promises that Rome will be a Republic again, today, not when the rest of Italy is ours. The people are with him, for now."
      fnr_RMNRP.20.a: "Restore the Republic now."
      fnr_RMNRP.20.b: "The time is not yet right."
      fnr_RMNRP_early_formation_tt: "We form the #Y Roman Republic#! at once, without holding the rest of Italy. The restored Republic starts out fragile."
      STATIC_MODIFIER_NAME_fnr_RMNRP_fragile_republic: "A Fragile Republic"
      STATIC_MODIFIER_DESC_fnr_RMNRP_fragile_republic: "The Republic was restored before Italy was won. Its people are fervent, but its institutions are young."

  # The Great Republic
      fnr_RMNRP_proclaim_great_republic.title: "Proclaim the Great Republic"
      fnr_RMNRP_proclaim_great_republic.desc: "Italy is ours and the Senate is strong. Some say the Republic needs an emperor to rule what it has won. Others say it needs only a better Senate, a smaller one, of the generals who won the wars and the scholars who can govern the peace. Let the Republic take the name of Rome, and stay a Republic.\n\n$fnr_RMNRP_senate_current$"
      fnr_RMNRP_proclaim_great_republic.a: "The Republic is Rome."
      fnr_RMNRP_great_republic_tt: "We form the #Y Roman Empire#! but remain a #Y Republic#!, and choose our own name. We gain #Y The Senate of Generals and Scholars#! reform, keep #Y Senate Authority#! and all Roman Republic content, and take on the Empire's #Y Imperial Dioceses#! and #Y Legion Loyalty#!. A dictator who refuses to lay down the fasces can still make himself #Y Princeps#!."
