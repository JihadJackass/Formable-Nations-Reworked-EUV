l_english:

  ###########################################################
  # Pax Romana - Eastern Roman Empire (EASRE)               #
  ###########################################################

    # ADVANCES

      EASRE_thematic_reorganization: "Thematic Reorganization"
      EASRE_thematic_reorganization_desc: "The old provincial system has rotted from within - governors grown fat on corruption, garrisons scattered and leaderless. The Basileus divides the empire into themes, each a self-sustaining military district under a strategos who answers to Constantinople alone. Land is granted to soldier-farmers who will defend what they till. The empire transforms from a bloated bureaucracy into a lean instrument of war."

      EASRE_greek_fire: "Greek Fire"
      EASRE_greek_fire_desc: "The alchemists of Constantinople have perfected a weapon that burns even on water. The formula is the empire's most closely guarded secret, and those who know it are forbidden to leave the capital on pain of death. When the first enemy fleet meets the bronze siphons of a Roman dromon, the sea itself seems to catch fire.\n\nEnemy fleets suffer attrition in our home waters along the Aegean, Thracian and Black Sea coasts."

      EASRE_autocrator_court: "Autocrator's Court"
      EASRE_autocrator_court_desc: "The court of Constantinople is the most sophisticated in the world, a labyrinth of ceremony, intrigue and calculated magnificence. Foreign ambassadors are dazzled by mechanical golden lions that roar and a throne that rises toward the ceiling. Behind the spectacle lies a ruthlessly efficient diplomatic machine.\n\nOur heavy cavalry gains #G +5%#! power for every [ShowBuildingTypeName('thema_headquarters')] we own, up to #G +30%#!."

      EASRE_reconquest: "Reconquista Orientalis"
      EASRE_reconquest_desc: "The theme armies are ready. The treasury is full. The generals have drawn their plans against the map of the old empire, tracing the borders that Justinian once held - Anatolia, the Levant, the ancient heartlands of Roman civilization now under foreign rule. The Basileus gives the order, and the cataphracts ride east."

      EASRE_symphonia: "Symphonia of Powers"
      EASRE_symphonia_desc: "The Emperor and the Patriarch stand side by side in the Hagia Sophia, two pillars of one edifice. The Symphonia, the harmony of sacred and secular authority, becomes the foundational doctrine of the state. The Patriarch legitimizes the Emperor's rule as divinely ordained, and the Emperor protects the Orthodox faith as its earthly champion."

      EASRE_academy: "The Second Academy"
      EASRE_academy_desc: "In a marble hall overlooking the Golden Horn, scholars debate philosophy in the language of Plato. The Academy of Constantinople has become the foremost center of learning in the known world. Here the ancient texts are not merely preserved but questioned and built upon, and the nations of the world send their brightest minds to study at its feet."

      EASRE_basileia: "Basileia ton Rhomaion"
      EASRE_basileia_desc: "The Empire of the Romans, not in name alone but in truth. Constantinople commands the crossroads of the world, her fleets rule the seas, her armies hold the ancient frontiers. The Eastern Roman Empire is no longer a remnant or a survivor. It is the heir of Augustus, the successor of Justinian, the living embodiment of eternal Rome."

    # EVENTS - Justinian's Shadow

      flavor_EASRE.1: "The Purple Chamber"
      flavor_EASRE.1.entry: "The Purple Chamber"
      flavor_EASRE.1.title: "The Purple Chamber"
      flavor_EASRE.1.desc: "The Porphyra, the Purple Chamber of the Great Palace, has not seen a birth in centuries. But today it witnesses a coronation. As the new Basileus dons the imperial diadem, the mosaics of Justinian and Theodora seem to watch from the walls, their golden eyes judging whether this new ruler is worthy of their legacy. The incense rises, the choir intones the ancient hymns, and for a moment the weight of a thousand years settles on mortal shoulders."
      flavor_EASRE.1.a: "Let the world know that the Romans have an Emperor again."

      flavor_EASRE.2: "The Patriarch's Question"
      flavor_EASRE.2.entry: "The Patriarch's Question"
      flavor_EASRE.2.title: "The Patriarch's Question"
      flavor_EASRE.2.desc: "The Ecumenical Patriarch stands before the throne, his staff striking the marble floor with each step. His question echoes through the silent hall: What shall be the soul of your empire, Basileus? Shall we walk in the light of the Holy Fathers, guarding the true faith against all heresy? Or shall we also kindle the lamp of Hellenic wisdom, seeking truth wherever it may be found, even beyond the walls of the Church?\n\nWhatever the answer, the Patriarch proposes that the ancient sees of Christendom be bound together again in a Pentarchy under Roman protection."
      flavor_EASRE.2.a: "Orthodoxy is the soul of Rome."
      flavor_EASRE.2.b: "Reason and faith are both pillars of the Empire."
      fnr_EASRE_path_orthodoxy_tt: "Unlocks the [ShowGovernmentReformName('fnr_EASRE_basileus_autokrator')] reform, the #Y Patriarch's Council#! privilege and the #Y Symphonia of Powers#! advance."
      fnr_EASRE_path_hellenistic_tt: "Unlocks the [ShowGovernmentReformName('fnr_EASRE_academocracy')] reform, the #Y Philosophers' Guild#! privileges and the #Y Second Academy#! advance. We become immune to the #Y Iconoclast Controversy#!."

      flavor_EASRE.3: "The Theme Muster"
      flavor_EASRE.3.entry: "The Theme Muster"
      flavor_EASRE.3.title: "The Theme Muster"
      flavor_EASRE.3.desc: "The strategoi have gathered their armies in the plains of Anatolia. Thousands of theme soldiers, farmer-warriors who fight for the land they till, stand in formation beneath the insignia of a dozen different themes. But there is tension in the ranks. Some generals chafe under Constantinople's central command, whispering that a strategos who commands ten thousand men need not answer to a distant palace. The Basileus must decide: tighten the reins, or trust the men who hold the sword."
      flavor_EASRE.3.a: "The themes answer to Constantinople alone."
      flavor_EASRE.3.b: "Empower the strategoi."
      fnr_EASRE_strategoi_risk_tt: "#R In 15 to 25 years an ambitious strategos may rise against us.#!"

      flavor_EASRE.4: "Hagia Sophia's Bells"
      flavor_EASRE.4.entry: "Hagia Sophia's Bells"
      flavor_EASRE.4.title: "Hagia Sophia's Bells"
      flavor_EASRE.4.desc: "The great dome of the Hagia Sophia has endured earthquakes, sieges and the passage of ages, but time has not been kind. Cracks spider across the ancient mosaics, and rainwater seeps through failing mortar. Yet even in disrepair, the Church of Holy Wisdom remains the greatest building in Christendom, a wonder that moves grown men to tears. The question is not whether to restore it, but how: as a monument to God's glory, or as something more."
      flavor_EASRE.4.a: "Restore it to its full glory."
      flavor_EASRE.4.b: "Patch the roof and pray it holds."
      flavor_EASRE.4.c: "Reconsecrate it as the heart of Orthodoxy."
      flavor_EASRE.4.d: "Open its galleries as a public library."
      flavor_EASRE.4.e: "The treasury cannot bear it."

      flavor_EASRE.5: "The Varangian Offer"
      flavor_EASRE.5.entry: "The Varangian Offer"
      flavor_EASRE.5.title: "The Varangian Offer"
      flavor_EASRE.5.desc: "A longship has docked at the Golden Horn, its dragon prow gleaming with salt spray. The Norsemen who disembark are enormous, towering warriors with axes slung across their backs. Their spokesman kneels before the Basileus and offers a simple bargain: gold and purpose in exchange for their axe-arms. These Varangians are the finest warriors in the North. But they are also strangers, many of them pagans, and they answer to their own code."
      flavor_EASRE.5.a: "The Guard is reborn. Welcome, axe-bearers."
      flavor_EASRE.5.b: "Rome needs no foreign swords."
      flavor_EASRE.5.c: "They may serve, once they are baptized."
      fnr_EASRE_varangians_full_tt: "We may raise up to #Y 3#! regiments of #Y Varangian Guard#! in our capital."
      fnr_EASRE_varangians_converted_tt: "We may raise up to #Y 2#! regiments of #Y Varangian Guard#! in our capital."
      fnr_EASRE_varangians_declined_tt: "#R The Varangian Guard will never serve us.#!"

      flavor_EASRE.6: "The City of the World's Desire"
      flavor_EASRE.6.entry: "The City of the World's Desire"
      flavor_EASRE.6.title: "The City of the World's Desire"
      flavor_EASRE.6.desc: "From the walls of the Theodosian fortifications, the Basileus surveys a city that has become the envy of the world. Ships from every nation crowd the Golden Horn. Scholars, merchants, artists and pilgrims stream through gates that have never fallen to an enemy. Constantinople, the Queen of Cities, stands resplendent, her domes gleaming in the morning sun, her markets overflowing with the wealth of three continents. This is civilization's capital, and it will endure for a thousand years more."
      flavor_EASRE.6.a: "Long live the Queen of Cities."

      flavor_EASRE.7: "The Strategos Revolts"
      flavor_EASRE.7.entry: "The Strategos Revolts"
      flavor_EASRE.7.title: "The Strategos Revolts"
      flavor_EASRE.7.desc: "Word arrives from the themes: a strategos grown rich on his district's levies has refused the Emperor's summons. His soldiers hail him as their true lord, and his envoys speak openly of a purple cloak. It is the old sickness of the theme system. The men we trusted to hold the frontier have learned that the frontier is theirs to hold."
      flavor_EASRE.7.a: "Pay him, and pray he stays bought."
      flavor_EASRE.7.b: "March on him and break the themes' pride."

      flavor_EASRE.8: "Imperial Mismanagement"
      flavor_EASRE.8.entry: "Imperial Mismanagement"
      flavor_EASRE.8.title: "Imperial Mismanagement"
      flavor_EASRE.8.desc: "The Basileus Autokrator rules alone, and so the Basileus alone is to blame. Petitions pile up unanswered, tax farmers pocket what they please, and the logothetes no longer bother to hide their contempt for orders that contradict last month's. An autocrat without a head for administration is a danger to the empire he rules."
      flavor_EASRE.8.a: "Pay competent men to clean up the mess."
      flavor_EASRE.8.b: "It will sort itself out."

      flavor_EASRE.9: "Foreign Scholars"
      flavor_EASRE.9.entry: "Foreign Scholars"
      flavor_EASRE.9.title: "Foreign Scholars"
      flavor_EASRE.9.desc: "Scholars from distant lands have arrived at the Second Academy, carrying manuscripts no Roman eye has seen in centuries: Arabic commentaries on Aristotle, Latin treatises on law, star tables from Samarkand. They ask only for lodging, a stipend and the freedom to dispute with our own masters."
      flavor_EASRE.9.a: "Welcome them to the Academy."
      flavor_EASRE.9.b: "Endow chairs for the most brilliant of them."

      flavor_EASRE.10: "The Iconoclast Controversy"
      flavor_EASRE.10.entry: "The Iconoclast Controversy"
      flavor_EASRE.10.title: "The Iconoclast Controversy"
      flavor_EASRE.10.desc: "A faction of bishops and soldiers has begun to preach that the holy images are idols, and that the empire's misfortunes are God's punishment for worshipping paint and wood. In the provinces, mobs have smashed icons; in the capital, monks have rioted in their defense. The old quarrel that tore the empire apart in the days of Leo the Isaurian has returned."
      flavor_EASRE.10.a: "Defend the holy images."
      flavor_EASRE.10.b: "Smash the idols."

    # GOVERNMENT REFORMS

      fnr_EASRE_basileus_autokrator: "Basileus Autokrator"
      fnr_EASRE_basileus_autokrator_desc: "The Emperor is supreme in both the secular and the sacred sphere, crowned by God and answerable to no one on earth. Rulers with poor administration risk #R Imperial Mismanagement#!. Unlocks the #Y Anathematize#! decision."
      fnr_EASRE_academocracy: "Hellenistic Academocracy"
      fnr_EASRE_academocracy_desc: "Government by the learned. Offices go to those trained in the Academy, and the Emperor is expected to be first among philosophers as well as first among Romans. The sharper the ruler's mind, the faster the empire learns."

    # ESTATE PRIVILEGES

      fnr_EASRE_thematic_generals: "Thematic Generals"
      fnr_EASRE_thematic_generals_desc: "The strategoi of the themes are granted wide authority over their districts' levies and fortresses. The frontier is stronger for it, but a general who rules his own theme may one day decide he rules more than that."
      fnr_EASRE_patriarchs_council: "Patriarch's Council"
      fnr_EASRE_patriarchs_council_desc: "The Ecumenical Patriarch sits at the Emperor's council table, his voice heard on every matter of state. The Church lends its full authority to the throne, and the throne in turn defends the Church."
      fnr_EASRE_philosophers_guild: "Philosophers' Guild"
      fnr_EASRE_philosophers_guild_desc: "The merchants and guildsmen of the cities fund schools, copyists and lecturers, and in return their sons fill the Academy's benches and the empire's offices."
      fnr_EASRE_lyceum_patronage: "Lyceum Patronage"
      fnr_EASRE_lyceum_patronage_desc: "Wealthy patrons found lyceums in every great city of the empire, where Plato and Aristotle are taught beside the Fathers of the Church. The clergy grumble at the competition."

    # BUILDINGS

      fnr_EASRE_imperial_cistern: "Imperial Cistern"
      fnr_EASRE_imperial_cistern_desc: "A vast underground reservoir held up by forests of marble columns, storing water against siege and drought. A city with three of them need never fear thirst."
      fnr_EASRE_imperial_cistern_maintenance: "Cistern Upkeep"
      fnr_EASRE_great_academy: "Great Academy"
      fnr_EASRE_great_academy_desc: "The halls of the Second Academy, where Rome's brightest minds teach and dispute. It exists only so long as the capital and the Academocracy endure."
      fnr_EASRE_great_academy_maintenance: "Academy Stipends"

    # UNITS

      fnr_EASRE_cataphract_1: "Cataphracts"
      fnr_EASRE_cataphract_1_desc: "Horse and rider clad head to hoof in mail and lamellar, the cataphract is the hammer of the Roman army - slow, costly and nearly unstoppable on open ground."
      fnr_EASRE_cataphract_2: "Cataphracts"
      fnr_EASRE_cataphract_2_desc: "$fnr_EASRE_cataphract_1_desc$"
      fnr_EASRE_cataphract_3: "Cataphracts"
      fnr_EASRE_cataphract_3_desc: "$fnr_EASRE_cataphract_1_desc$"
      fnr_EASRE_cataphract_4: "Cataphracts"
      fnr_EASRE_cataphract_4_desc: "$fnr_EASRE_cataphract_1_desc$"
      fnr_EASRE_cataphract_5: "Cataphracts"
      fnr_EASRE_cataphract_5_desc: "$fnr_EASRE_cataphract_1_desc$"
      fnr_EASRE_cataphract_6: "Cataphracts"
      fnr_EASRE_cataphract_6_desc: "$fnr_EASRE_cataphract_1_desc$"
      fnr_EASRE_varangians_2: "Varangian Guard"
      fnr_EASRE_varangians_2_desc: "Axe-bearing warriors from the far North, sworn to the person of the Emperor. They guard the palace, and they do not take bribes."
      fnr_EASRE_varangians_3: "Varangian Guard"
      fnr_EASRE_varangians_3_desc: "$fnr_EASRE_varangians_2_desc$"
      fnr_EASRE_varangians_4: "Varangian Guard"
      fnr_EASRE_varangians_4_desc: "$fnr_EASRE_varangians_2_desc$"
      fnr_EASRE_varangians_5: "Varangian Guard"
      fnr_EASRE_varangians_5_desc: "$fnr_EASRE_varangians_2_desc$"
      fnr_EASRE_varangians_6: "Varangian Guard"
      fnr_EASRE_varangians_6_desc: "$fnr_EASRE_varangians_2_desc$"
      fnr_EASRE_greek_fire_dromon_2: "Greek Fire Dromon"
      fnr_EASRE_greek_fire_dromon_2_desc: "A war galley fitted with bronze siphons that spray liquid fire across the water. Devastating against galleys in close waters."
      fnr_EASRE_greek_fire_dromon_3: "Greek Fire Dromon"
      fnr_EASRE_greek_fire_dromon_3_desc: "$fnr_EASRE_greek_fire_dromon_2_desc$"

    # DECISIONS

      fnr_EASRE_restore_see_constantinople.title: "Restore the See of Constantinople"
      fnr_EASRE_restore_see_constantinople.desc: "The Ecumenical Patriarchate is the first see of the Orthodox world. Its churches, schools and charities deserve the full patronage of the Roman state."
      fnr_EASRE_restore_see_constantinople.a: "Restore the Patriarchate's splendor."
      fnr_EASRE_restore_see_antioch.title: "Restore the See of Antioch"
      fnr_EASRE_restore_see_antioch.desc: "Antioch, where the followers of Christ were first called Christians, has suffered centuries of war. Its patriarch can again be a pillar of the faith in the East."
      fnr_EASRE_restore_see_antioch.a: "Rebuild the churches of Antioch."
      fnr_EASRE_restore_see_jerusalem.title: "Restore the See of Jerusalem"
      fnr_EASRE_restore_see_jerusalem.desc: "The Holy City is in Roman hands once more. Its patriarchate, the guardian of the holiest places in Christendom, must be restored with honor."
      fnr_EASRE_restore_see_jerusalem.a: "Restore the guardians of the Holy Places."
      fnr_EASRE_restored_see_tt: "While we own this city we gain its #Y Restored See#! bonus. Owning all three restored sees grants #Y Shield of Christendom#!."

      fnr_EASRE_restore_theodosian_walls.title: "Restore the Theodosian Walls"
      fnr_EASRE_restore_theodosian_walls.desc: "The land walls of Theodosius have turned back Huns, Avars, Arabs and Bulgars. Rebuilt and regarrisoned, they can do so again."
      fnr_EASRE_restore_theodosian_walls.a: "Man the walls."

      fnr_EASRE_anathematize.title: "Anathematize the Schismatics"
      fnr_EASRE_anathematize.desc: "Rulers who call themselves Orthodox yet raise their hands against the Roman Emperor are no true sons of the Church. With the Patriarch's council at his side, the Basileus Autokrator can cast them out of communion."
      fnr_EASRE_anathematize.a: "Let them be anathema."
      fnr_EASRE_anathematize_targets_tt: "At least one #Y Orthodox#! country is our rival, or considers us its rival."
      fnr_EASRE_anathematize_effect_tt: "Every #Y Orthodox#! country that is our rival, or considers us its rival, loses legitimacy, gains #R Anathema#! for 5 years and has its opinion of us worsened. Can be used again in 10 years."

    # INTERNATIONAL ORGANIZATION - The Pentarchy

      fnr_EASRE_pentarchy_io: "The Pentarchy"
      fnr_EASRE_pentarchy_io_name: "The Pentarchy"
      fnr_EASRE_pentarchy_io_created_tt: "Founds #Y The Pentarchy#! with us as its permanent leader."
      fnr_EASRE_pentarchy_io_desc: "The five ancient patriarchates of Christendom, Rome, Constantinople, Alexandria, Antioch and Jerusalem, reconstituted under the protection of the Roman Emperor. The Pentarchy lends the Emperor the authority of the whole Orthodox world, and the more of the five sees he holds, the stronger that authority becomes."
      fnr_EASRE_pentarchy_io_list_who_tt: "$WHO$ is a member of [GetUniqueInternationalOrganization('fnr_EASRE_pentarchy_io').GetName] with $LIST$"
      diplomatic_status_fnr_EASRE_pentarchy_io_name: "The Pentarchy"
      diplomatic_status_fnr_EASRE_pentarchy_io_tooltip: "#T The Pentarchy#!\nThis [country|e] is a member of the Pentarchy."
      io_opinion_fnr_EASRE_pentarchy_io: "Fellow member of the Pentarchy"
      fnr_EASRE_anathematized: "Anathematized by the Roman Emperor"

    # STATIC MODIFIERS

      STATIC_MODIFIER_NAME_fnr_EASRE_heir_of_justinian: "Heir of Justinian"
      STATIC_MODIFIER_DESC_fnr_EASRE_heir_of_justinian: "The new Basileus has taken up the purple of Justinian and Theodora."
      STATIC_MODIFIER_NAME_fnr_EASRE_orthodoxy_triumphant: "Orthodoxy Triumphant"
      STATIC_MODIFIER_DESC_fnr_EASRE_orthodoxy_triumphant: "The empire has declared the true faith its soul."
      STATIC_MODIFIER_NAME_fnr_EASRE_hellenistic_renaissance: "Hellenistic Renaissance"
      STATIC_MODIFIER_DESC_fnr_EASRE_hellenistic_renaissance: "The lamp of Hellenic wisdom burns beside the light of the Fathers."
      STATIC_MODIFIER_NAME_fnr_EASRE_central_command: "Central Command"
      STATIC_MODIFIER_DESC_fnr_EASRE_central_command: "The themes answer to Constantinople alone."
      STATIC_MODIFIER_NAME_fnr_EASRE_empowered_strategoi: "Empowered Strategoi"
      STATIC_MODIFIER_DESC_fnr_EASRE_empowered_strategoi: "The theme generals raise more men, and grow more powerful with every muster."
      STATIC_MODIFIER_NAME_fnr_EASRE_hagia_sophia_rededicated: "Hagia Sophia Rededicated"
      STATIC_MODIFIER_DESC_fnr_EASRE_hagia_sophia_rededicated: "The Church of Holy Wisdom shines again."
      STATIC_MODIFIER_NAME_fnr_EASRE_city_of_worlds_desire: "City of the World's Desire"
      STATIC_MODIFIER_DESC_fnr_EASRE_city_of_worlds_desire: "Constantinople is the envy of the world, and the world knows whose city it is."
      STATIC_MODIFIER_NAME_fnr_EASRE_imperial_mismanagement: "Imperial Mismanagement"
      STATIC_MODIFIER_DESC_fnr_EASRE_imperial_mismanagement: "The autocrat's neglect has let corruption run through the administration."
      STATIC_MODIFIER_NAME_fnr_EASRE_foreign_scholars: "Foreign Scholars"
      STATIC_MODIFIER_DESC_fnr_EASRE_foreign_scholars: "Learned men from distant lands lecture at the Academy."
      STATIC_MODIFIER_NAME_fnr_EASRE_iconoclasm: "Iconoclasm"
      STATIC_MODIFIER_DESC_fnr_EASRE_iconoclasm: "The holy images are being torn down. The soldiers cheer; the monks do not."
      STATIC_MODIFIER_NAME_fnr_EASRE_anathema: "Anathema"
      STATIC_MODIFIER_DESC_fnr_EASRE_anathema: "Our ruler has been cast out of communion by the Roman Emperor."
      STATIC_MODIFIER_NAME_fnr_EASRE_thematic_army: "Thematic Army"
      STATIC_MODIFIER_DESC_fnr_EASRE_thematic_army: "Five or more themes field their own soldier-farmers."
      STATIC_MODIFIER_NAME_fnr_EASRE_roman_water_engineering: "Roman Water Engineering"
      STATIC_MODIFIER_DESC_fnr_EASRE_roman_water_engineering: "Three imperial cisterns keep the capital supplied through any siege or drought."
      STATIC_MODIFIER_NAME_fnr_EASRE_cataphract_drill_1: "Cataphract Drill"
      STATIC_MODIFIER_DESC_fnr_EASRE_cataphract_drill_1: "The themes train heavy horsemen in the Roman manner."
      STATIC_MODIFIER_NAME_fnr_EASRE_cataphract_drill_2: "Cataphract Drill"
      STATIC_MODIFIER_DESC_fnr_EASRE_cataphract_drill_2: "$STATIC_MODIFIER_DESC_fnr_EASRE_cataphract_drill_1$"
      STATIC_MODIFIER_NAME_fnr_EASRE_cataphract_drill_3: "Cataphract Drill"
      STATIC_MODIFIER_DESC_fnr_EASRE_cataphract_drill_3: "$STATIC_MODIFIER_DESC_fnr_EASRE_cataphract_drill_1$"
      STATIC_MODIFIER_NAME_fnr_EASRE_cataphract_drill_4: "Cataphract Drill"
      STATIC_MODIFIER_DESC_fnr_EASRE_cataphract_drill_4: "$STATIC_MODIFIER_DESC_fnr_EASRE_cataphract_drill_1$"
      STATIC_MODIFIER_NAME_fnr_EASRE_cataphract_drill_5: "Cataphract Drill"
      STATIC_MODIFIER_DESC_fnr_EASRE_cataphract_drill_5: "$STATIC_MODIFIER_DESC_fnr_EASRE_cataphract_drill_1$"
      STATIC_MODIFIER_NAME_fnr_EASRE_cataphract_drill_6: "Cataphract Drill"
      STATIC_MODIFIER_DESC_fnr_EASRE_cataphract_drill_6: "$STATIC_MODIFIER_DESC_fnr_EASRE_cataphract_drill_1$"
      STATIC_MODIFIER_NAME_fnr_EASRE_see_constantinople: "Restored See of Constantinople"
      STATIC_MODIFIER_DESC_fnr_EASRE_see_constantinople: "The Ecumenical Patriarchate flourishes under Roman patronage."
      STATIC_MODIFIER_NAME_fnr_EASRE_see_antioch: "Restored See of Antioch"
      STATIC_MODIFIER_DESC_fnr_EASRE_see_antioch: "The ancient see of Antioch stands again."
      STATIC_MODIFIER_NAME_fnr_EASRE_see_jerusalem: "Restored See of Jerusalem"
      STATIC_MODIFIER_DESC_fnr_EASRE_see_jerusalem: "The Holy Places are guarded by a Roman-backed patriarch."
      STATIC_MODIFIER_NAME_fnr_EASRE_shield_of_christendom: "Shield of Christendom"
      STATIC_MODIFIER_DESC_fnr_EASRE_shield_of_christendom: "Constantinople, Antioch and Jerusalem all stand restored under Roman rule."
      STATIC_MODIFIER_NAME_fnr_EASRE_hagia_sophia_restored: "Hagia Sophia Restored"
      STATIC_MODIFIER_DESC_fnr_EASRE_hagia_sophia_restored: "The great dome has been repaired and its mosaics gleam again."
      STATIC_MODIFIER_NAME_fnr_EASRE_hagia_sophia_library: "Library of Holy Wisdom"
      STATIC_MODIFIER_DESC_fnr_EASRE_hagia_sophia_library: "The galleries of the Hagia Sophia are open to scholars."
      STATIC_MODIFIER_NAME_fnr_EASRE_queen_of_cities: "Queen of Cities"
      STATIC_MODIFIER_DESC_fnr_EASRE_queen_of_cities: "Constantinople, the City of the World's Desire."
      STATIC_MODIFIER_NAME_fnr_EASRE_walls_restored: "Theodosian Walls Restored"
      STATIC_MODIFIER_DESC_fnr_EASRE_walls_restored: "The land walls stand rebuilt and fully garrisoned."
      STATIC_MODIFIER_NAME_fnr_EASRE_restored_see: "Restored Patriarchal See"
      STATIC_MODIFIER_DESC_fnr_EASRE_restored_see: "This ancient see has been restored under Roman patronage."
      STATIC_MODIFIER_NAME_fnr_EASRE_greek_fire_waters: "Greek Fire Waters"
      STATIC_MODIFIER_DESC_fnr_EASRE_greek_fire_waters: "Roman dromons with siphons of liquid fire patrol these waters."
