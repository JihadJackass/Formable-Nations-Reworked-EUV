      fnr_toggle_state_default_off: "Default (#R Off#!)"
      fnr_toggle_row_tt: "Click to cycle - Default, Forced Off, Forced On.\nDefault follows the category setting."
      fnr_toggle_rank_tt: "Show or hide the formables of this rank"
      fnr_toggle_reset_all: "Reset All to Default"
      fnr_toggle_reset_all_tt: "Every individual formable goes back to #Y Default#!, following its category setting."
      fnr_toggle_back_to_settings: "Back to Settings"
