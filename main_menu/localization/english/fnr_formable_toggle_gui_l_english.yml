  # Settings window (tabs, rows, presets)
      fnr_settings_title: "Formable Nations: Reworked - Settings"
      fnr_settings_tab_formables: "Formables"
      fnr_settings_tab_custom: "Customization"
      fnr_settings_tab_about: "About"
      fnr_settings_row_timeline: "Timeline"
      fnr_settings_row_special: "Special"
      fnr_settings_row_base: "Base Game"
      fnr_settings_presets_header: "#T Presets#! - set every category at once (individual toggles are kept)"
      fnr_preset_default: "Default"
      fnr_preset_default_tt: "#Y Historical#! and #Y Vanilla#! formables on, everything else off. The same as a new game."
      fnr_preset_plausible: "Plausible"
      fnr_preset_plausible_tt: "#Y Historical#!, #Y Non-Historical#!, #Y Alt-History#! and #Y Vanilla#! formables on. Modern, Controversial, Fantasy, Meme and North American formables off."
      fnr_preset_everything: "Everything"
      fnr_preset_everything_tt: "Every category on."
      fnr_preset_vanilla_only: "Vanilla Only"
      fnr_preset_vanilla_only_tt: "Only the base game's formables. Every Formable Nations: Reworked category off."
      fnr_settings_open_list: "Open Individual Formables List"
      fnr_settings_flag_selection: "Flag Selection (Coming Soon)"
      fnr_settings_color_selection: "Color Selection (Coming Soon)"
      fnr_settings_custom_text: "#T Customization#!\nPersonalise the nations you form. #Y Flag Selection#! lets you pick between the alternative flags a formable has, and #Y Color Selection#! lets you choose its map colour.\n\nBoth tools are #R still in development#! and will arrive in a future major update."
      fnr_settings_about_text: "#T Formable Nations: Reworked#!\nAn overhaul of every formable nation in Europa Universalis V, with hundreds of new formables, custom governments, events, disasters and flavour.\n\n#T How the settings work#!\n- #Y Categories#! (the Formables tab) switch whole groups of formables on or off: Historical, Non-Historical, Alt-History, Modern, Controversial, Fantasy, Meme, North American and the base game's Vanilla formables.\n- #Y Individual formables#! can be forced on or off regardless of their category in the Individual Formables list. #Y Default#! follows the category.\n- Settings apply to every country, the AI included, and countries that appear later in the game copy them.\n- The game's own rule for fantasy formables still applies on top of these settings."
