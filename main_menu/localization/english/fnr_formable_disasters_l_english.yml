    # Eranshahr

      # Disaster name and description
      fnr_ERSHR_zoroastrian_reaction: "The Zoroastrian Reaction"
      fnr_ERSHR_zoroastrian_reaction_desc: "The crown has restored the faith of Zarathustra, but the realm remains overwhelmingly Muslim. From the bazaars of the cities to the villages of the countryside, resentment against the reimposed fire-worship is mounting. Unless the state can win the population to the old faith, or crush the resistance outright, the realm risks tearing itself apart."

      # can_start custom tooltip
      had_zoroastrian_reaction_before_tt: "We have not already endured the Zoroastrian Reaction"

      # Generic monthly tooltips (reuse vanilla if they exist; included here for safety)
      an_event_occurs_tt: "An event may occur"
      no_event_occurs_tt: "No event occurs this month"

    # Rhineland

      fnr_RHLND_fracturing_confederation: "The Fracturing of the Confederation"
      fnr_RHLND_fracturing_confederation_desc: "The Rheinkonföderation is a loose coalition of counts, free cities and prince-bishops, and with the realm in turmoil its members have begun to go their own way. Unless we restore order, or reform the confederation into a true state, the Rhineland may break apart again."

    # Belgium

      fnr_BLGUM_belgian_revolution: "The Belgian Revolution"
      fnr_BLGUM_belgian_revolution_desc: "The Catholic south of the Low Countries has risen against our rule. Patriots hold the streets of Brussels, the clergy bless their cause, and foreign powers watch with interest. If we cannot restore order, the south will break away as a kingdom of its own.\n\n$fnr_BLGUM_independence_current$"

