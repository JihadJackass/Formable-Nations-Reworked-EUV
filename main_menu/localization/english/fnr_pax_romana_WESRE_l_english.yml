l_english:

  ###########################################################
  # Pax Romana - Western Roman Empire (WESRE)               #
  ###########################################################

    # ADVANCES

      WESRE_foederati_integration: "Foederati Integration"
      WESRE_foederati_integration_desc: "The legions are shadows of what they were. The Western Emperor looks to the barbarian warriors camped beyond his borders, Goths, Franks and Vandals, and sees not enemies but salvation. If Rome cannot field enough soldiers of her own, she will buy the swords of others. The foederati are a gamble - cheap, fierce and effective, but loyal only so long as the gold flows and the land is shared.\n\nUnlocks #Y Foederati Cavalry#!, the #Y Foederati Chiefs#! privilege, the #Y Foederati Settlement#! law and the #Y Settle the Foederati#! decision. Our #Y Foederati loyalty#! starts at 50."

      WESRE_limes_reconstruction: "Limes Reconstruction"
      WESRE_limes_reconstruction_desc: "Stone by stone, the old border fortifications are rebuilt. Watchtowers rise from rubble and signal fires are relit along the Rhine and Danube. It is grueling, expensive work - every coin poured into mortar is a coin that cannot feed a soldier or bribe a chieftain. But the Limes are more than walls. They are a statement that Rome still draws lines on the map, and that those lines still mean something.\n\nUnlocks the #Y Limes Watchtower#!, #Y Burgus#! and #Y Castellum#! in border locations."

      WESRE_ravenna_bureaucracy: "Ravenna's Bureaucracy"
      WESRE_ravenna_bureaucracy_desc: "Ravenna sits behind its marshes like a jewel in a casket, untouchable by land and supplied by sea. It is the perfect capital for an empire under siege. Here the Western Emperor builds a bureaucracy from scratch - tax collectors, administrators and legal scholars, all dedicated to wringing order from the chaos of the dying West. What Ravenna lacks in glory, it makes up in survival.\n\nWhile we own Ravenna it gains the #Y Imperial Capital#! bonus. Allows us to #Y Convene the Concilium#!."

      WESRE_ecclesiastical_alliance: "Ecclesiastical Alliance"
      WESRE_ecclesiastical_alliance_desc: "Where the legions have failed, the Church endures. The Bishop of Rome commands a network of clergy, monasteries and faithful stretching from Hispania to the Danube. An alliance with the Church buys the Western Emperor something no army can provide - legitimacy in the eyes of millions. The cross and the eagle become one banner.\n\nGrants the permanent #Y Papal Blessing#!."

      WESRE_renovatio_occidentalis: "Renovatio Occidentalis"
      WESRE_renovatio_occidentalis_desc: "Against every expectation and every prophecy of doom, the Western Roman Empire has endured. More than endured - it has reclaimed its ancient provinces, rebuilt its shattered institutions and rekindled the flame the world believed extinguished forever. The Renovatio Occidentalis is proclaimed from the steps of the restored Capitol. The last candle has become a bonfire.\n\nEnds #Y The Last Light#! and grants the permanent #Y Renovatio#!."

    # EVENTS - The Last Light

      flavor_WESRE.1: "The Empty Treasury"
      flavor_WESRE.1.entry: "The Empty Treasury"
      flavor_WESRE.1.title: "The Empty Treasury"
      flavor_WESRE.1.desc: "The imperial treasurer opens the vault doors and the torchlight reveals what everyone feared: the coffers are nearly bare. A few chests of tarnished silver, a handful of gold solidi that rattle like teeth in a skull. The legions have not been paid in months. The foederati are growing restless. The aqueducts are crumbling, the roads are broken, and the tax collectors report that half the provinces simply refuse to pay. The Western Empire is bankrupt, and its new ruler must find gold, any gold, before the creditors come calling with swords."
      flavor_WESRE.1.a: "Debase the coinage."
      flavor_WESRE.1.b: "The Church is rich. Tax it."
      flavor_WESRE.1.c: "Appeal to our brothers in Constantinople."
      flavor_WESRE.1.d: "We will endure without their gold."
      fnr_WESRE_east_sends_gold_tt: "#G 50%#! chance that Constantinople sends #Y 400#! gold."
      fnr_WESRE_east_refuses_tt: "#R 50%#! chance that Constantinople refuses, and the whole court knows it."

      flavor_WESRE.2: "The Barbarian at the Gate"
      flavor_WESRE.2.entry: "The Barbarian at the Gate"
      flavor_WESRE.2.title: "The Barbarian at the Gate"
      flavor_WESRE.2.desc: "The scouts ride in at dawn, their horses lathered and heaving. A vast barbarian host has crossed the frontier: tens of thousands of warriors, with their families and livestock trailing behind. This is no raid; it is a migration, a tide of people seeking land, food and the warmth of Roman civilization. The garrison commander sends a desperate dispatch: fight, flee or bargain. There is no fourth option."
      flavor_WESRE.2.a: "Give them a province and buy peace."
      flavor_WESRE.2.b: "To arms! Rome does not yield."
      flavor_WESRE.2.c: "Let them settle as foederati."
      flavor_WESRE.2.d: "Every general has a price."
      fnr_WESRE_battle_odds_tt: "The frontier battle decides it. #G 60%#! chance of victory, #G 75%#! if our army is the larger.\nIf we win, #G Defender of Rome#! for 10 years.\nIf we lose, we lose #R 2#! border provinces, #R Frontier Collapse#! and #R Debased Coinage#! for 10 years."
      fnr_WESRE_bribe_works_tt: "#G 70%#! chance that they take the gold and turn back."
      fnr_WESRE_bribe_fails_tt: "#R 30%#! chance that they take the gold AND a border province."

      flavor_WESRE.3: "The General's Ambition"
      flavor_WESRE.3.entry: "The General's Ambition"
      flavor_WESRE.3.title: "The General's Ambition"
      flavor_WESRE.3.desc: "The Magister Militum has won battle after battle. The soldiers worship him. The provinces send him petitions directly, bypassing the palace entirely. He is everything the Emperor is not: decisive, martial, beloved. And therein lies the danger. In the old Rome, generals who became too popular had a habit of crossing the Rubicon. This one has not yet reached for the purple, but his hand rests close to it."
      flavor_WESRE.3.a: "Recall him to court with honors."
      flavor_WESRE.3.b: "He has earned his glory. Leave him be."
      flavor_WESRE.3.c: "Bind him to the dynasty through marriage."
      flavor_WESRE.3.d: "An accident can be arranged."
      fnr_WESRE_usurper_risk_tt: "#R 60%#! chance that within 5 to 10 years he proclaims himself emperor and raises a rebellion."
      fnr_WESRE_assassination_works_tt: "#G 70%#! chance that the general dies, and the army mourns him."
      fnr_WESRE_assassination_fails_tt: "#R 30%#! chance that the plot fails and he rises in revolt at once."

      flavor_WESRE.4: "The Pope's Bargain"
      flavor_WESRE.4.entry: "The Pope's Bargain"
      flavor_WESRE.4.title: "The Pope's Bargain"
      flavor_WESRE.4.desc: "His Holiness arrives at the palace not as a supplicant, but as a peer, perhaps more than a peer. In the crumbling West, the Church has become the only institution that still functions, the only authority the barbarian kings respect. The Pope offers his blessing, his network and his moral authority. In return he wants recognition: temporal power, land, the right to speak as the voice of God in earthly affairs. It is a bargain that will shape the West for centuries."
      flavor_WESRE.4.a: "Grant the Church temporal authority."
      flavor_WESRE.4.b: "His authority is spiritual, and only spiritual."
      flavor_WESRE.4.c: "The Emperor answers to no bishop."
      fnr_WESRE_refused_pope_tt: "#R Ecclesiastical Alliance#! will need #Y 55%#! religious unity instead of #Y 40%#!."

      flavor_WESRE.5: "The Aqueducts Fail"
      flavor_WESRE.5.entry: "The Aqueducts Fail"
      flavor_WESRE.5.title: "The Aqueducts Fail"
      flavor_WESRE.5.desc: "The great aqueduct that has fed Rome for five hundred years groans, shudders and falls silent. Within days the fountains run dry, the baths close, and the stench of a city without sanitation fills the seven hills. It is a small catastrophe in an age of catastrophes, but it carries a terrible symbolism: the engineering marvel that made Roman civilization possible is dying, and with it the last physical proof that Rome was ever more than a dream."
      flavor_WESRE.5.a: "Rebuild them all, whatever it costs."
      flavor_WESRE.5.b: "Repair what the capital needs."
      flavor_WESRE.5.c: "We have greater worries than water."

      flavor_WESRE.6: "A Letter from the East"
      flavor_WESRE.6.entry: "A Letter from the East"
      flavor_WESRE.6.title: "A Letter from the East"
      flavor_WESRE.6.desc: "A ship arrives from Constantinople bearing a letter sealed with purple wax and the imperial eagle. The Eastern Emperor, our brother in name and rival in truth, extends the hand of friendship. He offers gold, advisors, perhaps even soldiers. But every line carries the same subtext: the East considers itself the true Rome, and its aid comes with the unspoken expectation of deference. To accept is to survive but to bow. To refuse is to stand alone in a world full of wolves."
      flavor_WESRE.6.a: "Accept the alliance."
      flavor_WESRE.6.b: "The West bows to no one."
      flavor_WESRE.6.c: "Propose an alliance of equals."
      fnr_WESRE_east_accepts_tt: "#G 50%#! chance that the Eastern Emperor agrees, as one Augustus to another."
      fnr_WESRE_east_insulted_tt: "#R 50%#! chance that the Eastern Emperor takes it as an insult."

      flavor_WESRE.7: "The Reconquest Begins"
      flavor_WESRE.7.entry: "The Reconquest Begins"
      flavor_WESRE.7.title: "The Reconquest Begins"
      flavor_WESRE.7.desc: "For a generation the Western Empire has done nothing but survive: patching walls, buying time, trading provinces for peace. But the survival phase is over. The treasury holds gold again. The legions are trained and equipped. The borders are fortified. Now the Emperor stands before his generals with a map of the old empire spread across the table, and asks the question no Western ruler has dared ask in centuries: where do we attack first?"
      flavor_WESRE.7.a: "Gaul."
      flavor_WESRE.7.b: "Hispania."
      flavor_WESRE.7.c: "Africa."
      flavor_WESRE.7.d: "Everywhere at once."
      fnr_WESRE_front_gaul_tt: "Unlocks the #Y Reconquest of Gaul#! casus belli against anyone holding land in France."
      fnr_WESRE_front_hispania_tt: "Unlocks the #Y Reconquest of Hispania#! casus belli against anyone holding land in Iberia."
      fnr_WESRE_front_africa_tt: "Unlocks the #Y Reconquest of Africa#! casus belli against anyone holding land in the Maghreb."
      fnr_WESRE_front_all_tt: "Unlocks the reconquest casus belli for #Y Gaul#!, #Y Hispania#! and #Y Africa#!, with no regional bonus."
      fnr_WESRE_reform_upgrade_tt: "#Y Magistrate of the West#! will become #Y Restored Western Emperor#!."

      flavor_WESRE.8: "Renovatio"
      flavor_WESRE.8.entry: "Renovatio"
      flavor_WESRE.8.title: "Renovatio"
      flavor_WESRE.8.desc: "They said the West would fall. They said the barbarians would carve its corpse into a dozen petty kingdoms. They said Rome's story ended on the day the last emperor was deposed and the eagles were laid in the dust. They were wrong. Against every prediction, the Western Roman Empire has risen from its grave. The eagles fly again over Gaul, over Hispania, over the ancient provinces. This is not a resurrection. It is a miracle."
      flavor_WESRE.8.a: "The eagles fly again."

      flavor_WESRE.9: "The Usurper"
      flavor_WESRE.9.entry: "The Usurper"
      flavor_WESRE.9.title: "The Usurper"
      flavor_WESRE.9.desc: "It has happened as the old Romans would have predicted. The general we failed to restrain has been hailed as Augustus by his troops, and two provinces have declared for him. His banners are already on the march, and the soldiers who follow him are our soldiers."
      flavor_WESRE.9.a: "There is only one Emperor in the West."
      fnr_WESRE_usurper_rebels: "Usurper's Legions"

      flavor_WESRE.10: "The Foederati Revolt"
      flavor_WESRE.10.entry: "The Foederati Revolt"
      flavor_WESRE.10.title: "The Foederati Revolt"
      flavor_WESRE.10.desc: "The barbarian allies have waited long enough. The gold has stopped, the promised land has been taken back or never given, and their chiefs have stopped pretending to be Romans. In the settlements along the frontier the war-bands have risen, and the men we armed to defend the Empire now march against it."
      flavor_WESRE.10.a: "Then they will learn what Rome does to traitors."
      fnr_WESRE_foederati_uprising: "Foederati Uprising"
      fnr_WESRE_foederati_revolt_tt: "Up to #Y 3#! Foederati settlements rise in revolt and lose their settlement status. #Y Foederati loyalty#! resets to #Y 45#!. Another revolt cannot happen for #Y 10#! years."

    # GOVERNMENT REFORMS

      fnr_WESRE_magistrate_of_the_west: "Magistrate of the West"
      fnr_WESRE_magistrate_of_the_west_desc: "A crisis government for an empire under siege. Power is concentrated in the hands of the Emperor and his military magistrates, and the niceties of diplomacy can wait. It becomes #Y Restored Western Emperor#! once the Reconquest begins."
      fnr_WESRE_restored_western_emperor: "Restored Western Emperor"
      fnr_WESRE_restored_western_emperor_desc: "The emergency is over. The Emperor of the West rules once more as the heir of Augustus, with the armies, the treasury and the respect of the world behind him."

    # ESTATE PRIVILEGES

      fnr_WESRE_foederati_chiefs: "Foederati Chiefs"
      fnr_WESRE_foederati_chiefs_desc: "The war-chiefs of our barbarian allies are given rank among the Roman nobility. Their warriors fight harder for an Empire that honors them. While granted, #Y Foederati loyalty#! rises by #G 1#! each year instead of falling, and settlements give double loyalty."

    # LAWS

      fnr_WESRE_foederati_law: "Foederati Settlement"
      fnr_WESRE_foederati_law_desc: "How far may the barbarian allies settle within the Empire's borders?"
      fnr_WESRE_roman_exclusivity_policy: "Roman Exclusivity"
      fnr_WESRE_roman_exclusivity_policy_desc: "Roman land is for Romans. The foederati may serve, but they may not settle."
      fnr_WESRE_foederati_settlement_policy: "Foederati Settlement"
      fnr_WESRE_foederati_settlement_policy_desc: "Frontier lands are granted to the foederati in return for service. Unlocks the #Y Settle the Foederati#! decision. Repealing it costs #R 20#! Foederati loyalty and unsettles every settlement for 5 years."

    # BUILDINGS

      fnr_WESRE_watchtower: "Limes Watchtower"
      fnr_WESRE_watchtower_desc: "A stone tower on the frontier, its signal fire ready to warn the next garrison of any army that approaches."
      fnr_WESRE_watchtower_maintenance: "Watchtower Upkeep"
      fnr_WESRE_burgus: "Burgus"
      fnr_WESRE_burgus_desc: "A small fortified post with a permanent garrison, guarding a river crossing or a road."
      fnr_WESRE_burgus_maintenance: "Burgus Upkeep"
      fnr_WESRE_castellum: "Castellum"
      fnr_WESRE_castellum_desc: "A full frontier fortress, home to a garrison of comitatenses. Three or more side by side form a #Y Limes Network#!."
      fnr_WESRE_castellum_maintenance: "Castellum Upkeep"

    # UNITS

      fnr_WESRE_foederati_cavalry_1: "Foederati Cavalry"
      fnr_WESRE_foederati_cavalry_1_desc: "Barbarian horsemen fighting under Roman banners for gold and land. Cheap, fast and fierce, as long as their loyalty holds. They cannot be raised while Foederati loyalty is below 30."
      fnr_WESRE_foederati_cavalry_2: "Foederati Cavalry"
      fnr_WESRE_foederati_cavalry_2_desc: "$fnr_WESRE_foederati_cavalry_1_desc$"
      fnr_WESRE_foederati_cavalry_3: "Foederati Cavalry"
      fnr_WESRE_foederati_cavalry_3_desc: "$fnr_WESRE_foederati_cavalry_1_desc$"
      fnr_WESRE_foederati_cavalry_4: "Foederati Cavalry"
      fnr_WESRE_foederati_cavalry_4_desc: "$fnr_WESRE_foederati_cavalry_1_desc$"
      fnr_WESRE_foederati_cavalry_5: "Foederati Cavalry"
      fnr_WESRE_foederati_cavalry_5_desc: "$fnr_WESRE_foederati_cavalry_1_desc$"
      fnr_WESRE_foederati_cavalry_6: "Foederati Cavalry"
      fnr_WESRE_foederati_cavalry_6_desc: "$fnr_WESRE_foederati_cavalry_1_desc$"
      fnr_WESRE_comitatenses_1: "Comitatenses"
      fnr_WESRE_comitatenses_1_desc: "The field army of the late Empire - professional, well equipped and expensive. The backbone of the West. Guard them carefully. At most 10 regiments."
      fnr_WESRE_comitatenses_2: "Comitatenses"
      fnr_WESRE_comitatenses_2_desc: "$fnr_WESRE_comitatenses_1_desc$"
      fnr_WESRE_comitatenses_3: "Comitatenses"
      fnr_WESRE_comitatenses_3_desc: "$fnr_WESRE_comitatenses_1_desc$"
      fnr_WESRE_comitatenses_4: "Comitatenses"
      fnr_WESRE_comitatenses_4_desc: "$fnr_WESRE_comitatenses_1_desc$"
      fnr_WESRE_comitatenses_5: "Comitatenses"
      fnr_WESRE_comitatenses_5_desc: "$fnr_WESRE_comitatenses_1_desc$"
      fnr_WESRE_comitatenses_6: "Comitatenses"
      fnr_WESRE_comitatenses_6_desc: "$fnr_WESRE_comitatenses_1_desc$"
      fnr_WESRE_bucellarii_1: "Bucellarii"
      fnr_WESRE_bucellarii_1_desc: "Elite household troops sworn to a single great general. We may keep 2 regiments for every general with 60 or more military skill."
      fnr_WESRE_bucellarii_2: "Bucellarii"
      fnr_WESRE_bucellarii_2_desc: "$fnr_WESRE_bucellarii_1_desc$"
      fnr_WESRE_bucellarii_3: "Bucellarii"
      fnr_WESRE_bucellarii_3_desc: "$fnr_WESRE_bucellarii_1_desc$"
      fnr_WESRE_bucellarii_4: "Bucellarii"
      fnr_WESRE_bucellarii_4_desc: "$fnr_WESRE_bucellarii_1_desc$"
      fnr_WESRE_bucellarii_5: "Bucellarii"
      fnr_WESRE_bucellarii_5_desc: "$fnr_WESRE_bucellarii_1_desc$"
      fnr_WESRE_bucellarii_6: "Bucellarii"
      fnr_WESRE_bucellarii_6_desc: "$fnr_WESRE_bucellarii_1_desc$"

    # DECISIONS

      fnr_WESRE_convene_concilium.title: "Convene the Concilium"
      fnr_WESRE_convene_concilium.desc: "The small realms on the frontier all ask the same question: who will protect us? Ravenna has an answer. A Council of the West, bound by mutual defense and led by the Emperor, can hold back the barbarian tide where no single kingdom could."
      fnr_WESRE_convene_concilium.a: "Summon the Council of the West."
      fnr_WESRE_settle_foederati.title: "Settle the Foederati"
      fnr_WESRE_settle_foederati.desc: "Grant frontier land to a band of our barbarian allies. They will defend it as their own, and remember who gave it to them."
      fnr_WESRE_settle_foederati.a: "Grant them the land."
      fnr_WESRE_settle_foederati_tt: "A random border location becomes a #Y Foederati Settlement#!. #Y Foederati loyalty#! rises by #G 3#! (#G 6#! with the #Y Foederati Chiefs#! privilege). Can be used again in 2 years."
      fnr_WESRE_restore_rome.title: "Restore the Eternal City"
      fnr_WESRE_restore_rome.desc: "Rome is still the heart of the faith and the memory of the Empire. Its basilicas, forums and walls can be made worthy of that name again."
      fnr_WESRE_restore_rome.a: "Restore Rome's holy places."
      fnr_WESRE_seat_of_ravenna.title: "The Seat of Ravenna"
      fnr_WESRE_seat_of_ravenna.desc: "Ravenna has kept the Empire alive. Let it be rebuilt as a true imperial seat, with palaces and churches to rival Constantinople."
      fnr_WESRE_seat_of_ravenna.a: "Build an imperial seat."
      fnr_WESRE_holy_site_tt: "While we own this city we keep its country bonus."

    # CASUS BELLI

      fnr_WESRE_cb_reconquer_gaul: "Reconquest of Gaul"
      fnr_WESRE_cb_reconquer_gaul_desc: "Gaul was Roman for five centuries. It will be Roman again."
      fnr_WESRE_cb_reconquer_hispania: "Reconquest of Hispania"
      fnr_WESRE_cb_reconquer_hispania_desc: "The provinces of Hispania gave Rome emperors. They will return to the Empire."
      fnr_WESRE_cb_reconquer_africa: "Reconquest of Africa"
      fnr_WESRE_cb_reconquer_africa_desc: "Africa was the granary of Rome. Its loss starved the West; its return will feed it."
      fnr_WESRE_reconquer_gaul_wargoal: "Reconquer Gaul"
      fnr_WESRE_reconquer_hispania_wargoal: "Reconquer Hispania"
      fnr_WESRE_reconquer_africa_wargoal: "Reconquer Africa"

    # INTERNATIONAL ORGANIZATION - Concilium Occidentis

      fnr_WESRE_concilium_io: "Concilium Occidentis"
      fnr_WESRE_concilium_io_name: "Concilium Occidentis"
      fnr_WESRE_concilium_io_created_tt: "Founds the #Y Concilium Occidentis#! with us as its permanent leader."
      fnr_WESRE_concilium_io_desc: "The Council of the West - a pragmatic alliance born of necessity rather than ideology. Where the Eastern Empire projects imperial grandeur, the Western Empire offers a defensive compact. Members defend one another against the barbarian tide, and the Emperor's authority grows with every realm that joins."
      fnr_WESRE_concilium_io_list_who_tt: "$WHO$ is a member of [GetUniqueInternationalOrganization('fnr_WESRE_concilium_io').GetName] with $LIST$"
      diplomatic_status_fnr_WESRE_concilium_io_name: "Concilium Occidentis"
      diplomatic_status_fnr_WESRE_concilium_io_tooltip: "#T Concilium Occidentis#!\nThis [country|e] is a member of the Council of the West."
      io_opinion_fnr_WESRE_concilium_io: "Fellow member of the Concilium"

    # OPINIONS

      fnr_WESRE_church_taxed: "Taxed the Church"
      fnr_WESRE_defied_the_pope: "Defied the Pope"
      fnr_WESRE_foederati_pact: "Foederati pact"
      fnr_WESRE_paid_off: "Paid us off"
      fnr_WESRE_brothers_in_purple: "Brothers in the purple"
      fnr_WESRE_rebuffed_the_east: "Rebuffed the Eastern Emperor"
      fnr_WESRE_insulted_the_east: "Insulted the Eastern Emperor"

    # STATIC MODIFIERS

      STATIC_MODIFIER_NAME_fnr_WESRE_last_light: "The Last Light"
      STATIC_MODIFIER_DESC_fnr_WESRE_last_light: "The light is dying. We are the last candle. Ends with #Y Renovatio Occidentalis#!."
      STATIC_MODIFIER_NAME_fnr_WESRE_debased_coinage: "Debased Coinage"
      STATIC_MODIFIER_DESC_fnr_WESRE_debased_coinage: "Our solidi are more lead than gold, and every merchant knows it."
      STATIC_MODIFIER_NAME_fnr_WESRE_defender_of_rome: "Defender of Rome"
      STATIC_MODIFIER_DESC_fnr_WESRE_defender_of_rome: "The barbarian host broke against our legions."
      STATIC_MODIFIER_NAME_fnr_WESRE_frontier_collapse: "Frontier Collapse"
      STATIC_MODIFIER_DESC_fnr_WESRE_frontier_collapse: "The frontier has fallen and the provinces behind it are in panic."
      STATIC_MODIFIER_NAME_fnr_WESRE_barbarian_tribute: "Foederati Tribute"
      STATIC_MODIFIER_DESC_fnr_WESRE_barbarian_tribute: "We pay our new allies to fight for us instead of against us."
      STATIC_MODIFIER_NAME_fnr_WESRE_recalled_general: "Recalled General"
      STATIC_MODIFIER_DESC_fnr_WESRE_recalled_general: "The army misses its favorite commander."
      STATIC_MODIFIER_NAME_fnr_WESRE_assassination_scandal: "Assassination Scandal"
      STATIC_MODIFIER_DESC_fnr_WESRE_assassination_scandal: "Everyone knows who ordered the general's death."
      STATIC_MODIFIER_NAME_fnr_WESRE_papal_temporal_authority: "Papal Temporal Authority"
      STATIC_MODIFIER_DESC_fnr_WESRE_papal_temporal_authority: "The Pope rules lands of his own within the Empire, and takes a tithe from the rest."
      STATIC_MODIFIER_NAME_fnr_WESRE_aqueducts_neglected: "Dry Aqueducts"
      STATIC_MODIFIER_DESC_fnr_WESRE_aqueducts_neglected: "Without clean water, our cities sicken."
      STATIC_MODIFIER_NAME_fnr_WESRE_eastern_influence: "Eastern Influence"
      STATIC_MODIFIER_DESC_fnr_WESRE_eastern_influence: "Advisors, priests and gold from Constantinople are welcome at our court, and not all of them serve our interests."
      STATIC_MODIFIER_NAME_fnr_WESRE_front_gaul: "Gallic Front"
      STATIC_MODIFIER_DESC_fnr_WESRE_front_gaul: "Our legions march to reclaim Gaul."
      STATIC_MODIFIER_NAME_fnr_WESRE_front_hispania: "Hispanic Front"
      STATIC_MODIFIER_DESC_fnr_WESRE_front_hispania: "Our legions march to reclaim Hispania."
      STATIC_MODIFIER_NAME_fnr_WESRE_front_africa: "African Front"
      STATIC_MODIFIER_DESC_fnr_WESRE_front_africa: "Our fleets sail to reclaim Africa."
      STATIC_MODIFIER_NAME_fnr_WESRE_papal_blessing: "Papal Blessing"
