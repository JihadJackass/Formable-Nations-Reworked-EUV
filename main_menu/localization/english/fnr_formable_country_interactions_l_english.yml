l_english:

  ############################################
  # Country Interaction localiation Tooltips #
  ############################################

    # Empire of Japan IO

      invite_to_east_asian_sphere: "Invite to the Greater East Asia Co-Prosperity Sphere"
      invite_to_east_asian_sphere_desc: "Invite this nation to join the [GetInternationalOrganizationType('fnr_japan_greater_east_asia_io').GetName], offering protection from the Western powers and a place in the new order of Asia under Japanese leadership."
      invite_to_east_asian_sphere_reject_effect_text: "$generic_reject_offer_effect_string$"
      invite_to_east_asian_sphere_reject_effect_text_past: "$generic_reject_offer_effect_string_past$"
      invite_to_east_asian_sphere_act: "Invite [SCOPE.sCountry('recipient').GetName] to the Greater East Asia Co-Prosperity Sphere"
      invite_to_east_asian_sphere_effect_text_past: "[SCOPE.sCountry('recipient').GetName] has joined the Greater East Asia Co-Prosperity Sphere"

      dip_invite_to_east_asian_sphere_CATEGORY: "CATEGORY_INFLUENCE_ACTIONS"
      PROPOSE_invite_to_east_asian_sphere: "Would we like to invite $RECIPIENT$ to join the Greater East Asia Co-Prosperity Sphere?\n\n$INFO$"
      INCOMING_OFFER_invite_to_east_asian_sphere: "$ACTOR$ have invited us to join the Greater East Asia Co-Prosperity Sphere. Do we wish to accept?\n\n$INFO$"
      invite_to_east_asian_sphere_effect_text: "[SCOPE.sCountry('recipient').GetName] joins the Greater East Asia Co-Prosperity Sphere"
      WE_PERFORM_invite_to_east_asian_sphere_ACTION: "Invited to the Co-Prosperity Sphere"
      ACTION_invite_to_east_asian_sphere_PERFORMED_ON_US: "Invited to the Co-Prosperity Sphere"

    # Bactria IO

      fnr_invite_to_bactrian_synod: "Invite to the Bactrian Synod"
      fnr_invite_to_bactrian_synod_desc: "Extend an invitation to join the [GetInternationalOrganizationType('fnr_bactria_synod_io').GetName], binding this nation to the shared purpose of restoring Hellenic civilization under Bactrian leadership. Members of the Synod are expected to uphold the legacy of Alexander and submit to the guidance of the Synod's leader in matters of common interest."

      fnr_invite_to_bactrian_synod_reject_effect_text: "$generic_reject_offer_effect_string$"
      fnr_invite_to_bactrian_synod_reject_effect_text_past: "$generic_reject_offer_effect_string_past$"
      fnr_invite_to_bactrian_synod_act: "Invite [SCOPE.sCountry('recipient').GetName] to the Bactrian Synod"
      fnr_invite_to_bactrian_synod_effect_text_past: "[SCOPE.sCountry('recipient').GetName] has joined the Bactrian Synod"
      dip_fnr_invite_to_bactrian_synod_CATEGORY: "CATEGORY_INFLUENCE_ACTIONS"
      PROPOSE_fnr_invite_to_bactrian_synod: "Would we like to invite $RECIPIENT$ to join the Bactrian Synod?\n\n$INFO$"
      INCOMING_OFFER_fnr_invite_to_bactrian_synod: "$ACTOR$ have invited us to join the Bactrian Synod. Do we wish to accept?\n\n$INFO$"
      fnr_invite_to_bactrian_synod_effect_text: "[SCOPE.sCountry('recipient').GetName] joins the Bactrian Synod"
      WE_PERFORM_fnr_invite_to_bactrian_synod_ACTION: "Invited to the Bactrian Synod"
      ACTION_fnr_invite_to_bactrian_synod_PERFORMED_ON_US: "Invited to the Bactrian Synod"


