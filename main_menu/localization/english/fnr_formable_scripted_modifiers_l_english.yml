  # Great Moravia
  STATIC_MODIFIER_NAME_fnr_GMORV_family_in_cabinet_bonus: "Family in the Cabinet"
  STATIC_MODIFIER_DESC_fnr_GMORV_family_in_cabinet_bonus: "A kinsman of the ruling house sits in the royal council. Under the meritocratic succession of Great Moravia the crown is not handed down by blood alone, but a family that keeps its members close to power keeps its claim strong."

  # ERANSHAR
  STATIC_MODIFIER_NAME_fnr_ERSHR_vigilant_against_agitators: "Agitator Vigilance"
  STATIC_MODIFIER_DESC_fnr_ERSHR_vigilant_against_agitators: "A neighbouring Muslim power had been funding agents to inflame our subjects against the restored fire, but they have been hunted down and their network broken. While the reaction still burns, the crown stays watchful, and those who would turn the faithless against us find few willing ears and fewer safe places to hide."
