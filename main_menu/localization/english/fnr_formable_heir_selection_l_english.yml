l_english:

  # HEIR SELECTION LOCALIZATION

      # Great Moravia
      moravian_meritocratic_succession: "Moravian Meritocratic Succession"  
      moravian_meritocratic_succession_desc: "When Svätopluk I died, his three sons divided Great Moravia, leading to its destruction. We shall not repeat this mistake. Both male and female heirs may inherit, all educated in Nitra by the realm's finest scholars. Merit determines succession, ensuring the most capable rule. Yet family unity remains sacred: talented relatives shall serve in administration, preventing the destructive ambitions that once tore our realm apart."  

      # Netherlands
      fnr_dutch_republican_succession: "Dutch Republican Succession"
      fnr_dutch_republican_succession_desc: "Born from the traditions of the United Provinces, this peculiar arrangement blends hereditary rule with republican institutions. The Stadtholder reigns as a monarch in all but spirit, his authority tempered by the assemblies of the provinces and the merchant estates. Though republican in character, the state remains a crowned realm in the eyes of foreign courts and therefore our ruler is counted among the princes of Europe, and thus eligible to wear the Imperial crown of the Holy Roman Empire, should the Electors see fit."


