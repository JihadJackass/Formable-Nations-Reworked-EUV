l_english:

  ###########################################################
  # Pax Romana - The Ptolemaic Kingdom                      #
  ###########################################################

      STATIC_MODIFIER_NAME_fnr_PTLMY_crown_pharaoh: "Living Horus"
      STATIC_MODIFIER_DESC_fnr_PTLMY_crown_pharaoh: "The King is Pharaoh, son of Ra, crowned at Memphis and worshipped in every temple. The Greeks of Alexandria grumble.\n\n$fnr_PTLMY_crown_current$\n\n$fnr_PTLMY_crown_tiers$\n\n$fnr_PTLMY_crown_moves$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_crown_egyptian: "Lord of the Two Lands"
      STATIC_MODIFIER_DESC_fnr_PTLMY_crown_egyptian: "The court leans on the temples and the old ways of Egypt.\n\n$fnr_PTLMY_crown_current$\n\n$fnr_PTLMY_crown_tiers$\n\n$fnr_PTLMY_crown_moves$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_crown_dual: "The Double Crown"
      STATIC_MODIFIER_DESC_fnr_PTLMY_crown_dual: "Basileus to the Greeks and Pharaoh to the Egyptians, the King keeps both peoples content.\n\n$fnr_PTLMY_crown_current$\n\n$fnr_PTLMY_crown_tiers$\n\n$fnr_PTLMY_crown_moves$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_crown_greek: "Macedonian Court"
      STATIC_MODIFIER_DESC_fnr_PTLMY_crown_greek: "The court speaks Greek, and the Greek settlers run the kingdom's offices.\n\n$fnr_PTLMY_crown_current$\n\n$fnr_PTLMY_crown_tiers$\n\n$fnr_PTLMY_crown_moves$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_crown_basileus: "Basileus of Alexandria"
      STATIC_MODIFIER_DESC_fnr_PTLMY_crown_basileus: "The King is a Macedonian Basileus who rules Egypt from Alexandria. The Egyptian countryside seethes.\n\n$fnr_PTLMY_crown_current$\n\n$fnr_PTLMY_crown_tiers$\n\n$fnr_PTLMY_crown_moves$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_library_tier_1: "Scrolls Gathered"
      STATIC_MODIFIER_DESC_fnr_PTLMY_library_tier_1: "The first scrolls are gathered in the palace quarter.\n\n$fnr_PTLMY_scholarship_current$\n\n$fnr_PTLMY_library_tiers$\n\n$fnr_PTLMY_library_moves$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_library_tier_2: "A Growing Library"
      STATIC_MODIFIER_DESC_fnr_PTLMY_library_tier_2: "Scholars from across the Greek world come to Alexandria.\n\n$fnr_PTLMY_scholarship_current$\n\n$fnr_PTLMY_library_tiers$\n\n$fnr_PTLMY_library_moves$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_library_tier_3: "The Great Library"
      STATIC_MODIFIER_DESC_fnr_PTLMY_library_tier_3: "The greatest collection of books in the world.\n\n$fnr_PTLMY_scholarship_current$\n\n$fnr_PTLMY_library_tiers$\n\n$fnr_PTLMY_library_moves$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_library_tier_4: "Light of the World"
      STATIC_MODIFIER_DESC_fnr_PTLMY_library_tier_4: "Every learned man in the world has heard of Alexandria.\n\n$fnr_PTLMY_scholarship_current$\n\n$fnr_PTLMY_library_tiers$\n\n$fnr_PTLMY_library_moves$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_nile_bountiful: "A Bountiful Flood"
      STATIC_MODIFIER_DESC_fnr_PTLMY_nile_bountiful: "The Nile rose to sixteen cubits. Every field is watered, and the granaries will overflow.\n\n$fnr_PTLMY_granary_current$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_nile_good: "A Good Flood"
      STATIC_MODIFIER_DESC_fnr_PTLMY_nile_good: "The Nile rose as it should.\n\n$fnr_PTLMY_granary_current$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_nile_low: "A Low Flood"
      STATIC_MODIFIER_DESC_fnr_PTLMY_nile_low: "The Nile did not rise far enough, and the high fields are dry.\n\n$fnr_PTLMY_granary_current$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_nile_failed: "The Nile Failed"
      STATIC_MODIFIER_DESC_fnr_PTLMY_nile_failed: "The flood failed. Famine stalks the villages of Egypt.\n\n$fnr_PTLMY_granary_current$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_nile_granaries_opened: "The Granaries Opened"
      STATIC_MODIFIER_DESC_fnr_PTLMY_nile_granaries_opened: "The flood failed, but the royal granaries feed the people.\n\n$fnr_PTLMY_granary_current$"
      STATIC_MODIFIER_NAME_fnr_PTLMY_origin_greek: "Heirs of the Diadochi"
      STATIC_MODIFIER_DESC_fnr_PTLMY_origin_greek: "Greeks rule in Alexandria again, as Ptolemy Soter's heirs did."
      STATIC_MODIFIER_NAME_fnr_PTLMY_origin_egyptian: "Pharaohs in Greek Robes"
      STATIC_MODIFIER_DESC_fnr_PTLMY_origin_egyptian: "An Egyptian dynasty has taken up the Greek court and the name of Ptolemy."
      STATIC_MODIFIER_NAME_fnr_PTLMY_origin_bactrian: "The Bactrian Restoration"
      STATIC_MODIFIER_DESC_fnr_PTLMY_origin_bactrian: "The House of Ptolemy was restored by the Hellenes of Bactria, as old friends of Alexander's heirs."
      STATIC_MODIFIER_NAME_fnr_PTLMY_epithet_soter: "Soter"
      STATIC_MODIFIER_DESC_fnr_PTLMY_epithet_soter: "The Saviour. The King defends Egypt with the sword."
      STATIC_MODIFIER_NAME_fnr_PTLMY_epithet_philadelphos: "Philadelphos"
      STATIC_MODIFIER_DESC_fnr_PTLMY_epithet_philadelphos: "Sibling-Loving. The King has married his sister, as the Pharaohs did."
      STATIC_MODIFIER_NAME_fnr_PTLMY_epithet_euergetes: "Euergetes"
      STATIC_MODIFIER_DESC_fnr_PTLMY_epithet_euergetes: "The Benefactor. The King is generous to the temples and the poor."
      STATIC_MODIFIER_NAME_fnr_PTLMY_epithet_philopator: "Philopator"
      STATIC_MODIFIER_DESC_fnr_PTLMY_epithet_philopator: "Father-Loving. The King honours his father's memory and continues his works."
      STATIC_MODIFIER_NAME_fnr_PTLMY_epithet_epiphanes: "Epiphanes"
      STATIC_MODIFIER_DESC_fnr_PTLMY_epithet_epiphanes: "God Manifest. The priests have crowned the King as a living god."
      STATIC_MODIFIER_NAME_fnr_PTLMY_epithet_thea_philopator: "Thea Philopator"
      STATIC_MODIFIER_DESC_fnr_PTLMY_epithet_thea_philopator: "Father-Loving Goddess. The Queen rules in her own right, as wise as she is ambitious."
      STATIC_MODIFIER_NAME_fnr_PTLMY_greek_scholars: "Greek Scholars at Court"
      STATIC_MODIFIER_DESC_fnr_PTLMY_greek_scholars: "Greek scholars teach at the court."
      STATIC_MODIFIER_NAME_fnr_PTLMY_new_polis: "A New Polis"
      STATIC_MODIFIER_DESC_fnr_PTLMY_new_polis: "A new Greek city has been founded on the Nile."
      STATIC_MODIFIER_NAME_fnr_PTLMY_ships_searched: "Ships Searched for Books"
      STATIC_MODIFIER_DESC_fnr_PTLMY_ships_searched: "Every ship in Alexandria's harbour is searched, and its books copied. The merchants are not pleased."
      STATIC_MODIFIER_NAME_fnr_PTLMY_canal_of_the_pharaohs: "The Canal of the Pharaohs"
      STATIC_MODIFIER_DESC_fnr_PTLMY_canal_of_the_pharaohs: "The canal from the Nile to the Red Sea is open again."
      STATIC_MODIFIER_NAME_fnr_PTLMY_co_rulers: "Co-Rulers"
      STATIC_MODIFIER_DESC_fnr_PTLMY_co_rulers: "Two Ptolemies share the throne. Neither trusts the other."
      STATIC_MODIFIER_NAME_fnr_PTLMY_rosetta_decree: "The Decree of Memphis"
      STATIC_MODIFIER_DESC_fnr_PTLMY_rosetta_decree: "A royal decree, carved in hieroglyphs, demotic and Greek, honours both peoples."
      STATIC_MODIFIER_NAME_fnr_PTLMY_greek_purge: "The Greeks Purged"
      STATIC_MODIFIER_DESC_fnr_PTLMY_greek_purge: "The Greek courtiers have been driven from the palace."
      STATIC_MODIFIER_NAME_fnr_PTLMY_ptolemaieia: "The Ptolemaieia"
      STATIC_MODIFIER_DESC_fnr_PTLMY_ptolemaieia: "The great festival of the Ptolemies has been held."
      STATIC_MODIFIER_NAME_fnr_PTLMY_nesiotic_levy: "Nesiotic Levy"
      STATIC_MODIFIER_DESC_fnr_PTLMY_nesiotic_levy: "The islands send their ships and sailors."
      STATIC_MODIFIER_NAME_fnr_PTLMY_grain_gift: "Egyptian Grain"
      STATIC_MODIFIER_DESC_fnr_PTLMY_grain_gift: "Grain from the King of Egypt feeds our people."
      STATIC_MODIFIER_NAME_fnr_PTLMY_island_garrison: "Ptolemaic Garrison"
      STATIC_MODIFIER_DESC_fnr_PTLMY_island_garrison: "Ptolemaic soldiers hold our walls."
      STATIC_MODIFIER_NAME_fnr_PTLMY_amicus_populi_romani: "Friend and Ally of the Roman People"
      STATIC_MODIFIER_DESC_fnr_PTLMY_amicus_populi_romani: "Rome calls us friend and ally."
      STATIC_MODIFIER_NAME_fnr_PTLMY_egyptian_friendship: "Friendship of Egypt"
      STATIC_MODIFIER_DESC_fnr_PTLMY_egyptian_friendship: "The King of Egypt is our friend, and his grain ships sail to our ports."
      STATIC_MODIFIER_NAME_fnr_PTLMY_lagid_roman_union: "The Lagid and Roman Houses United"
      STATIC_MODIFIER_DESC_fnr_PTLMY_lagid_roman_union: "The houses of Ptolemy and of Rome are joined by marriage."
      STATIC_MODIFIER_NAME_fnr_PTLMY_grain_fleet: "The Grain Fleet"
      STATIC_MODIFIER_DESC_fnr_PTLMY_grain_fleet: "The grain fleet from Alexandria has arrived."
      STATIC_MODIFIER_NAME_fnr_PTLMY_elements: "Euclid's Elements"
      STATIC_MODIFIER_DESC_fnr_PTLMY_elements: "Every truth of geometry, proven from five postulates."
      STATIC_MODIFIER_NAME_fnr_PTLMY_measured_world: "The World Measured"
      STATIC_MODIFIER_DESC_fnr_PTLMY_measured_world: "Eratosthenes has measured the circumference of the Earth."
      STATIC_MODIFIER_NAME_fnr_PTLMY_anatomy: "The Physicians of Alexandria"
      STATIC_MODIFIER_DESC_fnr_PTLMY_anatomy: "The physicians of the Mouseion study the body as no one has before."
      STATIC_MODIFIER_NAME_fnr_PTLMY_septuagint: "The Seventy Translators"
      STATIC_MODIFIER_DESC_fnr_PTLMY_septuagint: "The scriptures of every people are translated into Greek, and every faith is respected in Alexandria."
      STATIC_MODIFIER_NAME_fnr_PTLMY_heron_engines: "The Engines of Heron"
      STATIC_MODIFIER_DESC_fnr_PTLMY_heron_engines: "The engineers of Alexandria build machines that move by steam and by water."
      STATIC_MODIFIER_NAME_fnr_PTLMY_philanthropa: "The Philanthropa Decrees"
      STATIC_MODIFIER_DESC_fnr_PTLMY_philanthropa: "A royal amnesty forgives debts and old crimes."
      STATIC_MODIFIER_NAME_fnr_PTLMY_thebaid_pacified: "The Thebaid Pacified"
      STATIC_MODIFIER_DESC_fnr_PTLMY_thebaid_pacified: "Upper Egypt is quiet again, and the King has learned its lesson."
      STATIC_MODIFIER_NAME_fnr_PTLMY_temple_strike: "The Temples Closed"
      STATIC_MODIFIER_DESC_fnr_PTLMY_temple_strike: "The priests of the Thebaid have closed their temples to the King."
      STATIC_MODIFIER_NAME_fnr_PTLMY_settlers_flee: "Greek Settlers Flee"
      STATIC_MODIFIER_DESC_fnr_PTLMY_settlers_flee: "Greek settlers flee the countryside for Alexandria."
      fnr_PTLMY_crown_greek_5_tt: "#Y Basileus and Pharaoh#! moves #Y 5#! towards the #Y Basileus#!"
      fnr_PTLMY_crown_greek_10_tt: "#Y Basileus and Pharaoh#! moves #Y 10#! towards the #Y Basileus#!"
      fnr_PTLMY_crown_greek_15_tt: "#Y Basileus and Pharaoh#! moves #Y 15#! towards the #Y Basileus#!"
      fnr_PTLMY_crown_greek_20_tt: "#Y Basileus and Pharaoh#! moves #Y 20#! towards the #Y Basileus#!"
      fnr_PTLMY_crown_egyptian_5_tt: "#Y Basileus and Pharaoh#! moves #Y 5#! towards the #Y Pharaoh#!"
      fnr_PTLMY_crown_egyptian_10_tt: "#Y Basileus and Pharaoh#! moves #Y 10#! towards the #Y Pharaoh#!"
      fnr_PTLMY_crown_egyptian_15_tt: "#Y Basileus and Pharaoh#! moves #Y 15#! towards the #Y Pharaoh#!"
      fnr_PTLMY_crown_egyptian_20_tt: "#Y Basileus and Pharaoh#! moves #Y 20#! towards the #Y Pharaoh#!"
      fnr_PTLMY_scholarship_plus_5_tt: "#Y Scholarship#! #G +5#!"
      fnr_PTLMY_scholarship_plus_10_tt: "#Y Scholarship#! #G +10#!"
      fnr_PTLMY_scholarship_plus_15_tt: "#Y Scholarship#! #G +15#!"
      fnr_PTLMY_scholarship_plus_20_tt: "#Y Scholarship#! #G +20#!"
      fnr_PTLMY_scholarship_plus_30_tt: "#Y Scholarship#! #G +30#!"
      fnr_PTLMY_crown_to_balance_tt: "#Y Basileus and Pharaoh#! moves halfway back towards the #Y Double Crown#!"
      fnr_PTLMY_invite_greek_scholars.title: "Invite the Greek Scholars"
      fnr_PTLMY_invite_greek_scholars.desc: "Alexandria was built by Greeks, and its ruins are still full of Greek books. Let scholars from Constantinople, Crete and the islands come to our court and teach our sons the language of Ptolemy."
      fnr_PTLMY_invite_greek_scholars.a: "Open the court to them."
      fnr_PTLMY_invite_greek_scholars_tt: "In #Y 5#! years we can adopt #Y A Greek Court at Alexandria#!, and then form the #Y Ptolemaic Kingdom#!."
      fnr_PTLMY_greek_court.title: "A Greek Court at Alexandria"
      fnr_PTLMY_greek_court.desc: "Our sons speak Greek, our clerks write it, and the scholars say the King should too. Let the court move to Alexandria, take Greek names and Greek manners, and claim the throne of the Ptolemies."
      fnr_PTLMY_greek_court.a: "We are the heirs of Ptolemy."
      fnr_PTLMY_greek_court_tt: "We can now form the #Y Ptolemaic Kingdom#! even though we are not Greek."
      fnr_PTLMY_crowned_at_memphis.title: "Crowned at Memphis"
      fnr_PTLMY_crowned_at_memphis.desc: "In the old capital, the high priest of Ptah places the double crown of Upper and Lower Egypt on the King's head, and names him son of Ra and Living Horus. The Greeks call it a costume. The Egyptians call it the truth.\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY_crowned_at_memphis.a: "Wear the double crown."
      fnr_PTLMY_found_greek_polis.title: "Found a Greek Polis"
      fnr_PTLMY_found_greek_polis.desc: "Like Ptolemais Hermiou in the south, a new city with Greek laws, a gymnasium and a council can be planted on the Nile, and settled with veterans and colonists.\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY_found_greek_polis.a: "Lay out the streets."
      fnr_PTLMY_honor_the_temples.title: "Honor the Temples"
      fnr_PTLMY_honor_the_temples.desc: "The great temples of Edfu, Dendera and Philae were built by Ptolemies. Let the King build again, and have himself carved on the walls making offerings to the gods.\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY_honor_the_temples.a: "Endow the temples."
      fnr_PTLMY_decree_of_memphis.title: "The Decree of Memphis"
      fnr_PTLMY_decree_of_memphis.desc: "A synod of priests and the King's Greek ministers will draw up one decree honouring both peoples, and carve it on stone in hieroglyphs, in demotic and in Greek, to be set up in every temple of Egypt.\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY_decree_of_memphis.a: "Carve it in three scripts."
      fnr_PTLMY_invite_great_scholar.title: "Invite a Great Scholar"
      fnr_PTLMY_invite_great_scholar.desc: "The Kings of Egypt pay scholars to do nothing but think. The best minds of the age can be tempted to the Mouseion with a stipend, a house and free meals for life.\n\n$fnr_PTLMY_scholarship_current$"
      fnr_PTLMY_invite_great_scholar.a: "Make him an offer."
      fnr_PTLMY_search_the_ships.title: "The Books of the Ships"
      fnr_PTLMY_search_the_ships.desc: "Ptolemy Euergetes ordered every ship in Alexandria's harbour searched for books. The books went to the Library; the owners got copies back, if they were lucky.\n\n$fnr_PTLMY_scholarship_current$"
      fnr_PTLMY_search_the_ships.a: "Search every ship."
      fnr_PTLMY_fill_granaries.title: "Fill the Royal Granaries"
      fnr_PTLMY_fill_granaries.desc: "The flood was good. Store the surplus in the royal granaries, so that when the Nile fails, as it always does in the end, Egypt will not starve.\n\n$fnr_PTLMY_granary_current$"
      fnr_PTLMY_fill_granaries.a: "Fill them."
      fnr_PTLMY_granary_plus_tt: "#Y Royal Granaries#! #G +1#!"
      fnr_PTLMY_canal_of_the_pharaohs.title: "The Canal of the Pharaohs"
      fnr_PTLMY_canal_of_the_pharaohs.desc: "Necho began it, Darius finished it and Ptolemy Philadelphos cleared it again - a canal from the Nile to the Red Sea, carrying ships and water to the eastern desert."
      fnr_PTLMY_canal_of_the_pharaohs.a: "Dig it out again."
      fnr_PTLMY_canal_tt: "The canal also waters the eastern fields, so a #Y bountiful flood#! becomes likelier and a #R failed#! one rarer."
      fnr_PTLMY_found_nesiotic_league.title: "Found the League of the Islanders"
      fnr_PTLMY_found_nesiotic_league.desc: "The Koinon of the Nesiotes, the league of the Aegean islands, once honoured the Ptolemies as its protectors and held games in their name. With a foothold beyond Egypt, it can be revived under our presidency."
      fnr_PTLMY_found_nesiotic_league.a: "Call the islands to Delos."
      fnr_PTLMY.1.title: "The House of Ptolemy"
      fnr_PTLMY.1.a: "Basileus of the Greeks."
      fnr_PTLMY.1.b: "Pharaoh of the Two Lands."
      fnr_PTLMY.1.c: "Both, as Ptolemy was."
      fnr_PTLMY.1.desc.greek: "Seventeen centuries after Alexander's general took Egypt for himself, Greeks rule in Alexandria again. The city's harbour, its ruined Mouseion and its ancient name are ours, and so is the question every Ptolemy faced - to rule as a Macedonian king over a conquered land, or as Pharaoh over his own people.\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY.1.desc.egyptian: "Our court speaks Greek now, our sons read Euclid, and we have taken the name of the old dynasty that ruled from Alexandria. The priests call our King Pharaoh, the scholars call him Basileus. Both will want to be listened to.\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY.1.desc.bactrian: "The Hellenes of Bactria, heirs of Alexander's eastern colonists, have restored the House of Ptolemy to the throne of Egypt. A Greek king sits in Alexandria again, a friend of the distant Bactrians, and must now win over a land of Egyptian priests and peasants.\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY.2.title: "Restoring the House of Ptolemy"
      fnr_PTLMY.2.a: "Restore the Ptolemies."
      fnr_PTLMY.2.desc: "Alexandria is ours, and with it the tomb of Alexander and the ruins of the Ptolemies' city. The Synod proposes that a Greek prince of our court be crowned King of Egypt, as Ptolemy Soter was, to rule the Nile as our friend and vassal and to bring the Greek learning of the West and East together again."
      fnr_PTLMY_bactrian_restoration_tt: "Our lands in #Y Egypt#! and #Y Cyrenaica#! become the #Y Ptolemaic Kingdom#!, ruled by a Greek king of our faith, as our #Y vassal#!."
      fnr_PTLMY.10.title: "Unrest in the Thebaid"
      fnr_PTLMY.10.a: "Crush them."
      fnr_PTLMY.10.b: "Hear the priests' complaints."
      fnr_PTLMY.10.desc: "In the south, far from Alexandria, the priests of Amun whisper that the Greek king is no Pharaoh. A man of Thebes has been crowned in a temple courtyard as a native king, and the villages of the Thebaid are rising to follow him.\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY_native_revolt_tt: "A #R native Pharaoh#! raises up to four provinces of #Y Upper Egypt#! against us."
      fnr_PTLMY.11.title: "The Alexandrian Mob"
      fnr_PTLMY.11.a: "Appease the Greeks."
      fnr_PTLMY.11.b: "Purge the Greek courtiers."
      fnr_PTLMY.11.desc: "The Greeks of Alexandria have always thought themselves the masters of Egypt, and the mob of Alexandria has dragged more than one Ptolemy from his palace. Now that the King prays in Egyptian temples and wears the double crown, they are in the streets again, and they want blood.\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY.12.title: "The Cult of Serapis"
      fnr_PTLMY.12.a: "Raise a Serapeum."
      fnr_PTLMY.12.b: "Leave the gods to the priests."
      fnr_PTLMY.12.desc: "The first Ptolemy gave his two peoples one god - Serapis, Osiris and Apis in the robes and beard of Zeus. Greeks and Egyptians worshipped him side by side. A new Serapeum could do the same today.\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY.20.title: "Euclid's Elements"
      fnr_PTLMY.20.a: "Copy it for the Library."
      fnr_PTLMY.20.desc: "A scholar of the Mouseion has finished a work that proves every truth of geometry from five postulates. Students are already copying it.\n\n$fnr_PTLMY_scholarship_current$"
      fnr_PTLMY.21.title: "Eratosthenes Measures the World"
      fnr_PTLMY.21.a: "Copy it for the Library."
      fnr_PTLMY.21.desc: "The Librarian has compared the shadows at Syene and Alexandria on midsummer day, and worked out the size of the Earth. Our sea captains are very interested.\n\n$fnr_PTLMY_scholarship_current$"
      fnr_PTLMY.22.title: "The Physicians of Alexandria"
      fnr_PTLMY.22.a: "Copy it for the Library."
      fnr_PTLMY.22.desc: "The physicians of the Mouseion have been given leave to study the dead, and have learned more of the body in a few years than the Greeks did in centuries.\n\n$fnr_PTLMY_scholarship_current$"
      fnr_PTLMY.23.title: "The Seventy Translators"
      fnr_PTLMY.23.a: "Copy it for the Library."
      fnr_PTLMY.23.desc: "Seventy scholars, shut up on the island of Pharos, have translated the scriptures of the Jews into Greek. The Library now asks every people for its holy books, and every faith is welcome in Alexandria.\n\n$fnr_PTLMY_scholarship_current$"
      fnr_PTLMY.24.title: "The Engines of Heron"
      fnr_PTLMY.24.a: "Copy it for the Library."
      fnr_PTLMY.24.desc: "An engineer of the Mouseion has built a sphere that spins by steam, doors that open by themselves and a fire engine for the city. Some say these toys could change the world.\n\n$fnr_PTLMY_scholarship_current$"
      fnr_PTLMY.25.title: "A Scholar at the Harbour"
      fnr_PTLMY.25.a: "Give him a stipend."
      fnr_PTLMY.25.b: "We have enough scholars."
      fnr_PTLMY.25.desc: "A ship from Rhodes has brought a scholar with a trunk full of books and a letter of introduction. He would like a place at the Mouseion.\n\n$fnr_PTLMY_scholarship_current$"
      fnr_PTLMY.30.title: "A Bountiful Flood"
      fnr_PTLMY.30.a: "Praise Hapi."
      fnr_PTLMY.30.desc: "The Nilometer at Elephantine reads sixteen cubits. The whole valley is under water, and when it falls there will be grain enough for Egypt and to spare. This is the year to fill the royal granaries.\n\n$fnr_PTLMY_granary_current$"
      fnr_PTLMY.31.title: "The Nile Fails"
      fnr_PTLMY.31.a: "Pray for next year."
      fnr_PTLMY.31.desc: "The flood did not come. The high fields are cracked and dry, and the royal granaries are empty. There will be hunger in Egypt this year, and hungry people listen to rebels.\n\n$fnr_PTLMY_granary_current$"
      fnr_PTLMY.32.title: "The Granaries Are Opened"
      fnr_PTLMY.32.a: "Feed the people."
      fnr_PTLMY.32.desc: "The flood failed, but the King's granaries were full. The grain is handed out in every nome, and the people bless the King's foresight.\n\n$fnr_PTLMY_granary_current$"
      fnr_PTLMY.40.title: "A New Ptolemy"
      fnr_PTLMY.40.a: "Soter, the Saviour."
      fnr_PTLMY.40.b: "Philadelphos, who married his sister."
      fnr_PTLMY.40.c: "Euergetes, the Benefactor."
      fnr_PTLMY.40.d: "Philopator, who honours his father."
      fnr_PTLMY.40.e: "Epiphanes, God Manifest."
      fnr_PTLMY.40.f: "Thea Philopator, the Queen."
      fnr_PTLMY.40.desc: "Every Ptolemy is named Ptolemy, and every Cleopatra is named Cleopatra. What tells them apart is the epithet the court and the priests give each one at the coronation. The new ruler's will last the whole reign."
      fnr_PTLMY.41.title: "The Rival Sibling"
      fnr_PTLMY.41.a: "Share the throne."
      fnr_PTLMY.41.b: "Drive them out of Alexandria."
      fnr_PTLMY.41.c: "Buy them a comfortable exile."
      fnr_PTLMY.41.desc: "The new ruler has a brother, or a sister, who thinks the throne should have been theirs. Half the court and the whole Alexandrian mob agree. It would not be the first time two Ptolemies fought over Egypt."
      fnr_PTLMY_lagid_war_tt: "The rival raises up to four provinces of #Y Lower Egypt#! as a #R Lagid pretender#!."
      fnr_PTLMY.50.title: "Aegyptus Provincia"
      fnr_PTLMY.50.a: "Make Egypt a province."
      fnr_PTLMY.50.b: "Leave the Ptolemies their crown."
      fnr_PTLMY.50.desc: "Egypt is ruled by a king who owes his throne to us, and its grain feeds Rome. Augustus made Egypt his own province, governed by a prefect who answered to him alone. Some senators say it is time to do the same."
      fnr_PTLMY_aegyptus_tt: "The #Y Ptolemaic Kingdom#! is annexed into Rome."
      fnr_PTLMY.60.title: "The Revolt of the Thebaid"
      fnr_PTLMY.60.a: "Restore order."
      fnr_PTLMY.60.desc: "The whole of Upper Egypt has risen. Native Pharaohs are crowned at Thebes, Greek settlers are murdered in their fields and the tax collectors have fled to Alexandria. The south will not be ruled by a Macedonian king."
      fnr_PTLMY_thebaid_tt: "#T The Revolt of the Thebaid#!\nA #R native Pharaoh#! raises #Y Upper Egypt#!. The revolt ends after at least #Y 5#! years once #Y Basileus and Pharaoh#! is below #Y 50#! and every rebel is beaten, or after #Y 15#! years whatever happens."
      fnr_PTLMY.61.title: "The Temples Close"
      fnr_PTLMY.61.a: "Reopen them by force."
      fnr_PTLMY.61.b: "Meet their demands."
      fnr_PTLMY.61.desc: "The priests of the Thebaid have closed their temples to the King's officials. No offerings will be made in his name until the soldiers leave the south."
      fnr_PTLMY.62.title: "Greek Settlers Flee"
      fnr_PTLMY.62.a: "Let them come to Alexandria."
      fnr_PTLMY.62.b: "Order them back to their farms."
      fnr_PTLMY.62.desc: "The Greek kleruchs, the veteran settlers of the countryside, are abandoning their land grants and crowding into the cities."
      fnr_PTLMY.63.title: "The Philanthropa"
      fnr_PTLMY.63.a: "Issue the amnesty."
      fnr_PTLMY.63.b: "No mercy for rebels."
      fnr_PTLMY.63.desc: "The King's ministers propose the Philanthropa, the 'kindnesses' - a decree forgiving the debts of the peasants, the crimes of the rebels who lay down their arms and the arrears of the temples.\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY.64.title: "The Thebaid Pacified"
      fnr_PTLMY.64.a: "Egypt is one again."
      fnr_PTLMY.64.desc: "The last native Pharaoh is dead or fled to Nubia, and the Thebaid has submitted. The King has learned that Egypt cannot be ruled by Greeks alone."
      fnr_PTLMY_revolt_of_the_thebaid: "The Revolt of the Thebaid"
      fnr_PTLMY_revolt_of_the_thebaid_desc: "The Egyptians of the south will not be ruled by a Greek court that despises them. Native Pharaohs are crowned in the temples of Thebes, and the whole of Upper Egypt is in arms."
      fnr_PTLMY_rebels_gone_tt: "No #Y native Pharaoh#! or #Y Lagid pretender#! is still gathering in our lands"
      fnr_PTLMY_panel_crown_title: "Basileus and Pharaoh"
      fnr_PTLMY_panel_crown_desc: "Bring it below 50"
      fnr_PTLMY_panel_revolt_title: "The Revolt"
      fnr_PTLMY_panel_revolt_desc: "Lasts at least 60 months"
      fnr_PTLMY_panel_months_value: "[GetPlayer.MakeScope.GetVariable('fnr_PTLMY_revolt_months').GetValue|0] months"
      fnr_PTLMY_nesiotic_league: "The League of the Islanders"
      fnr_PTLMY_nesiotic_league_desc: "The Koinon ton Nesioton, the league of the islands, honours the Ptolemies as its protectors and holds the Ptolemaieia games in their name.\n\n#T How it works#!\n- #Y Who can join#! - any subject of the Ptolemaic Kingdom, and any country with its capital in the Aegean islands, Cilicia and Cyprus, Cyrenaica or the Levant. Our subjects join automatically.\n- #Y Defense#! - members are called into each other's defensive wars.\n- #Y Members#! gain defense and trade, and think better of us.\n- #Y The Ptolemaic Kingdom#! gains naval strength, plus trade and prestige for every member, up to 8.\n- #Y Actions#! (the Actions tab of this panel) - #Y the Ptolemaieia#!, #Y Levy the Islands#!, and for a single member #Y Send Grain#!, #Y Garrison the Island#! or #Y Incorporate#!."
      fnr_PTLMY_nesiotic_league_list_who_tt: "$WHO$ is a member of [GetUniqueInternationalOrganization('fnr_PTLMY_nesiotic_league').GetName] with $LIST$"
      io_opinion_fnr_PTLMY_nesiotic_league: "Fellow Islander"
      fnr_PTLMY_sworn_islander: "Sworn to the League"
      fnr_PTLMY_league_reason_subject: "Subject of the Ptolemies"
      fnr_PTLMY_league_created_tt: "The #Y League of the Islanders#! is founded, with us as its permanent president. Our subjects join automatically."
      fnr_PTLMY_league_ptolemaieia: "The Ptolemaieia"
      fnr_PTLMY_league_ptolemaieia_desc: "Hold the great games of the Ptolemies at Alexandria, with envoys from every member. Every member gains #Y The Ptolemaieia#! for 5 years. Peace only, every 5 years, 100 gold."
      fnr_PTLMY_league_levy: "Levy the Islands"
      fnr_PTLMY_league_levy_desc: "Call up the ships and sailors of the islands. Every member gains #Y Nesiotic Levy#! for 2 years. War only, every 10 years."
      fnr_PTLMY_league_send_grain: "Send Grain"
      fnr_PTLMY_league_send_grain_desc: "Ship Egyptian grain to one member - #Y Egyptian Grain#! for 5 years. Uses one #Y Royal Granaries#! reserve if we have one, otherwise 100 gold."
      fnr_PTLMY_league_garrison: "Garrison the Island"
      fnr_PTLMY_league_garrison_desc: "Station Ptolemaic soldiers in one member - #Y Ptolemaic Garrison#! for 20 years. 75 gold, every 10 years."
      fnr_PTLMY_league_incorporate: "Incorporate"
      fnr_PTLMY_league_incorporate_desc: "Peacefully absorb a member with fewer than 30 locations that thinks very highly of us (150 or more). Every 20 years."
      fnr_PTLMY_ptolemaieia_tt: "Every member of the #Y League of the Islanders#! gains #Y The Ptolemaieia#! for 5 years. Can be done again in 5 years."
      fnr_PTLMY_league_levy_tt: "Every member of the #Y League of the Islanders#!, including us, gains #Y Nesiotic Levy#! for 2 years. Can be done again in 10 years."
      fnr_PTLMY_granary_minus_tt: "#Y Royal Granaries#! #R -1#!"
      fnr_PTLMY_honoured_at_games: "Honoured at the Ptolemaieia"
      fnr_PTLMY_fed_by_egypt: "Fed by Egyptian Grain"
      fnr_PTLMY_protected_by_egypt: "Protected by Ptolemaic Soldiers"
      fnr_PTLMY_roman_amicitia: "Friend and Ally of the Roman People"
      fnr_PTLMY_lagid_marriage: "Joined by Marriage"
      fnr_PTLMY_grain_for_rome: "Sent the Grain Fleet"
      fnr_PTLMY_refused_rome: "Refused Rome"
      fnr_PTLMY_spurned_by_rome: "Spurned by Rome"
      fnr_PTLMY_seek_amicitia: "Seek Roman Amicitia"
      dip_fnr_PTLMY_seek_amicitia_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
      fnr_PTLMY_seek_amicitia_act: "Ask [SCOPE.sCountry('recipient').GetName] to name us Friend and Ally of the Roman People."
      fnr_PTLMY_seek_amicitia_desc: "Ask Rome to name us Friend and Ally of the Roman People. We gain #Y Friend and Ally of the Roman People#! and Rome gains #Y Friendship of Egypt#! for 25 years, and both think better of each other."
      fnr_PTLMY_seek_amicitia_effect_text: "[SCOPE.sCountry('recipient').GetName] names [SCOPE.sCountry('actor').GetName] Friend and Ally of the Roman People."
      fnr_PTLMY_seek_amicitia_effect_text_past: "[SCOPE.sCountry('recipient').GetName] named [SCOPE.sCountry('actor').GetName] Friend and Ally of the Roman People."
      fnr_PTLMY_seek_amicitia_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] refuses the friendship of [SCOPE.sCountry('actor').GetName]."
      fnr_PTLMY_seek_amicitia_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] refused the friendship of [SCOPE.sCountry('actor').GetName]."
      PROPOSE_fnr_PTLMY_seek_amicitia: "Ask $RECIPIENT$ for Roman Amicitia?\n$INFO$."
      INCOMING_OFFER_fnr_PTLMY_seek_amicitia: "$ACTOR$ asks to be named Friend and Ally of the Roman People. Their grain and their fleet would be at our service. Do we accept?\n\n$INFO$"
      INCOMING_OFFER_TITLE_fnr_PTLMY_seek_amicitia: "$fnr_PTLMY_seek_amicitia$"
      fnr_PTLMY_royal_marriage_rome: "A Queen for Rome"
      dip_fnr_PTLMY_royal_marriage_rome_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
      fnr_PTLMY_royal_marriage_rome_act: "Offer [SCOPE.sCountry('recipient').GetName] a marriage between our Queen and Rome's first man."
      fnr_PTLMY_royal_marriage_rome_desc: "Our Queen offers her hand to the ruler of Rome, or to the most powerful Roman of the age, as Cleopatra did. Both houses gain #Y The Lagid and Roman Houses United#! for 30 years. Our ruler must be a queen."
      fnr_PTLMY_royal_marriage_rome_effect_text: "The Queen of [SCOPE.sCountry('actor').GetName] marries into the ruling house of [SCOPE.sCountry('recipient').GetName]."
      fnr_PTLMY_royal_marriage_rome_effect_text_past: "The Queen of [SCOPE.sCountry('actor').GetName] married into the ruling house of [SCOPE.sCountry('recipient').GetName]."
      fnr_PTLMY_royal_marriage_rome_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] refuses the Queen's hand."
      fnr_PTLMY_royal_marriage_rome_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] refused the Queen's hand."
      PROPOSE_fnr_PTLMY_royal_marriage_rome: "Offer a royal marriage to $RECIPIENT$?\n$INFO$."
      INCOMING_OFFER_fnr_PTLMY_royal_marriage_rome: "The Queen of $ACTOR$ offers to join her house to ours by marriage. Egypt's wealth would be bound to Rome. Do we accept?\n\n$INFO$"
      INCOMING_OFFER_TITLE_fnr_PTLMY_royal_marriage_rome: "$fnr_PTLMY_royal_marriage_rome$"
      fnr_PTLMY_request_grain_fleet: "Request the Grain Fleet"
      dip_fnr_PTLMY_request_grain_fleet_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
      fnr_PTLMY_request_grain_fleet_act: "Ask [SCOPE.sCountry('recipient').GetName] to send the grain fleet to Rome."
      fnr_PTLMY_request_grain_fleet_desc: "Buy the surplus of the Nile. We pay 100 gold and gain #Y The Grain Fleet#! for 10 years. Egypt is far less willing after a poor flood."
      fnr_PTLMY_request_grain_fleet_effect_text: "[SCOPE.sCountry('recipient').GetName] sends the grain fleet to [SCOPE.sCountry('actor').GetName]."
      fnr_PTLMY_request_grain_fleet_effect_text_past: "[SCOPE.sCountry('recipient').GetName] sent the grain fleet to [SCOPE.sCountry('actor').GetName]."
      fnr_PTLMY_request_grain_fleet_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] keeps its grain."
      fnr_PTLMY_request_grain_fleet_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] kept its grain."
      PROPOSE_fnr_PTLMY_request_grain_fleet: "Request the grain fleet from $RECIPIENT$?\n$INFO$."
      INCOMING_OFFER_fnr_PTLMY_request_grain_fleet: "$ACTOR$ offers 100 gold for the grain fleet. Do we sell?\n\n$INFO$"
      INCOMING_OFFER_TITLE_fnr_PTLMY_request_grain_fleet: "$fnr_PTLMY_request_grain_fleet$"
      fnr_PTLMY_reason_grain: "Egypt's grain"
      fnr_PTLMY_reason_already_friends: "Already friends"
      fnr_PTLMY_reason_amicitia: "A Friend and Ally of Rome"
      fnr_PTLMY_reason_egypt_wealth: "The wealth of Egypt"
      fnr_PTLMY_reason_payment: "Paid in gold"
      fnr_PTLMY_reason_bad_harvest: "The Nile was poor"
      fnr_PTLMY_cb_syrian_wars: "The Syrian Wars"
      fnr_PTLMY_cb_syrian_wars_desc: "Coele-Syria, Cyprus, Cyrenaica and the islands belonged to the Ptolemies. Six Syrian Wars were fought for them, and there can be a seventh."
      fnr_PTLMY_cb_syrian_wars_valid_tt: "The target holds land in the #Y Levant#!, #Y Cilicia and Cyprus#!, #Y Cyrenaica#!, #Y Sinai#! or the #Y Aegean islands#!"
      war_goal_fnr_PTLMY_syrian_wars_wargoal: "The Syrian Wars"
      war_goal_fnr_PTLMY_syrian_wars_wargoal_desc: "Take the old Ptolemaic lands beyond Egypt."
      fnr_PTLMY_syrian_wars_locations_tt: "Lies in the old Ptolemaic lands beyond Egypt"
      PTLMY_ptolemaic_administration: "The Ptolemaic Administration"
      PTLMY_ptolemaic_administration_desc: "Egypt is divided into nomes, each with its strategos, its royal scribe and its tax farmers, and every field is surveyed after the flood."
      PTLMY_royal_economy: "The Royal Economy"
      PTLMY_royal_economy_desc: "The King owns the land, the oil, the papyrus and the beer. Every monopoly is leased, taxed and recorded.\n\nUnlocks the #Y Royal Economy#! law."
      PTLMY_mouseion: "The Mouseion"
      PTLMY_mouseion_desc: "The shrine of the Muses - a community of scholars paid by the King to study, teach and write.\n\nUnlocks the #Y Mouseion#! in Alexandria."
      PTLMY_phalanx: "The Macedonian Phalanx"
      PTLMY_phalanx_desc: "Pike walls of Macedonian settlers, drilled as Alexander's were.\n\nUnlocks the #Y Phalangites#!."
      PTLMY_pharos: "The Pharos"
      PTLMY_pharos_desc: "The great lighthouse of Alexandria, a wonder of the world, guides every ship into the harbour.\n\nUnlocks the #Y Pharos#! in Alexandria."
      PTLMY_nilometers: "The Nilometers"
      PTLMY_nilometers_desc: "Stairs cut into the riverbank measure the rise of the flood, and tell the King what taxes the harvest will bear.\n\nUnlocks the #Y Nilometer#!."
      PTLMY_great_library: "The Great Library"
      PTLMY_great_library_desc: "Every book in the world, copied and catalogued in Alexandria.\n\nUnlocks the #Y Great Library#! in Alexandria."
      PTLMY_ruler_cult: "The Cult of the Ptolemies"
      PTLMY_ruler_cult_desc: "The Ptolemies are gods - the Saviour Gods, the Sibling Gods, the Benefactor Gods.\n\nUnlocks the #Y Theoi Adelphoi#! government reform."
      PTLMY_light_of_alexandria: "The Light of Alexandria"
      PTLMY_light_of_alexandria_desc: "Alexandria is the capital of learning for the whole world again. Needs #Y 150#! Scholarship."
      fnr_PTLMY_pharaonic_kingship: "Pharaonic Kingship"
      fnr_PTLMY_pharaonic_kingship_desc: "The King rules as Pharaoh, son of Ra, through the temples and the old offices of Egypt. #Y Basileus and Pharaoh#! moves #Y 2#! a year towards the #Y Pharaoh#!."
      fnr_PTLMY_hellenistic_basileia: "Hellenistic Basileia"
      fnr_PTLMY_hellenistic_basileia_desc: "The King rules as a Macedonian Basileus, through his Friends, his army and his Greek ministers. #Y Basileus and Pharaoh#! moves #Y 2#! a year towards the #Y Basileus#!."
      fnr_PTLMY_theoi_adelphoi: "Theoi Adelphoi"
      fnr_PTLMY_theoi_adelphoi_desc: "The King and Queen are worshipped as the Sibling Gods in every temple, Greek and Egyptian."
      fnr_PTLMY_royal_economy_law: "The Royal Economy"
      fnr_PTLMY_royal_economy_law_desc: "Egypt is the King's estate. Who runs it for him?\n\n$fnr_PTLMY_crown_current$"
      fnr_PTLMY_royal_monopolies_policy: "Royal Monopolies"
      fnr_PTLMY_royal_monopolies_policy_desc: "The King owns the oil, the papyrus, the salt and the beer, and sells them at his own price."
      fnr_PTLMY_greek_tax_farmers_policy: "Greek Tax Farmers"
      fnr_PTLMY_greek_tax_farmers_policy_desc: "Greek bankers bid for the right to collect each tax. #Y Basileus and Pharaoh +1 a year#! towards the Basileus."
      fnr_PTLMY_temple_economy_policy: "The Temple Economy"
      fnr_PTLMY_temple_economy_policy_desc: "The temples manage the land and the granaries, as they did under the Pharaohs. #Y Basileus and Pharaoh -1 a year#!, towards the Pharaoh."
      fnr_PTLMY_kleruchoi: "The Kleruchoi"
      fnr_PTLMY_kleruchoi_desc: "Greek and Macedonian veterans hold land grants in return for military service. While granted, #Y Basileus and Pharaoh#! moves #Y 2#! a year towards the #Y Basileus#!."
      fnr_PTLMY_priests_of_ptah: "The High Priests of Ptah"
      fnr_PTLMY_priests_of_ptah_desc: "The high priests of Memphis crown the King and speak for the temples of Egypt. While granted, #Y Basileus and Pharaoh#! moves #Y 2#! a year towards the #Y Pharaoh#!."
      fnr_PTLMY_mouseion_scholars: "Scholars of the Mouseion"
      fnr_PTLMY_mouseion_scholars_desc: "The scholars of the Mouseion are fed at the King's table and pay no taxes. While granted, #Y Scholarship#! rises by #G 1#! more each year."
      fnr_PTLMY_machimoi: "The Machimoi"
      fnr_PTLMY_machimoi_desc: "Native Egyptian soldiers are armed and drilled like Macedonians. Unlocks the #Y Machimoi#!. While granted, #Y Basileus and Pharaoh#! moves #Y 1#! a year towards the #Y Pharaoh#!."
      fnr_PTLMY_phalangites_1: "Phalangites"
      fnr_PTLMY_phalangites_1_desc: "Macedonian settlers with long pikes, drilled to fight as one wall, as Alexander's phalanx did."
      fnr_PTLMY_phalangites_2: "Phalangites"
      fnr_PTLMY_phalangites_2_desc: "$fnr_PTLMY_phalangites_1_desc$"
      fnr_PTLMY_phalangites_3: "Phalangites"
      fnr_PTLMY_phalangites_3_desc: "$fnr_PTLMY_phalangites_1_desc$"
      fnr_PTLMY_phalangites_4: "Phalangites"
      fnr_PTLMY_phalangites_4_desc: "$fnr_PTLMY_phalangites_1_desc$"
      fnr_PTLMY_phalangites_5: "Phalangites"
      fnr_PTLMY_phalangites_5_desc: "$fnr_PTLMY_phalangites_1_desc$"
      fnr_PTLMY_phalangites_6: "Phalangites"
      fnr_PTLMY_phalangites_6_desc: "$fnr_PTLMY_phalangites_1_desc$"
      fnr_PTLMY_machimoi_1: "Machimoi"
      fnr_PTLMY_machimoi_1_desc: "The warrior class of Egypt, armed and drilled like Macedonians. They won Raphia for the Ptolemies."
      fnr_PTLMY_machimoi_2: "Machimoi"
      fnr_PTLMY_machimoi_2_desc: "$fnr_PTLMY_machimoi_1_desc$"
      fnr_PTLMY_machimoi_3: "Machimoi"
      fnr_PTLMY_machimoi_3_desc: "$fnr_PTLMY_machimoi_1_desc$"
      fnr_PTLMY_machimoi_4: "Machimoi"
      fnr_PTLMY_machimoi_4_desc: "$fnr_PTLMY_machimoi_1_desc$"
      fnr_PTLMY_machimoi_5: "Machimoi"
      fnr_PTLMY_machimoi_5_desc: "$fnr_PTLMY_machimoi_1_desc$"
      fnr_PTLMY_machimoi_6: "Machimoi"
      fnr_PTLMY_machimoi_6_desc: "$fnr_PTLMY_machimoi_1_desc$"
      fnr_PTLMY_mouseion: "The Mouseion"
      fnr_PTLMY_mouseion_desc: "The shrine of the Muses, where the King's scholars live, study and teach. Alexandria only. #Y Scholarship#! #G +2#! a year."
      fnr_PTLMY_mouseion_maintenance: "The Mouseion Upkeep"
      fnr_PTLMY_great_library: "The Great Library"
      fnr_PTLMY_great_library_desc: "The greatest library in the world. Alexandria only, needs the Mouseion. #Y Scholarship#! #G +3#! a year."
      fnr_PTLMY_great_library_maintenance: "The Great Library Upkeep"
      fnr_PTLMY_pharos: "The Pharos"
      fnr_PTLMY_pharos_desc: "The lighthouse of Alexandria, one of the wonders of the world. Alexandria only."
      fnr_PTLMY_pharos_maintenance: "The Pharos Upkeep"
      fnr_PTLMY_nilometer: "Nilometer"
      fnr_PTLMY_nilometer_desc: "A stair of measured steps cut down to the river. With one or more, a #Y bountiful flood#! is likelier and a #R failed#! one rarer; with two or more and the Canal of the Pharaohs, even more so."
      fnr_PTLMY_nilometer_maintenance: "Nilometer Upkeep"
      hint_fnr_PTLMY_crown: "Basileus and Pharaoh"
      hint_fnr_PTLMY_crown_hint_text: "$hint_fnr_PTLMY_crown_text_1$\n\n$fnr_PTLMY_crown_current$\n\n$fnr_PTLMY_crown_tiers$\n\n$fnr_PTLMY_crown_moves$\n\n$hint_fnr_PTLMY_crown_text_2$"
      hint_fnr_PTLMY_crown_text_1: "The Ptolemies ruled two peoples. #Y Basileus and Pharaoh#! runs from #Y -100#!, a King who is wholly Pharaoh, to #Y +100#!, a King who is wholly a Macedonian Basileus. It always appears among our country modifiers as one of five tiers, and hovering it shows the current value."
      hint_fnr_PTLMY_crown_text_2: "@hint! #T The extremes#!\nAt #R 60#! or more the Thebaid may rise under a native Pharaoh, and at #R 75#! the #Y Revolt of the Thebaid#! can begin. At #R -60#! or less the Alexandrian mob riots. The #Y Decree of Memphis#! pulls the crown halfway back to the middle."
      hint_fnr_PTLMY_crown_diplomatic: "$hint_advisor_salute_diplomatic$"
      hint_fnr_PTLMY_crown_administrative: "$hint_advisor_salute_administrative$"
      hint_fnr_PTLMY_crown_military: "$hint_advisor_salute_military$"
      hint_fnr_PTLMY_library: "The Library of Alexandria"
      hint_fnr_PTLMY_library_hint_text: "$hint_fnr_PTLMY_library_text_1$\n\n$fnr_PTLMY_scholarship_current$\n\n$fnr_PTLMY_library_tiers$\n\n$fnr_PTLMY_library_moves$\n\n$hint_fnr_PTLMY_library_text_2$"
      hint_fnr_PTLMY_library_text_1: "#Y Scholarship#! measures the Library and Mouseion we have rebuilt. It only grows, and its tier always appears among our country modifiers."
      hint_fnr_PTLMY_library_text_2: "@hint! #T Milestones#!\nAt #Y 25#!, #Y 50#!, #Y 100#!, #Y 150#! and #Y 200#! Scholarship, the scholars of Alexandria make a great discovery with a permanent bonus. The capstone advance needs #Y 150#!."
      hint_fnr_PTLMY_library_diplomatic: "$hint_advisor_salute_diplomatic$"
      hint_fnr_PTLMY_library_administrative: "$hint_advisor_salute_administrative$"
      hint_fnr_PTLMY_library_military: "$hint_advisor_salute_military$"
      hint_fnr_PTLMY_nile: "The Nile"
      hint_fnr_PTLMY_nile_hint_text: "$hint_fnr_PTLMY_nile_text_1$\n\n$fnr_PTLMY_granary_current$\n\n$hint_fnr_PTLMY_nile_text_2$"
      hint_fnr_PTLMY_nile_text_1: "Each year the Nile floods - #G bountiful#!, #Y good#!, #R low#! or #R failed#!. The result lasts a year and shows among our country modifiers."
      hint_fnr_PTLMY_nile_text_2: "@hint! #T Preparing for the bad years#!\nAfter a good or bountiful flood, #Y Fill the Royal Granaries#! (up to 3). A failed flood then uses one reserve and the people are fed. #Y Nilometers#! and the #Y Canal of the Pharaohs#! make good floods likelier. Spare grain can also be sent to the #Y League of the Islanders#!."
      hint_fnr_PTLMY_nile_diplomatic: "$hint_advisor_salute_diplomatic$"
      hint_fnr_PTLMY_nile_administrative: "$hint_advisor_salute_administrative$"
      hint_fnr_PTLMY_nile_military: "$hint_advisor_salute_military$"
      fnr_PTLMY_crown_current: "#Y Basileus and Pharaoh#! is currently #Y [GetPlayer.MakeScope.GetVariable('fnr_PTLMY_crown').GetValue|0]#! (from -100 Pharaoh to +100 Basileus)"
      fnr_PTLMY_crown_tiers: "#T Tiers#!\n- #Y Living Horus#! at -60 and below\n- #Y Lord of the Two Lands#! from -59 to -20\n- #Y The Double Crown#! from -19 to 19\n- #Y Macedonian Court#! from 20 to 59\n- #Y Basileus of Alexandria#! at 60 and above"
      fnr_PTLMY_crown_moves: "#T What moves it#!\n- Each year it drifts #Y 2#! points towards 0.\n- #Y Towards the Basileus#! - a capital at Alexandria, the Kleruchoi, Hellenistic Basileia, Greek Tax Farmers, founding a Greek Polis.\n- #Y Towards the Pharaoh#! - a capital elsewhere, the Priests of Ptah, the Machimoi, Pharaonic Kingship, the Temple Economy, being crowned at Memphis, honouring the temples."
      fnr_PTLMY_scholarship_current: "#Y Scholarship#! is currently #Y [GetPlayer.MakeScope.GetVariable('fnr_PTLMY_scholarship').GetValue|0]#!"
      fnr_PTLMY_library_tiers: "#T Tiers#!\n- #Y Scrolls Gathered#! below 25\n- #Y A Growing Library#! from 25\n- #Y The Great Library#! from 75\n- #Y Light of the World#! from 150"
      fnr_PTLMY_library_moves: "#T What raises it#!\n- #G +1#! a year for holding Alexandria, #G +2#! for the Mouseion, #G +3#! for the Great Library, #G +1#! for the Scholars of the Mouseion, #G +1#! with a Macedonian Court and #G +1#! more as Basileus.\n- Inviting great scholars, searching the ships for books and stipends for visiting scholars."
      fnr_PTLMY_granary_current: "#Y Royal Granaries#! hold #Y [GetPlayer.MakeScope.GetVariable('fnr_PTLMY_granary').GetValue|0]#! of 3 reserves"
      fnr_PTLMY_formation_tt: "The #Y House of Ptolemy#! rules Egypt. Where it came from sets our starting #Y Basileus and Pharaoh#! and #Y Scholarship#!."
      fnr_PTLMY_systems_tt: "#T The Ptolemaic Kingdom#!\n- #Y Basileus and Pharaoh#! - balance the Greek court against the Egyptian temples.\n- #Y The Library of Alexandria#! - rebuild it, and the scholars will change the world.\n- #Y The Nile#! - every year's flood decides the harvest; fill the granaries in the good years.\n- #Y The House of Ptolemy#! - every new ruler takes an epithet, and rival siblings may claim the throne.\nAll appear among our country modifiers, and the #Y Hints#! panel explains them."
      fnr_PTLMY_native_pharaohs: "The Native Pharaohs"
      fnr_PTLMY_native_pharaohs_country: "$fnr_PTLMY_native_pharaohs$"
      fnr_PTLMY_native_pharaohs_country_adjective: "Theban"
      fnr_PTLMY_lagid_pretenders: "The Lagid Pretender"
      fnr_PTLMY_lagid_pretenders_country: "$fnr_PTLMY_lagid_pretenders$"
      fnr_PTLMY_lagid_pretenders_country_adjective: "Lagid"
      fnr_PTLMY.51.title: "Aegyptus Provincia"
      diplomatic_status_fnr_PTLMY_nesiotic_league_name: "League of the Islanders"
      diplomatic_status_fnr_PTLMY_nesiotic_league_tooltip: "Both are members of the #Y League of the Islanders#!"

    # The Thebaid unbowed (disaster ending without victory)
      fnr_PTLMY.65.title: "The Thebaid Unbowed"
      fnr_PTLMY.65.desc: "Fifteen years of war in the south have ended without victory. The rebels have melted back into the villages of the Thebaid, and to make peace with the temples the court must give way."
      fnr_PTLMY.65.a: "Make peace with the priests."
