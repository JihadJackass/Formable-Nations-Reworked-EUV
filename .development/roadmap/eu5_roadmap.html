<!DOCTYPE html>
<html lang="en">
<head>

<title>JihadiJackass Studios — EU5 Content Roadmap</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<!-- ==========================================================================
     EVERYTHING YOU EDIT LIVES IN THIS ONE SCRIPT BLOCK.
     Nothing below it needs touching to add, remove, reorder or restyle a pack.
     ========================================================================== -->
<script>

/* --------------------------------------------------------------------------
   1. PAGE SETTINGS
   -------------------------------------------------------------------------- */
const CONFIG = {
  studio:        "JihadiJackass Studios",
  game:          "Europa Universalis V",
  title:         "Content Roadmap",
  note:          "Every nation listed is new or fully reworked. Order is release order, not release dates.",

  canvasWidth:   1600,   // px. Height grows automatically to fit your content.
  minHeight:     900,    // px. Keeps 16:9 until you add enough packs to need more.
  gridColumns:   6       // columns in the lower "Also planned" grid
};

/* --------------------------------------------------------------------------
   2. STATUSES
   Add your own here — "coin" picks the medallion style.
   coin options: "minted" (brass, shipped) | "indie" (verdigris, in progress) | "blank" (dim, not started)
   -------------------------------------------------------------------------- */

  released: { label: "Released",       coin: "minted" },
  dev:      { label: "In development", coin: "indie"  },
  planned:  { label: "Planned",        coin: "blank"  },
  testing:  { label: "In testing",     coin: "indie"  }

/* --------------------------------------------------------------------------
   3. FEATURED PACKS — the big panels across the top.
   Add or remove entries freely; panels resize themselves.
   Four fits comfortably at 1600px wide, five is tight, three looks generous.

   name    : pack title
   sub     : one-line description under the title
   status  : a key from STATUSES above
   listLabel : heading over the nation list (defaults to "Nations")
   nations : array of names
   stats   : array of lines. Wrap figures in <b></b> to highlight them in brass.
             Use { text: "...", muted: true } for a greyed "coming later" line.
   -------------------------------------------------------------------------- */

  {

    nations: [

    ],

  },
  {

    sub: "Bronze Age rework &amp; update",
    status: "dev",
    listLabel: "16 nations &mdash; 13 new",
    nations: [
      "Babylon", "Assyria", "Assyrian Empire",
      "Egypt", "Hittite Empire", "Minoan Crete",
      "Troy", "Elam", "Mycenae",
      "Mitanni", "Ugarit", "Sumer",

    ],
    stats: [

      "<b>32</b> units &middot; <b>38+</b> buildings &middot; <b>22</b> reforms",

/* --------------------------------------------------------------------------
   4. UPCOMING PACKS — the compact grid underneath.
   Just name + hook. Numbering continues on from the featured packs

  { name: "Deus Vult",            hook: "Crusader states and Outremer" },

</script>


<!-- ==========================================================================
     STYLING. Palette lives in :root — change those six values and the whole
     plate follows. You shouldn't need anything else in here day to day.
     ========================================================================== -->
<style>
  :root{
    /* --- palette --- */
    --ink:        #0d100c;   /* deepest background */
    --ink-2:      #161a14;   /* mid background */
    --ink-3:      #1e231c;   /* coin face */
    --bone:       #e9e3d3;   /* primary text */
    --bone-dim:   #a49d8b;   /* secondary text */
    --bone-faint: #6f6a5c;   /* tertiary text, "planned" state */
    --brass:      #c9a43e;   /* accent, shipped state */
    --brass-lo:   #8a712a;   /* accent, dimmed */
    --verdigris:  #5b9280;   /* in-progress state */
    --line:       rgba(201,164,62,.24);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    background:#070906;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    min-height:100vh;
    padding:20px;
    font-family:'Spectral',Georgia,serif;
  }

  /* ---------- the canvas you screenshot ---------- */
  .stage{
    position:relative;
    flex:none;
    overflow:hidden;
    padding:26px 34px 20px;
    display:flex;
    flex-direction:column;
    color:var(--bone);
    background:radial-gradient(120% 90% at 50% -20%, #22281f 0%, var(--ink-2) 42%, var(--ink) 100%);
    box-shadow:0 0 0 1px rgba(201,164,62,.28), 0 24px 70px rgba(0,0,0,.7);
  }
  /* engraved hairlines */
  .stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0px,rgba(255,255,255,.022) 1px,transparent 1px,transparent 4px);
  }
  /* corner vignette */
  .stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(100% 75% at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%);
  }

  .plate{position:relative;z-index:2;display:flex;flex-direction:column;flex:1}

  /* ---------- header ---------- */
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}

  .eyebrow{
    font-family:'IBM Plex Mono',"Courier New",monospace;
    font-size:11px;letter-spacing:.30em;text-transform:uppercase;
    color:var(--brass);margin-bottom:7px;
  }
  .title{
    font-family:'Cinzel',"Times New Roman",serif;font-weight:700;
    font-size:42px;line-height:.96;letter-spacing:.055em;
    text-shadow:0 1px 0 rgba(0,0,0,.8);
  }
  .head-note{
    text-align:right;font-size:12.5px;line-height:1.5;
    color:var(--bone-dim);max-width:340px;font-style:italic;
  }
  .rule{margin-top:13px;height:2px;background:linear-gradient(90deg,var(--brass) 0%,var(--brass-lo) 30%,rgba(138,113,42,.1) 100%)}

  /* ---------- section headings ---------- */
  .sec{
    display:flex;align-items:center;gap:12px;
    font-family:'IBM Plex Mono',"Courier New",monospace;
    font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--brass-lo);margin:15px 0 9px;
  }
  .sec span{flex:none}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---------- featured panels ---------- */
  .row{display:flex;gap:14px;align-items:stretch}

  .panel{
    position:relative;display:flex;flex-direction:column;flex:1;min-width:0;
    padding:14px 15px 12px;
    background:linear-gradient(175deg,rgba(255,255,255,.045),rgba(0,0,0,.22));
    border:1px solid var(--line);
  }
  /* the rail that runs behind every panel head */
  .panel::before{
    content:"";position:absolute;left:0;right:0;top:44px;height:1px;
    background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent);
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:2}

  /* ---------- struck coin ---------- */
  .coin{width:58px;height:58px;flex:none;display:block}
  .coin .flan{fill:var(--ink-3);stroke:var(--brass-lo);stroke-width:1.5}
  .coin .milled{fill:none;stroke:var(--brass-lo);stroke-width:2.2;stroke-dasharray:2 4;opacity:.85}
  .coin .field{fill:none;stroke:var(--brass-lo);stroke-width:1;opacity:.6}
  .coin .numeral{font-family:'Cinzel',"Times New Roman",serif;font-weight:700;font-size:18px;fill:var(--brass);text-anchor:middle}

  .coin.minted .flan{fill:#2a2617;stroke:var(--brass)}
  .coin.minted .milled{stroke:var(--brass);opacity:1}
  .coin.minted .numeral{fill:#f0d98a}

  .coin.indie .flan{stroke:var(--verdigris)}
  .coin.indie .milled{stroke:var(--verdigris);opacity:.95}
  .coin.indie .field{stroke:var(--verdigris);opacity:.5}
  .coin.indie .numeral{fill:var(--verdigris)}

  .coin.blank .flan{stroke:#4a4638}
  .coin.blank .milled{stroke:#4a4638;opacity:.7}
  .coin.blank .field{stroke:#4a4638;opacity:.4}
  .coin.blank .numeral{fill:var(--bone-faint)}

  /* ---------- status pill ---------- */
  .status{
    font-family:'IBM Plex Mono',"Courier New",monospace;
    font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
    padding:5px 8px;border:1px solid currentColor;white-space:nowrap;
  }
  .status.minted{color:var(--brass)}
  .status.indie{color:var(--verdigris)}
  .status.blank{color:var(--bone-faint)}

  /* ---------- panel body ---------- */
  .name{
    font-family:'Cinzel',"Times New Roman",serif;font-weight:700;
    font-size:22px;letter-spacing:.04em;margin-top:13px;line-height:1.1;
  }
  .sub{font-size:12px;color:var(--bone-dim);font-style:italic;margin-top:3px}

  .label{
    font-family:'IBM Plex Mono',"Courier New",monospace;
    font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--brass-lo);margin:12px 0 6px;padding-bottom:5px;
    border-bottom:1px solid var(--line);
  }

  .nations{columns:2;column-gap:12px;font-size:12px;line-height:1.58;color:var(--bone)}
  .nations.single{columns:1}
  .nations li{list-style:none;break-inside:avoid}
  .nations li::before{content:"·";color:var(--brass);margin-right:5px}

  .stats{
    margin-top:auto;padding-top:9px;border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',"Courier New",monospace;
    font-size:10px;line-height:1.8;color:var(--bone-dim);
  }
  .stats b{color:var(--brass);font-weight:500}
  .stats .muted{color:var(--bone-faint)}

  /* ---------- upcoming grid ---------- */
  .grid{display:grid;gap:9px}

  .pack{
    padding:9px 11px 10px;
    border:1px solid rgba(201,164,62,.15);
    background:rgba(255,255,255,.022);
    min-width:0;
  }
  .pack .no{
    font-family:'IBM Plex Mono',"Courier New",monospace;
    font-size:9px;letter-spacing:.14em;color:var(--brass-lo);
  }
  .pack h3{
    font-family:'Cinzel',"Times New Roman",serif;font-weight:600;
    font-size:13.5px;letter-spacing:.02em;line-height:1.2;margin:3px 0 4px;
    color:var(--bone);
  }
  .pack p{font-size:11px;line-height:1.4;color:var(--bone-faint);font-style:italic}

  /* ---------- footer ---------- */
  .foot{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:auto;padding-top:11px;border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',"Courier New",monospace;
    font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-faint);
  }
  .foot .mark{color:var(--brass)}
  .key{display:flex;gap:18px}
  .key i{font-style:normal}
  .key i.minted{color:var(--brass)}
  .key i.indie{color:var(--verdigris)}
  .key i.blank{color:var(--bone-faint)}
</style>


<!-- The page builds itself in here. -->
<div id="roadmap"></div>


<!-- ==========================================================================
     RENDERER. You don't need to edit anything past this point.
     ========================================================================== -->
<script>

/* Turn 1, 2, 3... into I, II, III... */
function roman(n){
  const table = [[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  let out = "";
  while (n > 0) {
    for (const [value, letter] of table) {
      if (n >= value) { out += letter; n -= value; break; }
    }
  }
  return out;
}

/* A struck-coin medallion carrying the release numeral */
function coin(style, numeral){
  return `
    <svg class="coin ${style}" viewBox="0 0 58 58" aria-hidden="true">
      <circle class="flan"   cx="29" cy="29" r="26"/>
      <circle class="milled" cx="29" cy="29" r="26"/>
      <circle class="field"  cx="29" cy="29" r="20"/>
      <text class="numeral" x="29" y="35">${numeral}</text>
    </svg>`;
}

/* One big panel */
function featuredPanel(pack, number){
  const status = STATUSES[pack.status] || STATUSES.planned;
  const nations = pack.nations || [];
  const stats = (pack.stats || []).map(line => {
    const isObject = typeof line === "object";
    const text = isObject ? line.text : line;
    const cls  = isObject && line.muted ? ' class="muted"' : "";
    return `<div${cls}>${text}</div>`;
  }).join("");

  return `
    <section class="panel">
      <div class="panel-head">
        ${coin(status.coin, roman(number))}
        <span class="status ${status.coin}">${status.label}</span>
      </div>
      <h2 class="name">${pack.name}</h2>
      <p class="sub">${pack.sub || ""}</p>
      <p class="label">${pack.listLabel || "Nations"}</p>
      <ul class="nations${nations.length <= 5 ? " single" : ""}">
        ${nations.map(n => `<li>${n}</li>`).join("")}
      </ul>
      <div class="stats">${stats}</div>
    </section>`;
}

/* One compact grid cell */
function upcomingCell(pack, number){
  return `
    <div class="pack">
      <div class="no">${roman(number)}</div>
      <h3>${pack.name}</h3>
      <p>${pack.hook || ""}</p>
    </div>`;
}

/* Footer key, showing only the statuses actually in use */
function statusKey(){
  const used = new Set(FEATURED.map(p => p.status));
  return [...used]
    .map(key => STATUSES[key])
    .filter(Boolean)
    .map(s => `<i class="${s.coin}">&#9679; ${s.label}</i>`)
    .join("");
}

/* Assemble the plate */
document.getElementById("roadmap").innerHTML = `
  <div class="stage" style="width:${CONFIG.canvasWidth}px;min-height:${CONFIG.minHeight}px">
    <div class="plate">

      <header class="head">
        <div>
          <div class="eyebrow">${CONFIG.studio} &middot; ${CONFIG.game}</div>
          <h1 class="title">${CONFIG.title}</h1>
        </div>
        <p class="head-note">${CONFIG.note}</p>
      </header>
      <div class="rule"></div>

      <div class="sec"><span>${HEADINGS.featured}</span></div>
      <div class="row">
        ${FEATURED.map((pack, i) => featuredPanel(pack, i + 1)).join("")}
      </div>

      <div class="sec"><span>${HEADINGS.upcoming}</span></div>
      <div class="grid" style="grid-template-columns:repeat(${CONFIG.gridColumns},1fr)">
        ${UPCOMING.map((pack, i) => upcomingCell(pack, FEATURED.length + i + 1)).join("")}
      </div>

      <footer class="foot">
        <span class="mark">${CONFIG.studio}</span>
        <span class="key">${statusKey()}</span>
      </footer>

    </div>
  </div>`;

</script>

</body>
</html>
